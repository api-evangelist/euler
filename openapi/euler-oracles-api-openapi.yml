openapi: 3.2.0
info:
  title: Euler Data API (V3) Oracles API
  version: 3.0.0
  description: 'API specification for Euler Data v3. This spec defines the current

    resource-oriented contract for the platform, with emphasis on consistent

    schemas, predictable REST semantics, caching, observability, and a uniform

    developer experience. This public document covers unauthenticated endpoints and integrations that

    use API keys, including capability-scoped keys. Browser-session Toolbox

    operations, admin-secret operations, and the Prometheus endpoint are served

    separately and are intentionally omitted. Migration notes

    - Euler Data v3 is not a path-for-path clone of v1/v2. Some endpoints map

    directly, some require multiple v3 calls, and some legacy aggregates were

    intentionally removed. - The live migration guide explains how legacy v1/v2

    endpoints and payloads map into the v3 resource model. - Important semantic changes:

    - Vault base APY and rewards APY are exposed separately in v3. - Account positions are flattened into account-vault rows instead of the

    legacy nested sub-account shape. - All supported API paths live under `/v3`; legacy paths return `410`. - Summary endpoints prefer smaller, focused resources over large

    BFF-style payloads. Base path: /v3


    Conventions

    - JSON field naming: camelCase

    - Addresses: accept lowercase or checksum; responses are EIP-55 checksummed

    - Public APY values (`*Apy`, `apy*`): percent numbers with 6 decimal places (e.g., 5.123456 = 5.123456%)

    - Contract interest-rate fields (`borrowAPY`, `supplyAPY` in `interestRates`): decimal strings in contract fraction units

    - Ratios (utilization, LTV, etc.): numbers with 6 decimal places

    - Response timestamps: ISO-8601 strings (UTC). Some legacy fields still expose unix

    seconds for compatibility and include `*Iso` companions. - Query time ranges: unix seconds (from/to)


    Unit policy

    - v3 separates market metadata from contract verdicts by both name and type. - Market-normalized USD prices and USD values are JSON numbers. These are values

    derived from off-chain pricing, cached price snapshots, or API-level market math. This includes `/v3/prices`, token price routes, vault/earn/protocol USD totals,

    portfolio market values, portfolio USD liquidation/risk fields such as

    `liabilityValueUsd`, `totalCollateralValueUsd`, `borrowLiquidationPriceUsd`,

    and `collateralLiquidationPricesUsd`, and vault holder `assetsUsd`. - Contract-derived oracle and raw account-liquidity verdict values are exact strings. These preserve the integer value used by contracts, normalized to 18 decimals

    for API exposure. Oracle prices are quoted in the vault unit of account, which

    can be USD, ETH, or another asset. This includes `/v3/oracles/prices`, raw

    account-liquidity `liabilityValue` and `totalCollateralValue` objects,

    `liabilityValueBorrowing`, `liabilityValueLiquidation`, and collateral verdict

    values. - On-chain token quantities are bigint strings in their native unit scale. This

    includes amounts, balances, shares, assets, borrows, reward amounts, liquidation

    repay/yield amounts, and block numbers. - Caps are also bigint strings, but EVK caps are exposed as resolved underlying

    asset-unit amounts rather than packed contract config words; an unlimited EVK cap is

    type(uint256).max and `0` is a zero cap. The exceptions are

    cap-history and config-history, which carry the raw uint16 encodings. - LTV config values use canonical basis-point strings. Legacy decimal aliases

    may remain on config-history payloads for compatibility when explicitly named. Rate limiting

    - Optional API keys for higher limits

    - Standard limits are 1000 req/min for unauthenticated callers (IP-based)

    and 10000 req/min for authenticated callers (per API key), with a 60s window. Individual API keys can carry a custom limit. - By default, proxy headers are not trusted for IP identity unless explicitly enabled. - Redis failures default to fail-closed (503) for strict enforcement; fail-open is opt-in. - RateLimit-* (IETF draft-6) and legacy X-RateLimit-* headers are returned.'
servers:
- url: /
  description: Current environment
security: []
tags:
- name: Oracles
  description: Oracle routing, adapter, and price-source inspection endpoints. Price provenance is exposed only as `onchain`, `offchain`, or `hardcoded`.
paths:
  /v3/oracles/adapter-assessments:
    get:
      tags:
      - Oracles
      summary: Oracle adapter assessments
      description: Returns persisted recognition and health findings for adapters discovered on one chain. Needs the `assessments` chain capability; a chain without it answers 404 `CHAIN_CAPABILITY_DISABLED`.
      x-status: implemented
      x-chain-capability: assessments
      x-cache-ttl: 300
      parameters:
      - name: chainId
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      - name: recognized
        in: query
        required: false
        schema:
          type: boolean
      - name: active
        in: query
        required: false
        description: Filter on current active-route membership.
        schema:
          type: boolean
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Oracle adapter assessments
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OracleAdapterAssessment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404ChainCapability'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: listOracleAdapterAssessments
  /v3/oracles/adapter-assessments/{address}:
    get:
      tags:
      - Oracles
      summary: Oracle adapter assessment
      description: Returns the persisted recognition and health findings for one adapter on one chain. Needs the `assessments` chain capability; a chain without it answers 404 `CHAIN_CAPABILITY_DISABLED`.
      x-status: implemented
      x-chain-capability: assessments
      x-cache-ttl: 300
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - name: chainId
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Oracle adapter assessment
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OracleAdapterAssessment'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404ChainCapability'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getOracleAdapterAssessment
  /v3/oracles/adapter-assessments/evaluate:
    post:
      tags:
      - Oracles
      summary: Evaluate an oracle adapter without recording it
      description: 'Runs the adapter policy against the address at one pinned block and answers the verdict

        in the stored assessment''s shape. Nothing is written: no registry row, no assessment; the

        adapter is recorded when a router installs it (the indexer''s `ConfigSet` handler) or when

        the hourly router-history sweep finds it. Cross-adapter legs the registry does not know

        are evaluated inline at the same block, two levels deep, and reported in `legs`; Pyth

        reads carry a fresh Hermes update like the stored checks. The address must have bytecode

        on the chain (422 otherwise), one address is evaluated at most 6 times per minute (429 with

        `Retry-After`), a repeated request within 30 seconds answers the same evaluation, and the

        on-chain reads are given 12 seconds (504 when exceeded). Accepts a platform session or a

        API key holding `assessments:evaluate`; a curator session is never enough.


        Needs the `assessments` chain capability; a chain without it answers 404

        `CHAIN_CAPABILITY_DISABLED`.'
      x-status: implemented
      x-chain-capability: assessments
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OracleAdapterEvaluationRequest'
      responses:
        '200':
          description: The evaluate-only verdict; `persisted` is always false.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/OracleAdapterEvaluation'
        '400':
          description: Malformed JSON request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: A key without `assessments:evaluate`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The chain is not served by this deployment (`CHAIN_NOT_SUPPORTED`), or does not run assessments (`CHAIN_CAPABILITY_DISABLED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          description: A body that is not `{ chainId, address }` (`error.details.issues`), or no contract is deployed at the address (`error.details.blockNumber` names the block checked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The address was evaluated more than 6 times in the last minute; `Retry-After` and `error.details.retryAfterSeconds` say when to retry.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          description: The on-chain reads did not finish within the 12-second budget (`UPSTREAM_TIMEOUT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: evaluateOracleAdapter
  /v3/oracles/prices:
    get:
      tags:
      - Oracles
      summary: Vault-scoped oracle prices
      description: 'Supports exact mode (`chainId + vault + asset`) and list mode (`chainId` + pagination).

        - Exact mode requires the full key.

        - Exact mode returns `200` with `price: null` when the tuple is known but currently unpriced.

        - Non-null `price` values are exact contract-derived prices encoded as 18-decimal bigint strings in `unitOfAccount` terms.

        - Exact mode returns `404` only when the `(chainId, vault, asset)` tuple is unknown.

        - Partial exact key requests return `400`.

        - List mode returns flat rows sorted by `vault ASC, asset ASC`.'
      x-status: implemented
      x-cache-ttl: 60
      parameters:
      - name: chainId
        in: query
        required: true
        schema:
          type: integer
      - name: vault
        in: query
        required: false
        schema:
          type: string
      - name: asset
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Oracle prices
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                    - type: object
                      properties:
                        chainId:
                          type: integer
                        vault:
                          type: string
                        asset:
                          type: string
                        price:
                          type: string
                          nullable: true
                        unitOfAccount:
                          type: string
                          nullable: true
                        unitOfAccountDecimals:
                          type: integer
                          nullable: true
                        source:
                          type: string
                          enum:
                          - onchain
                          - offchain
                          - hardcoded
                          nullable: true
                        timestamp:
                          type: string
                          format: date-time
                          nullable: true
                    - type: array
                      items:
                        type: object
                        properties:
                          chainId:
                            type: integer
                          vault:
                            type: string
                          asset:
                            type: string
                          price:
                            type: string
                            nullable: true
                          unitOfAccount:
                            type: string
                            nullable: true
                          unitOfAccountDecimals:
                            type: integer
                            nullable: true
                          source:
                            type: string
                            enum:
                            - onchain
                            - offchain
                            - hardcoded
                            nullable: true
                          timestamp:
                            type: string
                            format: date-time
                            nullable: true
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '502':
          $ref: '#/components/responses/Error502'
      operationId: getOraclesPrices
  /v3/oracles/routers:
    get:
      tags:
      - Oracles
      summary: Oracle router state
      description: 'Factory-deployed EulerRouter list with latest indexed config and resolved-vault state.

        - `chainId` is required.

        - Optional filters: `vault`, `adapter`, `offset`, `limit`.'
      x-status: implemented
      x-cache-ttl: 300
      parameters:
      - name: chainId
        in: query
        required: true
        schema:
          type: integer
      - name: vault
        in: query
        required: false
        schema:
          type: string
      - name: adapter
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Router states
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OracleRouterState'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getOraclesRouters
  /v3/oracles/historical-adapters:
    get:
      tags:
      - Oracles
      summary: Historical oracle adapters
      description: 'Distinct oracle adapter addresses ever configured through `ConfigSet` events

        on any EulerRouter deployed by OracleRouterFactory for the requested chain.

        - `chainId` is required.

        - Supports `offset` and `limit`.'
      x-status: implemented
      x-cache-ttl: 300
      parameters:
      - name: chainId
        in: query
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Historical adapter addresses
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        chainId:
                          type: integer
                        adapter:
                          type: string
                        firstSeenTimestamp:
                          type: string
                          format: date-time
                        lastSeenTimestamp:
                          type: string
                          format: date-time
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getOraclesHistoricalAdapters
components:
  schemas:
    PaginationMeta:
      type: object
      required:
      - timestamp
      properties:
        total:
          type: integer
          description: Exact total count when the endpoint provides one.
        hasMore:
          type: boolean
          description: Indicates whether another page exists beyond the current page.
        offset:
          type: integer
        limit:
          type: integer
          description: Echoed page size after endpoint-side clamping.
        outcome:
          type: string
          enum:
          - disabled
          - removed
          description: On a toolbox config DELETE, what happened to the row.
        products:
          type: array
          description: 'On a curation vault `POST`, `PUT`, or `PATCH`: the products the write touched (the one the vault left and the one it joined) as they are after the write, `governanceMode` included, so the caller applies them instead of re-reading.'
          items:
            $ref: '#/components/schemas/ProductLabels'
        timestamp:
          type: string
          format: date-time
        chainId:
          type: string
          description: Comma-separated chain IDs for multi-chain responses.
        degradedProviders:
          type: array
          items:
            type: string
          description: Live providers whose data is incomplete in this response.
        excludedChains:
          $ref: '#/components/schemas/ExcludedChains'
    OracleAdapterEvaluationLeg:
      type: object
      additionalProperties: false
      required:
      - address
      - recognized
      - source
      properties:
        address:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        recognized:
          type: boolean
          nullable: true
        source:
          type: string
          enum:
          - stored
          - evaluated
          - unknown
          description: '`stored`: the registry already held the leg''s verdict. `evaluated`: the leg was judged in this pass, at the same block. `unknown`: neither (deeper than two levels, or a cycle); the parent''s cross-legs rule stays unknown.'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              description: 'Domain error code. Examples:

                - BAD_REQUEST

                - INVALID_ADDRESS

                - INVALID_CHAIN_ID

                - CHAIN_NOT_SUPPORTED

                - CHAIN_CAPABILITY_DISABLED

                - NOT_FOUND

                - VAULT_NOT_FOUND

                - TOKEN_NOT_FOUND

                - ACCOUNT_NOT_FOUND

                - VALIDATION_ERROR

                - CONFLICT

                - PRECONDITION_FAILED

                - PAYLOAD_TOO_LARGE

                - RATE_LIMIT_EXCEEDED

                - UNSUPPORTED_MEDIA_TYPE

                - UPSTREAM_TIMEOUT

                - UNAUTHORIZED

                - FORBIDDEN

                - SERVICE_UNAVAILABLE

                - SERVICE_DISABLED

                - INTERNAL_ERROR

                '
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Context of the error. Where present, `details.reason` is a stable kebab-case value to key on, and `details.cause` narrows a reason that has several causes. The labels routes list theirs in the Labels tag.
    ListingFlag:
      type: boolean
      nullable: true
      description: Curator listing flag. `null` leaves the decision to platform overrides and deprecation, `true` hides the vault(s) from discovery, `false` keeps a deprecated vault listed.
    OracleAdapterAssessmentSummary:
      type: object
      additionalProperties: false
      required:
      - passed
      - failed
      - unknown
      - notApplicable
      properties:
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
        notApplicable:
          type: integer
          minimum: 0
        accepted:
          type: integer
          minimum: 0
          description: Failures accepted by adapter-check-exemption entries; present only when there is one.
    LabelHoldSummary:
      description: What a draft read shows on a held row.
      type: object
      required:
      - id
      - kind
      - reason
      - since
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - quarantine
          - entity-hold
        reason:
          type: string
        since:
          type: string
          format: date-time
    OracleRouterConfig:
      type: object
      properties:
        asset0:
          type: string
        asset1:
          type: string
        oracle:
          type: string
        blockNumber:
          type: string
        timestamp:
          type: string
          format: date-time
        txHash:
          type: string
    OracleAdapterAssessmentFinding:
      type: object
      additionalProperties: false
      required:
      - key
      - outcome
      - severity
      - description
      properties:
        key:
          type: string
          description: Stable rule key from the adapter rule catalog, listed in `x-finding-keys`. Keys are never renamed, only added.
          x-finding-keys:
          - adapter-class-known
          - adapter-exists
          - asset-consistent
          - assets-distinct
          - chronicle-feed-recognized
          - cross-legs-recognized
          - custom-adapter-recognized
          - custom-adapter-scope
          - feed-not-deprecated
          - feed-recognized
          - lido-oracle-official
          - linear-discount-pt-correspondence
          - linear-discount-rate-sane
          - linear-discount-staleness-config
          - pendle-market-expired
          - pendle-pool-recognized
          - push-staleness-buffer
          - push-staleness-upper-bound
          - pyth-base-correspondence
          - pyth-conf-width-range
          - pyth-feed-recognized
          - pyth-proxy-official
          - pyth-quote-correspondence
          - pyth-staleness-range
          - quote-liveness
          - quote-price-consistency
          - session-tolerance
          - source-provenance
          - xstocks-pause-config
        outcome:
          type: string
          enum:
          - pass
          - fail
          - unknown
          - not_applicable
        severity:
          type: string
          enum:
          - high
          - medium
          - low
          - info
        description:
          type: string
        expected: {}
        observed: {}
        exempted:
          type: boolean
          description: A failure the platform accepted through an adapter-check-exemption trust entry; not counted in checksStatus and not forwarded to vaults.
    ExcludedChains:
      type: array
      description: 'On a read across chains that names no `chainId`: the served chains it left out because they do not run the capability the operation needs, rather than reading them as empty. Absent when no chain was left out.'
      items:
        type: object
        required:
        - chainId
        - capability
        properties:
          chainId:
            type: integer
          capability:
            type: string
            enum:
            - indexing
            - activity
            - prices
            - historicalPrices
            - assessments
            - labels
            - logos
            - stats
            - risk
            - rewards
            - apys
    ProductPlatformListing:
      description: The platform-owned discovery decision on a product, as a product row shows it.
      type: object
      required:
      - notExplorableLend
      - notExplorableBorrow
      - reason
      properties:
        notExplorableLend:
          type: boolean
        notExplorableBorrow:
          type: boolean
        reason:
          type: string
          nullable: true
    OracleAdapterEvaluation:
      description: 'An evaluate-only verdict: the stored assessment''s fields (`inActiveRoute` is false; `lastCheckedAt`, `schedulingTier` and `nextCheckAt` are null, since nothing is recorded) plus `persisted`, the pinned block hash and the legs judged on the way.'
      type: object
      additionalProperties: false
      required:
      - chainId
      - address
      - recognized
      - checksStatus
      - reason
      - inActiveRoute
      - adapterClass
      - label
      - provider
      - methodology
      - model
      - config
      - findings
      - summary
      - policyId
      - policyVersion
      - blockNumber
      - evaluatedAt
      - lastCheckedAt
      - schedulingTier
      - nextCheckAt
      - persisted
      - blockHash
      - quoteTolerant
      - legs
      properties:
        chainId:
          type: integer
          minimum: 1
        address:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        recognized:
          type: boolean
        checksStatus:
          type: string
          enum:
          - positive
          - warning
          - negative
          nullable: true
          description: 'Health verdict of a recognized adapter. Always null for unrecognized adapters: identity and health are orthogonal, and no health claim is made about a contract whose getters are untrusted.'
        reason:
          type: string
          nullable: true
        inActiveRoute:
          type: boolean
          description: True when a current router configuration of a vault-backed router routes through this adapter, directly or as a cross-adapter leg. Refreshed hourly by the universe reconciler.
        adapterClass:
          type: string
          enum:
          - ChainlinkOracle
          - ChainlinkInfrequentOracle
          - ChainlinkInfrequentNanosecondOracle
          - ChainlinkInfrequentXStocksOracle
          - ChronicleOracle
          - CrossAdapter
          - CurveEMAOracle
          - FixedRateOracle
          - IdleTranchesOracle
          - LidoOracle
          - LidoFundamentalOracle
          - PendleOracle
          - PendleUniversalOracle
          - PythOracle
          - RateProviderOracle
          - RedstoneCoreOracle
          - SwaapSafeguardOracle
          - UniswapV3Oracle
          nullable: true
        label:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        methodology:
          type: string
          enum:
          - Market Price
          - Market Price (Bolt)
          - Smart Value Recapture
          - Exchange Rate
          - TWAP
          - Custom
          - Unknown
          nullable: true
        model:
          type: string
          enum:
          - Push
          - Pull
          - Unknown
          nullable: true
        config:
          type: object
          additionalProperties: true
          nullable: true
        findings:
          type: array
          items:
            $ref: '#/components/schemas/OracleAdapterAssessmentFinding'
        summary:
          allOf:
          - $ref: '#/components/schemas/OracleAdapterAssessmentSummary'
          nullable: true
        policyId:
          type: string
          enum:
          - euler-oracle-adapter
          nullable: true
        policyVersion:
          type: integer
          minimum: 1
          nullable: true
        blockNumber:
          type: string
          pattern: ^\d+$
          nullable: true
        evaluatedAt:
          type: string
          format: date-time
          nullable: true
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        schedulingTier:
          type: string
          enum:
          - active
          - background
          - static
          nullable: true
          description: 'Which periodic sweep re-checks the adapter: `active` (hourly) when a vault in the active tier prices through it (current router pairs, nested routers expanded, cross legs followed), `background` (daily) otherwise. A router `ConfigSet` triggers an immediate check whatever the tier. Null on an evaluate-only answer.'
        nextCheckAt:
          type: string
          format: date-time
          nullable: true
          description: 'When the next check is expected: the due time when one is scheduled, else the last check plus the tier''s sweep interval; null while never checked with nothing scheduled, and on an evaluate-only answer.'
        persisted:
          type: boolean
          enum:
          - false
        blockHash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
        quoteTolerant:
          type: boolean
          description: True when the adapter's quote may legitimately revert (a pull-model or session-bound feed), as the stored checks judge it.
        legs:
          type: array
          items:
            $ref: '#/components/schemas/OracleAdapterEvaluationLeg'
    OracleRouterVault:
      type: object
      properties:
        vault:
          type: string
        asset:
          type: string
        blockNumber:
          type: string
        timestamp:
          type: string
          format: date-time
        txHash:
          type: string
    OracleAdapterEvaluationRequest:
      type: object
      additionalProperties: false
      required:
      - chainId
      - address
      properties:
        chainId:
          type: integer
          minimum: 1
        address:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: The adapter contract to evaluate; it need not be known to the registry.
    OracleRouterState:
      type: object
      properties:
        chainId:
          type: integer
        router:
          type: string
        deployer:
          type: string
        deployedAt:
          type: string
          format: date-time
        configs:
          type: array
          items:
            $ref: '#/components/schemas/OracleRouterConfig'
        vaults:
          type: array
          items:
            $ref: '#/components/schemas/OracleRouterVault'
    ResolvedProductLabels:
      type: object
      readOnly: true
      description: Read-time entity fallbacks for display. Derived, never stored.
      required:
      - entityName
      - url
      - logo
      properties:
        entityName:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          description: Product url, falling back to the owning entity url.
        logo:
          type: string
          nullable: true
          description: Product logo, falling back to the owning entity logo.
    ProductLabels:
      type: object
      required:
      - id
      - chainId
      - entityId
      - coBrandEntityIds
      - name
      - isDeprecated
      - notExplorable
      - governanceMode
      - resolved
      - anyExplorableLend
      - anyExplorableBorrow
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        chainId:
          type: integer
          minimum: 1
        entityId:
          type: string
        coBrandEntityIds:
          type: array
          description: Additional entities whose logos should be displayed. Product management remains exclusively with entityId.
          items:
            type: string
        name:
          type: string
        logo:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[Hh][Tt][Tt][Pp][Ss]://
          description: Absolute https URL.
        portfolioNotice:
          type: string
          nullable: true
        isDeprecated:
          type: boolean
        deprecationReason:
          type: string
          nullable: true
        notExplorable:
          allOf:
          - $ref: '#/components/schemas/ListingFlag'
          description: Product-wide curator listing flag applied to both sides of every member vault unless a vault-level flag overrides it.
        governanceMode:
          type: string
          enum:
          - governed
          - ungoverned
          - unknown
          readOnly: true
          description: Derived by the server from the on-chain governor of member vaults; clients cannot set it. Products are created as `unknown`. Every vault assignment recomputes the mode over the resulting member set and rejects sets that mix governed and ungoverned vaults. Layer 2 adopts `governed` or `ungoverned` for an `unknown` product once its membership verifies against chain state. Entity members cannot update or delete an `ungoverned` product or its vaults after the initial assignment.
        resolved:
          $ref: '#/components/schemas/ResolvedProductLabels'
        anyExplorableLend:
          type: boolean
          readOnly: true
          description: True when at least one member vault is lend-discoverable per the materialized visibility verdicts. Live chain state (e.g. borrowability) is deliberately excluded.
        anyExplorableBorrow:
          type: boolean
          readOnly: true
          description: True when at least one member vault is borrow-discoverable per the materialized visibility verdicts. Live chain state (e.g. borrowability) is deliberately excluded.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        hold:
          type: object
          nullable: true
          description: The hold covering this row on a draft read; absent on published reads.
          allOf:
          - $ref: '#/components/schemas/LabelHoldSummary'
        platformListing:
          type: object
          nullable: true
          description: Euler's listing override on this product, shown to platform sessions on draft reads (null when there is none); absent on published reads and to curators.
          allOf:
          - $ref: '#/components/schemas/ProductPlatformListing'
    OracleAdapterAssessment:
      type: object
      additionalProperties: false
      required:
