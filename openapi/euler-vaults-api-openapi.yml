  /v3/evk/vaults/open-interest:
    get:
      tags:
      - Vaults
      summary: Open interest across vaults
      description: Event-based aggregation of total borrows and borrower counts. Uses MV-backed query path (`open_interest_debt_mv`) with safe fallback to raw aggregation when unavailable. Prices should be composed separately via /v3/prices.
      x-status: implemented
