                          type: string
                        asset:
                          type: string
                        totalBorrows:
                          type: string
                        borrowerCount:
                          type: integer
                          minimum: 0
                          description: Number of indexed account-vault positions with positive event-derived debt. Subaccounts count separately. Controller registrations with zero debt are excluded.
                        timestamp:
