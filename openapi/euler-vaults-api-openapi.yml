  /v3/evk/vaults/open-interest/by-collateral:
    get:
      tags:
      - Vaults
      summary: Collateral-covered debt by collateral vault
      description: 'Collateral-covered USD borrow exposure as a nested map keyed by borrow vault, then collateral vault. Underwater debt is capped at current attributable collateral value, so this endpoint is not gross open interest. The expensive account-level debt/collateral composition is worker-computed and stored in a latest projection table; the request path only reads that projection. Redis may cache this response, but PostgreSQL projection rows are the source of truth.

        Needs the `risk` chain capability; a chain without it answers 404 `CHAIN_CAPABILITY_DISABLED`.'
      x-status: implemented
      x-chain-capability: risk
      x-cache-ttl: 300
      parameters:
      - name: chainId
        in: query
        required: true
        description: Chain ID (required)
        schema:
          type: string
      responses:
        '200':
          description: Collateral-covered borrow exposure map
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: number
                        format: double
                        description: USD collateral-covered debt attributable to this collateral vault
                    description: Borrow-vault to collateral-vault USD collateral-covered exposure map
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/PaginationMeta'
                    - type: object
                      properties:
                        refreshedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        calculationTimestamp:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        priceTimestamp:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: 'Newest of the per-row oldest prices: each row records the oldest price it used, and this is the most recent of those.

                            '
                        oldestPriceTimestamp:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: 'Oldest price used across the chain''s rows. Null when no row was priced.

                            '
                        ageSeconds:
                          type:
                          - integer
                          - 'null'
        '404':
          $ref: '#/components/responses/Error404ChainCapability'
      operationId: getVaultsOpenInterestByCollateral
  /v3/evk/vaults/bad-debt:
    get:
      tags:
      - Vaults
      summary: Bad debt by borrow vault
      description: 'Borrow-vault aggregate of asset-value bad debt. Rows include only underwater account/borrow-vault positions where gross debt value exceeds the current value of enabled collateral considered for that debt position. Healthy accounts are omitted and no chain-level bad-debt total is exposed. Values use asset-value insolvency, not risk-adjusted LTV shortfall. Enabled collateral without a usable current price (feed stopped, asset collapsed) is valued at zero, so the debt it secures stays in the calculation rather than being dropped.

        Needs the `risk` chain capability; a chain without it answers 404 `CHAIN_CAPABILITY_DISABLED`.'
      x-status: implemented
      x-chain-capability: risk
      x-cache-ttl: 300
      parameters:
      - name: chainId
        in: query
        required: true
        description: Chain ID (required)
        schema:
          type: string
      - name: borrowVault
        in: query
        required: false
        description: Optional borrow vault/controller address filter
        schema:
          type: string
      - name: minBadDebtUsd
        in: query
        required: false
        description: Minimum bad debt USD threshold. Defaults to 0.
        schema:
          type: number
          minimum: 0
          default: 0
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Borrow-vault bad-debt rows
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        chainId:
                          type: integer
                        borrowVault:
                          type: string
                        borrowAsset:
                          type: string
                        accountCount:
                          type: integer
                          description: Number of underwater accounts contributing to this borrow-vault row.
                        debtUsd:
                          type: number
                          format: double
                          description: Gross USD debt for underwater account/borrow-vault positions.
                        collateralUsd:
                          type: number
                          format: double
                          description: Current enabled collateral value considered for those underwater positions.
                        coveredDebtUsd:
                          type: number
                          format: double
                          description: Portion of debt covered by current collateral value.
                        badDebtUsd:
                          type: number
                          format: double
                          description: Uncovered debt, equal to debtUsd minus coveredDebtUsd within tolerance.
                        unpricedBadDebtUsd:
                          type: number
                          format: double
                          description: 'Part of badDebtUsd from positions where at least one enabled collateral had no usable current price and was valued at zero.

                            '
                        unpricedCollateralCount:
                          type: integer
                          description: 'Number of collateral positions without a usable current price in the underwater positions of this borrow vault.

                            '
                        calculationTimestamp:
                          type: string
                          format: date-time
                        priceTimestamp:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        refreshedAt:
                          type: string
                          format: date-time
                  meta:
                    allOf:
                    - $ref: '#/components/schemas/PaginationMeta'
                    - type: object
                      properties:
                        refreshedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        calculationTimestamp:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        priceTimestamp:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: 'Newest of the per-row oldest prices: each row records the oldest price it used, and this is the most recent of those.

                            '
                        oldestPriceTimestamp:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: 'Oldest price used across the chain''s rows. Null when no row was priced.

                            '
                        ageSeconds:
                          type:
                          - integer
                          - 'null'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404ChainCapability'
      operationId: getVaultsBadDebt
components:
  schemas:
    VaultVisibilitySummary:
      type: object
      description: 'Platform visibility verdict for discovery surfaces. Warning stays discoverable with a badge; the per-surface booleans carve out lend/borrow discovery individually. A side is explorable when `status` is `visible` or `warning` and nothing hides that side: a platform override, the escrow rule, a curator listing flag on the vault or its product, or deprecation (which hides by default unless a curator re-lists with a `false` flag). An escrow vault (`isEscrow: true`) is never explorable for lending, because nothing can be borrowed from it and a deposit earns nothing; it stays explorable for borrowing, so a market that accepts it as collateral keeps it in its pairs. Its `status` is unaffected.'
      required:
      - status
      - explorableLend
      - explorableBorrow
      - decidedBy
      - reason
      properties:
        status:
          type: string
          enum:
          - visible
          - warning
          - hidden
          - pending_review
        explorableLend:
          type: boolean
        explorableBorrow:
          type: boolean
        explorableLendDecidedBy:
          $ref: '#/components/schemas/VaultListingDecidedBy'
        explorableBorrowDecidedBy:
          $ref: '#/components/schemas/VaultListingDecidedBy'
        decidedBy:
          type: string
          description: Which resolution rule decided the status. `config-*` codes come from Layer 1 (configuration safety), `consistency-*` codes from Layer 2 (label consistency). `unclaimed` and `unassigned` are label gates. A verified or unassessable non-escrow vault stays in `pending_review` until an entity claims it, and EVK and Securitize vaults additionally require assignment to a product. Escrow vaults bypass both label gates. `advisories` badges a vault that passed both layers but has a failed advisory finding — it stays in discovery, with `checksStatus` on its assessment naming a Layer 1 concern and `consistencyContext` a Layer 2 one (an Earn vault's deprecated dependency); an advisory that could not be judged does not badge.
          enum:
          - config-revoked
          - consistency-revoked
          - config-suspended
          - consistency-suspended
          - config-failed
          - not-explorable
          - unassessable
          - deprecated
          - advisories
          - unclaimed
          - unassigned
          - verified
          - awaiting-verification
        reason:
          type: string
          nullable: true
          description: 'Display-appropriate explanation for the decision, when there is one: the curated deprecation reason, the failing check''s sentence, or, for `advisories`, the sentence of the first failed advisory (Layer 1 before Layer 2, each by finding key) followed by a count of the rest, e.g. "… (2 more checks flagged)". Null for a deprecated vault whose curator gave no reason, and whenever nothing needs explaining.'
    PaginationMeta:
      type: object
      required:
      - timestamp
      properties:
        total:
          type: integer
          description: Exact total count when the endpoint provides one.
        hasMore:
          type: boolean
          description: Indicates whether another page exists beyond the current page.
        offset:
          type: integer
        limit:
          type: integer
          description: Echoed page size after endpoint-side clamping.
        outcome:
          type: string
          enum:
          - disabled
          - removed
          description: On a toolbox config DELETE, what happened to the row.
        products:
          type: array
          description: 'On a curation vault `POST`, `PUT`, or `PATCH`: the products the write touched (the one the vault left and the one it joined) as they are after the write, `governanceMode` included, so the caller applies them instead of re-reading.'
          items:
            $ref: '#/components/schemas/ProductLabels'
        timestamp:
          type: string
          format: date-time
        chainId:
          type: string
          description: Comma-separated chain IDs for multi-chain responses.
        degradedProviders:
          type: array
          items:
            type: string
          description: Live providers whose data is incomplete in this response.
        excludedChains:
          $ref: '#/components/schemas/ExcludedChains'
    AssetRef:
      type: object
      properties:
        address:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
        name:
          type: string
          nullable: true
    ListingFlag:
      type: boolean
      nullable: true
      description: Curator listing flag. `null` leaves the decision to platform overrides and deprecation, `true` hides the vault(s) from discovery, `false` keeps a deprecated vault listed.
    VaultPosition:
      type: object
      properties:
        account:
          type: string
        shares:
          type: string
          description: Raw vault share amount as a bigint string.
        assets:
          type: string
          description: Raw underlying asset amount as a bigint string.
        assetsUsd:
          type: number
          nullable: true
          description: Market USD number computed from `assets` and the token price endpoint.
        lastUpdatedBlock:
          type: string
    CapHistoryWithBaseline:
      type: object
      required:
      - events
      - baseline
      - baselineStatus
      - eventStorage
      - usdValuation
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/DecodedCapHistoryItem'
        baseline:
          oneOf:
          - $ref: '#/components/schemas/DecodedCapHistoryItem'
          - type: object
            nullable: true
            not:
              type: object
          description: Latest retained cap event at or before from, independently of offset. A boundary event can appear both here and in events.
        baselineStatus:
          type: string
          enum:
          - available
          - unknown
          - unavailable
          description: Unknown means no retained event at or before from. Unavailable means event storage could not be read.
        eventStorage:
          type: string
          enum:
          - available
          - unavailable
          description: Whether retained event storage is readable, not a guarantee of complete indexed history.
        usdValuation:
          type: string
          enum:
          - unavailable
          description: Historical cap USD valuations are not supplied.
    VaultCollateralDetail:
      allOf:
      - $ref: '#/components/schemas/CollateralConfig'
      - type: object
        properties:
          oraclePriceRaw:
            allOf:
            - $ref: '#/components/schemas/OraclePriceRaw'
            nullable: true
    Price:
      type: object
      properties:
        chainId:
          type: integer
        address:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
        priceUsd:
          type: number
          description: Market-normalized USD price number. Use `/v3/oracles/prices` for exact contract-derived oracle values.
        source:
          type: string
          enum:
          - onchain
          - offchain
          - hardcoded
          description: Provider-redacted price provenance category.
        timestamp:
          type: string
          format: date-time
          description: Observation time, the provider's own time for the price when it gives one. Current-price endpoints return the best-known observation up to 7 days old; derived USD calculations accept observations up to 24 hours old.
        stale:
          type: boolean
          description: Whether the served observation is older than the 24-hour freshness window. Present on current-price responses (`/v3/prices`, token price, and vault and Earn price includes); absent from `/v3/prices/history`.
    VaultLiquidation:
      type: object
      properties:
        maxLiquidationDiscount:
          type: number
        liquidationCoolOffTime:
          type: integer
        socializeDebt:
          type: boolean
    ConfigHistoryItem:
      type: object
      description: One configuration change of the vault.
      properties:
        type:
          type: string
          enum:
          - ltv
          - cap
          - irm
          description: Kind of change.
        data:
          type: object
          additionalProperties: true
          description: 'The values set by the change, by `type`. `ltv`: `collateral` (checksummed address), `borrowLTV`, `liquidationLTV` and `initialLiquidationLTV` as basis-point strings, their legacy fraction aliases `borrowLtv`, `liquidationLtv` and `initialLiquidationLtv`, `targetTimestamp` (ISO date-time, null when no ramp is set) and `rampDuration` (seconds). `cap`: `supplyCap` and `borrowCap` as the raw EVK uint16 encodings in JSON integers, not resolved amounts; encoded zero means unlimited. `irm`: `interestRateModel` (checksummed address).'
        blockNumber:
          type: string
          description: Block number of the change
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the change
        txHash:
          type: string
          description: Transaction hash
        logIndex:
          type: integer
          description: Log index within the transaction receipt.
    IrmHistoryItem:
      type: object
      description: Historical interest rate model change
      properties:
        interestRateModel:
          type: string
          description: Interest rate model contract address
        blockNumber:
          type: string
          description: Block number of the change
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the change
        txHash:
          type: string
          description: Transaction hash
        logIndex:
          type: integer
          description: Log index within the transaction receipt.
    VaultInterestRates:
      type: object
      description: Contract interest-rate values formatted as decimal strings in fraction units, not public percent APY numbers.
      properties:
        borrowSPY:
          type: string
          description: Borrow rate per second as an exact decimal string.
        borrowAPY:
          type: string
          description: Borrow APY as an exact decimal fraction string; `1` means 100%.
        supplyAPY:
          type: string
          description: Supply APY as an exact decimal fraction string; `1` means 100%.
    VaultApy:
      type: object
      properties:
        coverage:
          $ref: '#/components/schemas/HistoryCoverage'
        current:
          $ref: '#/components/schemas/VaultApyPoint'
        history:
          type: array
          items:
            $ref: '#/components/schemas/VaultApyPoint'
    OracleInfo:
      type: object
      properties:
        oracle:
          type: string
        name:
          type: string
        detailedInfo:
          $ref: '#/components/schemas/OracleDetailedInfo'
        adapters:
          type: array
          items:
            $ref: '#/components/schemas/OracleAdapterEntry'
        resolvedVaults:
          type: array
          items:
            $ref: '#/components/schemas/OracleResolvedVault'
    LtvHistoryItem:
      type: object
      description: Historical LTV configuration change
      properties:
        collateral:
          type: string
          description: Collateral vault address
        borrowLTV:
          type: string
          description: Borrow LTV (basis points as string)
        liquidationLTV:
          type: string
          description: Liquidation LTV (basis points as string)
        initialLiquidationLTV:
          type: string
          description: Initial liquidation LTV before ramping
        borrowLtv:
          type: number
          description: Legacy decimal alias for `borrowLTV`.
        liquidationLtv:
          type: number
          description: Legacy decimal alias for `liquidationLTV`.
        initialLiquidationLtv:
          type: number
          description: Legacy decimal alias for `initialLiquidationLTV`.
        targetTimestamp:
          type: string
          format: date-time
          nullable: true
          description: ISO timestamp when LTV ramp completes
        rampDuration:
          type: integer
          description: Duration of LTV ramp in seconds
        blockNumber:
          type: string
          description: Block number of the change
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the change
        txHash:
          type: string
          description: Transaction hash
        logIndex:
          type: integer
          description: Log index within the transaction receipt.
    VaultTotalsPoint:
      type: object
      properties:
        totalAssets:
          type: string
          nullable: true
          description: Raw underlying asset amount as a bigint string.
        totalAssetsUsd:
          type: number
          nullable: true
          description: USD value of totalAssets. Uses the latest asset price for current and the bucket-aligned historical asset price for history entries when available.
        totalBorrows:
          type: string
          nullable: true
          description: Raw borrowed asset amount as a bigint string.
        totalBorrowsUsd:
          type: number
          nullable: true
          description: USD value of totalBorrows. Uses the latest asset price for current and the bucket-aligned historical asset price for history entries when available.
        cash:
          type: string
          nullable: true
          description: Raw cash amount as a bigint string.
        cashUsd:
          type: number
          nullable: true
          description: USD value of cash. Uses the latest asset price for current and the bucket-aligned historical asset price for history entries when available.
        utilization:
          type: number
          nullable: true
          description: Utilization ratio number.
        supplyApy:
          type: number
          nullable: true
          description: Public supply APY as a percent number.
        borrowApy:
          type: number
          nullable: true
          description: Public borrow APY as a percent number.
