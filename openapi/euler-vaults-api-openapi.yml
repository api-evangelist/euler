          borrowCap:
            type: string
            description: Equal to `caps.borrowCap`; unlimited is type(uint256).max, `0` is a zero cap.
          totalShares:
            type: string
            description: Raw vault share supply as a bigint string.
          totalBorrowed:
            type: string
            description: Raw borrowed asset amount as a bigint string.
          totalCash:
            type: string
            description: Raw cash amount as a bigint string.
          cash:
            type: string
            description: Raw cash amount as a bigint string.
          interestRate:
            type: string
            description: Raw contract interest-rate value as a bigint string.
          interestAccumulator:
            type: string
            description: Raw contract interest accumulator as a bigint string.
          accumulatedFees:
            type: string
            description: Raw accumulated fee amount as a bigint string.
          balanceTracker:
            type: string
          fees:
            $ref: '#/components/schemas/VaultFees'
          hooks:
            $ref: '#/components/schemas/VaultHooks'
          caps:
            $ref: '#/components/schemas/VaultCaps'
          liquidation:
            $ref: '#/components/schemas/VaultLiquidation'
          interestRates:
            $ref: '#/components/schemas/VaultInterestRates'
          interestRateModel:
            $ref: '#/components/schemas/VaultInterestRateModel'
          evcCompatibleAsset:
            type: boolean
          oraclePriceRaw:
            $ref: '#/components/schemas/OraclePriceRaw'
          timestamp:
            type: string
            format: date-time
          exchangeRate:
            type: string
            nullable: true
            description: 'Raw EVK exchange rate as a bigint string: floor(convertToAssets(1e18 shares)), including the 1,000,000 virtual assets and virtual shares.'
          createdAtBlock:
            type: string
            description: Block number as a bigint string.
    Vault:
      type: object
      properties:
        chainId:
          type: integer
        address:
          type: string
        isEscrow:
          type: boolean
          description: True for an EVK vault the escrow perspective has verified as collateral-only. Derived by Euler from the perspective, never from a request; `vaultType` says `evk` for such a vault, so this flag is the only place escrow is answered.
        vaultType:
          type: string
          enum:
          - evk
          - securitize
          description: 'The label classification stored on the vault''s label row: `evk` for an EVK vault (escrow vaults included; read `isEscrow`), `securitize` only when an operator classified the row so. Every row on this surface is an EVK-factory vault; do not read a value other than `evk` as "not an EVK vault". This is not the vault *family* the resolver, Earn, and account routes report under the same name (`evk`, `earn`, `securitize`). Discovery writes the value, the Toolbox may override it through the label row, and it falls back to `evk` while the label row is unknown.'
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
        shares:
          $ref: '#/components/schemas/AssetRef'
        asset:
          $ref: '#/components/schemas/AssetRef'
        totalAssets:
          type: string
          description: Raw underlying asset amount as a bigint string.
        totalBorrows:
          type: string
          description: Raw borrowed asset amount as a bigint string.
        totalSupplyUsd:
          type: number
          nullable: true
          description: Market USD number for total supplied assets. Null when the vault holds assets whose asset has no usable price, never 0; an empty vault answers 0.
        totalBorrowsUsd:
          type: number
          nullable: true
          description: Market USD number for total borrowed assets. Null when the vault has borrows whose asset has no usable price, never 0; no borrows answer 0.
        utilization:
          type: number
          description: Utilization ratio number, computed from market-normalized totals.
        supplyApy:
          type: number
          description: Public supply APY as a percent number.
        borrowApy:
          type: number
          description: Public borrow APY as a percent number.
        createdAt:
          type: string
          format: date-time
        visibility:
          $ref: '#/components/schemas/VaultVisibilitySummary'
    CollateralConfigWithPrice:
      allOf:
      - $ref: '#/components/schemas/CollateralConfig'
      - type: object
        properties:
          price:
            allOf:
            - $ref: '#/components/schemas/Price'
            nullable: true
    EarnSharePriceQuote:
      type: object
      required:
      - unit
      - chainId
      - vaultAddress
      - assetAddress
      - shareDecimals
      - assetDecimals
      - convertedAssetsRaw
      - assetsPerShare
      - blockNumber
      - blockHash
      - blockTimestamp
      description: Conversion of one whole Earn share into underlying assets using contract metadata and convertToAssets at the same verified block. Does not use a USD price.
      properties:
        unit:
          type: string
          enum:
          - assets-per-whole-share
        chainId:
          type: integer
        vaultAddress:
          type: string
        assetAddress:
          type: string
        shareDecimals:
          type: integer
          minimum: 0
          maximum: 77
        assetDecimals:
          type: integer
          minimum: 0
          maximum: 255
        convertedAssetsRaw:
          type: string
          description: Exact integer result of convertToAssets(10^shareDecimals) in asset base units.
        assetsPerShare:
          type: string
          description: Exact decimal string obtained by applying assetDecimals to convertedAssetsRaw. Observed zero is valid.
        blockNumber:
          type: string
          description: Decimal block number used for metadata and conversion reads.
        blockHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        blockTimestamp:
          type: integer
          description: Source block time in Unix seconds, independent of the response bucket timestamp.
    VaultApyPoint:
      type: object
      properties:
        supplyApy:
          type: number
          nullable: true
          description: Percent number with 6 decimal places.
        borrowApy:
          type: number
          nullable: true
          description: Percent number with 6 decimal places.
        timestamp:
          type: string
          format: date-time
    VaultTotalsMeta:
      allOf:
      - $ref: '#/components/schemas/VaultApyMeta'
      - type: object
        properties:
          note:
            type: string
    VaultHookedOperations:
      type: object
      properties:
        deposit:
          type: boolean
        mint:
          type: boolean
        withdraw:
          type: boolean
        redeem:
          type: boolean
        transfer:
          type: boolean
        skim:
          type: boolean
        borrow:
          type: boolean
        repay:
          type: boolean
        repayWithShares:
          type: boolean
        pullDebt:
          type: boolean
        convertFees:
          type: boolean
        liquidate:
          type: boolean
        flashloan:
          type: boolean
        touch:
          type: boolean
        vaultStatusCheck:
          type: boolean
    VaultCapHealthItem:
      type: object
      description: Vault cap-usage health row
      properties:
        chainId:
          type: integer
          description: Chain ID
        vault:
          type: string
          description: Vault address
        capUsage:
          type: number
          description: Maximum of `supplyCapUsage` and `borrowCapUsage`
        supplyCap:
          type: string
          description: Supply cap in resolved asset units
        supplyCapUsage:
          type: number
          description: Current supply-cap usage ratio
        borrowCap:
          type: string
          description: Borrow cap in resolved asset units
        borrowCapUsage:
          type: number
          description: Current borrow-cap usage ratio
        totalAssets:
          type: string
          description: Current total supplied assets
        totalBorrows:
          type: string
          description: Current total borrowed assets
        thresholdExceeded:
          type: boolean
          description: Whether `capUsage` meets or exceeds the requested threshold
    OracleAdapterChainlinkDetail:
      type: object
      properties:
        oracle:
          type: string
    ExcludedChains:
      type: array
      description: 'On a read across chains that names no `chainId`: the served chains it left out because they do not run the capability the operation needs, rather than reading them as empty. Absent when no chain was left out.'
      items:
        type: object
        required:
        - chainId
        - capability
        properties:
          chainId:
            type: integer
          capability:
            type: string
            enum:
            - indexing
            - activity
            - prices
            - historicalPrices
            - assessments
            - labels
            - logos
            - stats
            - risk
            - rewards
            - apys
    HistoryInterval:
      type: object
      required:
      - from
      - to
      description: Inclusive UTC bucket-start bounds. A single absent bucket has equal from/to values.
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    ResolvedProductLabels:
      type: object
      readOnly: true
      description: Read-time entity fallbacks for display. Derived, never stored.
      required:
      - entityName
      - url
      - logo
      properties:
        entityName:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          description: Product url, falling back to the owning entity url.
        logo:
          type: string
          nullable: true
          description: Product logo, falling back to the owning entity logo.
    VaultTotals:
      type: object
      properties:
        coverage:
          $ref: '#/components/schemas/HistoryCoverage'
        current:
          $ref: '#/components/schemas/VaultTotalsPoint'
        history:
          type: array
          items:
            $ref: '#/components/schemas/VaultTotalsPoint'
