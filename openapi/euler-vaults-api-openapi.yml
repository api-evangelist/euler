        missingBuckets:
          type: integer
          minimum: 0
        missingIntervals:
          type: array
          items:
            $ref: '#/components/schemas/HistoryInterval'
        partialIntervals:
          type: array
          items:
            $ref: '#/components/schemas/HistoryInterval'
    VaultApyMeta:
      type: object
