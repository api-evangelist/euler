openapi: 3.2.0
info:
  title: Euler Data API (V3) Vaults API
  version: 3.0.0
  description: 'API specification for Euler Data v3. This spec defines the current

    resource-oriented contract for the platform, with emphasis on consistent

    schemas, predictable REST semantics, caching, observability, and a uniform

    developer experience. This public document covers unauthenticated endpoints and integrations that

    use API keys, including capability-scoped keys. Browser-session Toolbox

    operations, admin-secret operations, and the Prometheus endpoint are served

    separately and are intentionally omitted. Migration notes

    - Euler Data v3 is not a path-for-path clone of v1/v2. Some endpoints map

    directly, some require multiple v3 calls, and some legacy aggregates were

    intentionally removed. - The live migration guide explains how legacy v1/v2

    endpoints and payloads map into the v3 resource model. - Important semantic changes:

    - Vault base APY and rewards APY are exposed separately in v3. - Account positions are flattened into account-vault rows instead of the

    legacy nested sub-account shape. - All supported API paths live under `/v3`; legacy paths return `410`. - Summary endpoints prefer smaller, focused resources over large

    BFF-style payloads. Base path: /v3


    Conventions

    - JSON field naming: camelCase

    - Addresses: accept lowercase or checksum; responses are EIP-55 checksummed

    - Public APY values (`*Apy`, `apy*`): percent numbers with 6 decimal places (e.g., 5.123456 = 5.123456%)

    - Contract interest-rate fields (`borrowAPY`, `supplyAPY` in `interestRates`): decimal strings in contract fraction units

    - Ratios (utilization, LTV, etc.): numbers with 6 decimal places

    - Response timestamps: ISO-8601 strings (UTC). Some legacy fields still expose unix

    seconds for compatibility and include `*Iso` companions. - Query time ranges: unix seconds (from/to)


    Unit policy

    - v3 separates market metadata from contract verdicts by both name and type. - Market-normalized USD prices and USD values are JSON numbers. These are values

    derived from off-chain pricing, cached price snapshots, or API-level market math. This includes `/v3/prices`, token price routes, vault/earn/protocol USD totals,

    portfolio market values, portfolio USD liquidation/risk fields such as

    `liabilityValueUsd`, `totalCollateralValueUsd`, `borrowLiquidationPriceUsd`,

    and `collateralLiquidationPricesUsd`, and vault holder `assetsUsd`. - Contract-derived oracle and raw account-liquidity verdict values are exact strings. These preserve the integer value used by contracts, normalized to 18 decimals

    for API exposure. Oracle prices are quoted in the vault unit of account, which

    can be USD, ETH, or another asset. This includes `/v3/oracles/prices`, raw

    account-liquidity `liabilityValue` and `totalCollateralValue` objects,

    `liabilityValueBorrowing`, `liabilityValueLiquidation`, and collateral verdict

    values. - On-chain token quantities are bigint strings in their native unit scale. This

    includes amounts, balances, shares, assets, borrows, reward amounts, liquidation

    repay/yield amounts, and block numbers. - Caps are also bigint strings, but EVK caps are exposed as resolved underlying

    asset-unit amounts rather than packed contract config words; an unlimited EVK cap is

    type(uint256).max and `0` is a zero cap. The exceptions are

    cap-history and config-history, which carry the raw uint16 encodings. - LTV config values use canonical basis-point strings. Legacy decimal aliases

    may remain on config-history payloads for compatibility when explicitly named. Rate limiting

    - Optional API keys for higher limits

    - Standard limits are 1000 req/min for unauthenticated callers (IP-based)

    and 10000 req/min for authenticated callers (per API key), with a 60s window. Individual API keys can carry a custom limit. - By default, proxy headers are not trusted for IP identity unless explicitly enabled. - Redis failures default to fail-closed (503) for strict enforcement; fail-open is opt-in. - RateLimit-* (IETF draft-6) and legacy X-RateLimit-* headers are returned.'
servers:
- url: /
  description: Current environment
security: []
tags:
- name: Vaults
  description: Canonical vault resources, vault history, holders, borrowers, and open-interest views. In v3, vault detail is decomposed into focused endpoints instead of one large legacy response.
paths:
  /v3/evk/vaults:
    get:
      tags:
      - Vaults
      summary: List vaults
      description: 'Returns a list of vaults.

        `minTvl`/`maxTvl` apply to `totalSupplyUsd` where

        `totalSupplyUsd = (cash + totalBorrows) * price`. When either bound is

        set, vaults without a USD value (`totalSupplyUsd` null) are left out.'
      x-status: implemented
      x-cache-ttl: 60
      parameters:
      - $ref: '#/components/parameters/ChainIdParam'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      - name: asset
        in: query
        required: false
        schema:
          type: string
      - name: minTvl
        in: query
        required: false
        schema:
          type: number
      - name: maxTvl
        in: query
        required: false
        schema:
          type: number
      - name: visibility
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated visibility filter (`visible,warning,hidden,pending_review`). Defaults to `visible,warning` — hidden and pending_review vaults are excluded from discovery unless requested explicitly.
      responses:
        '200':
          description: Vault list
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vault'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
      operationId: getVaults
  /v3/evk/vaults/batch:
    post:
      tags:
      - Vaults
      summary: Batch vault details
      description: 'Returns canonical EVK vault detail entities for an explicit address set.

        Use this to avoid high client-side fanout when you already know the vault

        addresses you want to render.


        Notes:

        - Request order is preserved for found vaults.

        - `meta.notFound` returns requested addresses that were not resolved.

        - `include=["collaterals"]` expands collateral detail for every returned vault.

        - The request cap is 1000 vault addresses and 256 KiB of JSON body.'
      x-status: implemented
      x-cache-ttl: 60
      operationId: postEvkVaultBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvkVaultBatchRequest'
      responses:
        '200':
          description: Batched EVK vault details
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvkVaultBatchResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /v3/resolve/vaults:
    get:
      tags:
      - Vaults
      summary: Resolve a vault address to its family
      description: Resolve a single `(chainId, address)` pair to `vaultType`, `factory`, and the canonical resource path when one exists.
      x-status: implemented
      x-cache-ttl: 60
      operationId: getVaultResolve
      parameters:
      - name: chainId
        in: query
        required: true
        schema:
          type: integer
      - name: address
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Resolved vault family
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VaultResolveEntry'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '404':
          description: Vault not found
        '504':
          $ref: '#/components/responses/Error504'
    post:
      tags:
      - Vaults
      summary: Resolve multiple vault addresses to their families
      description: Bulk resolver for SDK/meta-routing use cases. Supports up to 500 addresses per request.
      x-status: implemented
      x-cache-ttl: 60
      operationId: postVaultResolve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - chainId
              - addresses
              properties:
                chainId:
                  type: integer
                addresses:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
      responses:
        '200':
          description: Resolved vault families
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VaultResolveEntry'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '504':
          $ref: '#/components/responses/Error504'
  /v3/evk/vaults/health/utilization:
    get:
      tags:
      - Vaults
      summary: Vault utilization health
      description: 'Lists vaults ordered by utilization severity (descending).

        - `chainId` is required.

        - If `threshold` is omitted, returns all vaults.

        - Threshold filter is inclusive (`utilization >= threshold`).

        - `onlyOverThreshold` is accepted for compatibility and currently does not alter filtering.'
      x-status: implemented
      x-cache-ttl: 60
      parameters:
      - name: chainId
        in: query
        required: true
        schema:
          type: integer
      - name: threshold
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          maximum: 1
      - name: onlyOverThreshold
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Vault utilization health list
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VaultUtilizationHealthItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getVaultsHealthUtilization
  /v3/evk/vaults/health/caps:
    get:
      tags:
      - Vaults
      summary: Vault cap usage health
      description: 'Lists vaults ordered by cap-usage severity (descending).

        Cap usage is computed as `max(supplyCapUsage, borrowCapUsage)`, and the

        response includes both supply-cap and borrow-cap fields.

        - `chainId` is required.

        - If `threshold` is omitted, returns all vaults.

        - Threshold filter is inclusive (`capUsage >= threshold`).

        - `onlyOverThreshold` is accepted for compatibility and currently does not alter filtering.'
      x-status: implemented
      x-cache-ttl: 60
      parameters:
      - name: chainId
        in: query
        required: true
        schema:
          type: integer
      - name: threshold
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          maximum: 1
      - name: onlyOverThreshold
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Vault cap health list
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VaultCapHealthItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getVaultsHealthCaps
  /v3/evk/vaults/{chainId}/{address}:
    get:
      tags:
      - Vaults
      summary: Vault details
      description: 'Returns vault detail. Optional `include` expands related resources in a single response.

        Supported values: `collaterals`, `apy`, `totals`, `prices`.

        The single-vault detail response uses `totalBorrowed` as the canonical borrow-total field.


        The detail is an indexed read on every served chain. On a chain without the `prices` chain

        capability `prices` answers null, and on one without `apys` so does `apy`.'
      x-status: implemented
      x-cache-ttl: 60
      parameters:
      - $ref: '#/components/parameters/ChainIdPath'
      - $ref: '#/components/parameters/AddressPath'
      - $ref: '#/components/parameters/IncludeParam'
      responses:
        '200':
          description: Vault details
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VaultDetailResponseWithIncludes'
      operationId: getVaultsByChainIdByAddress
  /v3/evk/vaults/{chainId}/{address}/visibility:
    get:
      tags:
      - Vaults
      summary: Visibility verdict for a vault
      description: 'Platform-computed visibility verdict with the decision evidence in `checks` (`decidedBy`,

        `reason`, layer statuses, deprecation, platform overrides, and the per-side `listing`

        result that folds in curator flags and deprecation). Curated inputs come from the latest

        published label version; reasons that would reveal a draft claim are reported as their

        published equivalent. Platform operators read the verdict as evaluated at

        `.../visibility/platform`.


        The verdict is a labels answer, so it is served for any chain that has labels: on a chain

        this deployment cannot index, Layer 1 and Layer 2 report that they could not run

        (`decidedBy: unassessable`) and the curated inputs still decide, rather than the read

        being refused.'
      x-status: implemented
      x-cache-ttl: 60
      parameters:
      - $ref: '#/components/parameters/ChainIdPath'
      - $ref: '#/components/parameters/AddressPath'
      responses:
        '200':
          description: Current visibility status and check results
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VaultVisibility'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getVaultsByChainIdByAddressVisibility
  /v3/evk/vaults/{chainId}/{address}/positions:
    get:
      tags:
      - Vaults
      summary: Positions in a vault
      x-status: implemented
      x-cache-ttl: 60
      parameters:
      - $ref: '#/components/parameters/ChainIdPath'
      - $ref: '#/components/parameters/AddressPath'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      - name: addressPrefix
        in: query
        required: false
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{8}$
        description: Optional 4-byte account prefix filter (`0x` + 8 hex chars).
      - name: blockNumber
        in: query
        required: false
        schema:
          type: string
        description: Not supported for this endpoint. If provided, returns 400.
      responses:
        '200':
          description: Vault positions
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VaultPosition'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
      operationId: getVaultsByChainIdByAddressPositions
  /v3/evk/vaults/{chainId}/{address}/config-history:
    get:
      tags:
      - Vaults
      summary: Vault configuration history
      description: 'LTV (`ltv`), cap (`cap`) and interest rate model (`irm`) changes of this vault in one

        timeline, newest first; `meta.total` counts all three kinds. There is no type filter:

        use cap-history, ltv-history or irm-history for one kind. Without `from` and `to` the

        timeline is unbounded.'
      x-status: implemented
      x-cache-ttl: 300
      parameters:
      - $ref: '#/components/parameters/ChainIdPath'
      - $ref: '#/components/parameters/AddressPath'
      - $ref: '#/components/parameters/FromParam'
      - $ref: '#/components/parameters/ToParam'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Vault config history
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConfigHistoryItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: A `from` or `to` that is not a whole number of seconds (digits only).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getVaultsByChainIdByAddressConfigHistory
  /v3/evk/vaults/{chainId}/{address}/collaterals:
    get:
      tags:
      - Vaults
      summary: Current accepted collaterals with LTV configurations
      description: 'Returns the list of vaults accepted as collateral for this vault,

        along with their current LTV configurations. Use this to understand

        what assets can be used as collateral when borrowing from this vault.'
      x-status: implemented
      x-cache-ttl: 60
      parameters:
      - $ref: '#/components/parameters/ChainIdPath'
      - $ref: '#/components/parameters/AddressPath'
      responses:
        '200':
          description: Accepted collaterals with LTV configs
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollateralConfig'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '404':
          $ref: '#/components/responses/Error404'
      operationId: getVaultsByChainIdByAddressCollaterals
  /v3/evk/vaults/{chainId}/{address}/ltv-history:
    get:
      tags:
      - Vaults
      summary: Vault LTV history
      x-status: implemented
      x-cache-ttl: 300
      parameters:
      - $ref: '#/components/parameters/ChainIdPath'
      - $ref: '#/components/parameters/AddressPath'
      - name: collateral
        in: query
        required: false
        schema:
          type: string
        description: Filter by collateral vault address
      - $ref: '#/components/parameters/FromParam'
      - $ref: '#/components/parameters/ToParam'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Vault LTV history
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LtvHistoryItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
      operationId: getVaultsByChainIdByAddressLtvHistory
  /v3/evk/vaults/{chainId}/{address}/cap-history:
    get:
      tags:
      - Vaults
      summary: Vault cap history (supply/borrow)
      description: Returns retained supply and borrow cap changes. With includeBaseline=true, data contains events plus the latest captured cap at or before from, exact cap decoding and availability. Missing baselines are not inferred as zero or unlimited. Count, page and baseline use one database snapshot. No full-range indexer continuity or historical USD valuation is asserted.
      x-status: implemented
      x-cache-ttl: 300
      parameters:
      - $ref: '#/components/parameters/ChainIdPath'
      - $ref: '#/components/parameters/AddressPath'
      - name: includeBaseline
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: from
        in: query
        required: false
        description: Inclusive Unix-seconds range start; required with includeBaseline=true.
        schema:
          type: integer
      - name: to
        in: query
        required: false
        description: Inclusive Unix-seconds range end.
        schema:
          type: integer
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Vault cap history
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                    - type: array
                      items:
                        $ref: '#/components/schemas/CapHistoryItem'
                    - $ref: '#/components/schemas/CapHistoryWithBaseline'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
      operationId: getVaultsByChainIdByAddressCapHistory
  /v3/evk/vaults/{chainId}/{address}/irm-history:
    get:
      tags:
      - Vaults
      summary: Vault interest rate model history
      description: Returns historical changes to the interest rate model for this vault.
      x-status: implemented
      x-cache-ttl: 300
      parameters:
      - $ref: '#/components/parameters/ChainIdPath'
      - $ref: '#/components/parameters/AddressPath'
      - $ref: '#/components/parameters/FromParam'
      - $ref: '#/components/parameters/ToParam'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Vault IRM history
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IrmHistoryItem'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
      operationId: getVaultsByChainIdByAddressIrmHistory
  /v3/evk/vaults/{chainId}/{address}/events:
    get:
      tags:
      - Vaults
      summary: Unified core vault event timeline
      description: 'Unified stream of deposit, withdraw, borrow, repay, and transfer events for one vault.

        Requires a bounded time window (`from` + `to`), max 30 days.'
      x-status: implemented
      x-cache-ttl: 60
      parameters:
      - $ref: '#/components/parameters/ChainIdPath'
      - $ref: '#/components/parameters/AddressPath'
      - $ref: '#/components/parameters/FromParam'
      - $ref: '#/components/parameters/ToParam'
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: Comma-separated event type filter. Unknown values return 400.
      - $ref: '#/components/parameters/IndexedEventsOffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Vault events
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        chainId:
                          type: integer
                        type:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                        blockNumber:
                          type: string
                        txHash:
                          type: string
                        logIndex:
                          type: integer
                        payload:
                          type: object
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getVaultsByChainIdByAddressEvents
  /v3/evk/vaults/{chainId}/{address}/totals:
    get:
      tags:
      - Vaults
      summary: Vault totals with historical series
      description: 'Returns totalAssets, totalBorrows, utilization, and APY from dynamic

        snapshots. Raw amount fields are bigint strings; USD fields use the latest

        asset price for current and bucket-aligned historical asset prices for

        history entries when available. The effective end is `to` or the current

        time. When `from` is omitted, the effective window is 7 days for `1h` and

        30 days for `1d`. Ranges count both endpoint buckets and support at most

        744 hourly buckets or 732 daily buckets.'
      x-status: implemented
      x-cache-ttl: 60
      parameters:
      - $ref: '#/components/parameters/ChainIdPath'
      - $ref: '#/components/parameters/AddressPath'
      - name: resolution
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1h
          - 1d
          default: 1d
      - $ref: '#/components/parameters/HistoryFromParam'
      - $ref: '#/components/parameters/HistoryToParam'
      - name: forceFresh
        in: query
        required: false
        schema:
          type: boolean
        description: 'When true, trigger bounded synchronous vault dynamic refresh before reading totals.

          On timeout/failure, response safely falls back to stored snapshots and indicates cached mode in freshness metadata.

          '
      responses:
        '200':
          description: Vault totals with current + historical data
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VaultTotals'
                  meta:
                    $ref: '#/components/schemas/VaultTotalsMeta'
                  freshness:
                    $ref: '#/components/schemas/VaultTotalsFreshness'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '503':
          description: Vault totals history concurrency is at capacity
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getVaultsByChainIdByAddressTotals
  /v3/evk/vaults/{chainId}/{address}/holders:
    get:
      tags:
      - Vaults
      summary: Vault share holders
      description: Returns all holders with non-zero share balances via transfer aggregation (raw holder set). This endpoint does not unwrap Euler Earn depositors and therefore aligns with legacy behavior when `resolveEulerEarn=false`. Supports 4-byte `addressPrefix` filter for wallet-scoped scans. Balance values are integer strings in raw mode; when resolve flags are enabled, balances may be proportional decimal strings.
      x-status: implemented
      x-cache-ttl: 60
      parameters:
      - $ref: '#/components/parameters/ChainIdPath'
      - $ref: '#/components/parameters/AddressPath'
      - name: addressPrefix
        in: query
        required: false
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{8}$
        description: Optional 4-byte account prefix filter (`0x` + 8 hex chars).
      - name: resolveEulerEarn
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, expands Euler Earn vault-holder addresses into underlying depositors (v1 parity mode).
      - name: resolveSubAccounts
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: When true, aggregates sub-account holders into their owner addresses.
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Vault share holders
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        holder:
                          type: string
                        balance:
                          type: string
                          description: Numeric string; integer in raw mode, may be decimal when resolve flags are enabled.
                        lastTransferBlock:
                          type: string
                        lastTransferTimestamp:
                          type: string
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
      operationId: getVaultsByChainIdByAddressHolders
  /v3/evk/vaults/{chainId}/{address}/debt-holders:
    get:
      tags:
