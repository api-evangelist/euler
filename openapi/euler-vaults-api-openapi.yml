    HistoryCoverage:
      type: object
      required:
      - scope
      - status
      - requestedBuckets
      - evaluatedBuckets
      - returnedBuckets
      - futureBuckets
      - firstAvailable
      - lastAvailable
      - provisionalBucket
      - missingIntervals
      - metrics
      description: Availability within the requested range, not proof of historical membership, vault inception, source retention, recoverability, or price accuracy. Leading and trailing absent buckets are included. Future buckets are excluded from evaluation; the current bucket is provisional. Missing fields and read failures remain unavailable without asserting their root cause.
      properties:
        scope:
          type: string
          enum:
          - requested-range
        status:
          type: string
          enum:
          - complete
          - partial
          - missing
          - not_applicable
          description: Complete requires all evaluated buckets and all reported metrics. Missing means no returned buckets. Not applicable means the range is entirely in the future.
        requestedBuckets:
          type: integer
          minimum: 1
        evaluatedBuckets:
          type: integer
          minimum: 0
        returnedBuckets:
          type: integer
          minimum: 0
        futureBuckets:
          type: integer
          minimum: 0
        firstAvailable:
          type: string
          format: date-time
          nullable: true
          description: First returned bucket within the evaluated range, not the earliest retained source date.
        lastAvailable:
          type: string
          format: date-time
          nullable: true
        provisionalBucket:
          type: string
          format: date-time
          nullable: true
        missingIntervals:
          type: array
          description: Buckets absent from the response regardless of metric coverage.
          items:
            $ref: '#/components/schemas/HistoryInterval'
        metrics:
          type: object
          description: Coverage keyed by public metric name. Available and missing bucket counts sum to evaluatedBuckets; partialBuckets is a subset of availableBuckets.
          additionalProperties:
            $ref: '#/components/schemas/HistoryMetricCoverage'
    VaultDetailResponse:
      type: object
      description: Single-vault detail response shape for `GET /v3/evk/vaults/{chainId}/{address}`.
      properties:
        chainId:
          type: integer
        address:
          type: string
        isEscrow:
          type: boolean
          description: True for an EVK vault the escrow perspective has verified as collateral-only. Derived by Euler from the perspective, never from a request; `vaultType` says `evk` for such a vault, so this flag is the only place escrow is answered.
        vaultType:
          type: string
          enum:
          - evk
          - securitize
          description: 'The label classification stored on the vault''s label row: `evk` for an EVK vault (escrow vaults included; read `isEscrow`), `securitize` only when an operator classified the row so. Every row on this surface is an EVK-factory vault; do not read a value other than `evk` as "not an EVK vault". This is not the vault *family* the resolver, Earn, and account routes report under the same name (`evk`, `earn`, `securitize`). Discovery writes the value, the Toolbox may override it through the label row, and it falls back to `evk` while the label row is unknown.'
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
        shares:
          $ref: '#/components/schemas/AssetRef'
        asset:
          $ref: '#/components/schemas/AssetRef'
        dToken:
          type: string
        oracle:
          $ref: '#/components/schemas/OracleInfo'
        unitOfAccount:
          $ref: '#/components/schemas/AssetRef'
        creator:
          type: string
        governor:
          type: string
          description: Latest governor admin if available; falls back to creator.
        governorAdmin:
          type: string
          description: Latest governor admin if available; falls back to creator.
        supplyCap:
          type: string
          description: Equal to `caps.supplyCap`; unlimited is type(uint256).max, `0` is a zero cap.
        borrowCap:
          type: string
          description: Equal to `caps.borrowCap`; unlimited is type(uint256).max, `0` is a zero cap.
        totalShares:
          type: string
          description: Raw vault share supply as a bigint string.
        totalAssets:
          type: string
          description: Raw underlying asset amount as a bigint string.
        totalBorrowed:
          type: string
          description: Raw borrowed asset amount as a bigint string.
        totalCash:
          type: string
          description: Raw cash amount as a bigint string.
        cash:
          type: string
          description: Raw cash amount as a bigint string.
        interestRate:
          type: string
          description: Raw contract interest-rate value as a bigint string.
        interestAccumulator:
          type: string
          description: Raw contract interest accumulator as a bigint string.
        accumulatedFees:
          type: string
