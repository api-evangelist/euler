          - type: 'null'
    ResolvedProductLabels:
      type: object
      readOnly: true
      description: Read-time entity fallbacks for display. Derived, never stored.
      required:
      - entityName
      - url
      - logo
      properties:
        entityName:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          description: Product url, falling back to the owning entity url.
        logo:
          type: string
          nullable: true
          description: Product logo, falling back to the owning entity logo.
    ProductLabels:
      type: object
      required:
      - id
      - chainId
      - entityId
      - coBrandEntityIds
      - name
      - isDeprecated
      - notExplorable
      - governanceMode
      - resolved
      - anyExplorableLend
      - anyExplorableBorrow
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        chainId:
          type: integer
          minimum: 1
        entityId:
          type: string
        coBrandEntityIds:
          type: array
          description: Additional entities whose logos should be displayed. Product management remains exclusively with entityId.
          items:
            type: string
        name:
          type: string
        logo:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[Hh][Tt][Tt][Pp][Ss]://
          description: Absolute https URL.
        portfolioNotice:
          type: string
          nullable: true
        isDeprecated:
          type: boolean
        deprecationReason:
          type: string
          nullable: true
        notExplorable:
          allOf:
          - $ref: '#/components/schemas/ListingFlag'
          description: Product-wide curator listing flag applied to both sides of every member vault unless a vault-level flag overrides it.
        governanceMode:
          type: string
          enum:
          - governed
          - ungoverned
          - unknown
          readOnly: true
          description: Derived by the server from the on-chain governor of member vaults; clients cannot set it. Products are created as `unknown`. Every vault assignment recomputes the mode over the resulting member set and rejects sets that mix governed and ungoverned vaults. Layer 2 adopts `governed` or `ungoverned` for an `unknown` product once its membership verifies against chain state. Entity members cannot update or delete an `ungoverned` product or its vaults after the initial assignment.
        resolved:
          $ref: '#/components/schemas/ResolvedProductLabels'
        anyExplorableLend:
          type: boolean
          readOnly: true
          description: True when at least one member vault is lend-discoverable per the materialized visibility verdicts. Live chain state (e.g. borrowability) is deliberately excluded.
        anyExplorableBorrow:
          type: boolean
          readOnly: true
          description: True when at least one member vault is borrow-discoverable per the materialized visibility verdicts. Live chain state (e.g. borrowability) is deliberately excluded.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        hold:
          type: object
          nullable: true
          description: The hold covering this row on a draft read; absent on published reads.
          allOf:
          - $ref: '#/components/schemas/LabelHoldSummary'
        platformListing:
          type: object
          nullable: true
          description: Euler's listing override on this product, shown to platform sessions on draft reads (null when there is none); absent on published reads and to curators.
          allOf:
          - $ref: '#/components/schemas/ProductPlatformListing'
    ChangeRecord:
      type: object
      description: One change in any data domain, with its full record.
      required:
      - id
      - domain
      - operation
      - opClass
      - targetKey
      - status
      - reason
      - value
      - before
      - appliedValue
      - checks
      - policy
      - actor
      - decision
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        operation:
          type: string
        opClass:
          description: What the change does, computed by the server. Geo changes are `tighten` (more people or assets fall under a rule), `loosen` (fewer, including any change that loosens one part) or `update` (nothing anyone is subject to changes, for example the reason).
          oneOf:
          - type: string
            enum:
            - fill
            - add
            - replace
            - update
            - remove
            - enable
            - disable
            - tighten
            - loosen
            - dismiss
            - resume
            - revert
          - type: 'null'
        targetKey:
          type: string
        status:
          type: string
          enum:
          - proposed
          - applied
          - rejected
          - superseded
          - reverted
          - withdrawn
          - failed
          - expired
        reason:
          type: string
        rationale:
          type:
          - string
          - 'null'
        value:
          description: The proposed after-state, in the domain's value shape.
        before:
          description: The state when the change was submitted.
        appliedValue:
          description: The state the change wrote, when applied.
        checks:
          type: array
          items:
            $ref: '#/components/schemas/ChangeCheck'
        policy:
          $ref: '#/components/schemas/ChangePolicyResult'
        evidence:
          type:
          - object
          - 'null'
          additionalProperties: true
        actor:
          $ref: '#/components/schemas/ChangeActorRef'
        decision:
          type:
          - object
          - 'null'
          required:
          - actor
          - at
          - comment
          properties:
            actor:
              $ref: '#/components/schemas/ChangeActorRef'
            at:
              type: string
              format: date-time
            comment:
              type:
              - string
              - 'null'
        expectedVersion:
          type:
          - string
          - 'null'
        resultingVersion:
          type:
          - string
          - 'null'
        revertsChangeId:
          type:
          - string
          - 'null'
          format: uuid
        supersededByChangeId:
          type:
          - string
          - 'null'
          format: uuid
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        error:
          type:
          - object
          - 'null'
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        uploadId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Token images only: the staged upload the change carries.'
        sourceProvider:
          type:
          - string
          - 'null'
          description: 'Token images only: `coingecko`, `pendle` or `pendle-pt-ring`; null for an upload.'
        sourceUrl:
          type:
          - string
          - 'null'
          description: Token images only.
        sourceEvidence:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 'Token images only: the provider record or the derivation the image came from.'
        events:
          type: array
          description: Present on the detail read only, oldest first.
          items:
            $ref: '#/components/schemas/ChangeEvent'
    GeoExposureEdge:
      type: object
      required:
      - address
      - relation
      properties:
        address:
          type: string
          description: Lowercase token address.
        relation:
          type: string
          enum:
          - erc4626
          - evk-share
          - escrow-share
          - earn-share
          - securitize-share
          - earn-allocation
          - pendle-pt
          - pendle-lp
          - pendle-sy
          - pendle-yt
          description: 'How the token is built on the other: in `parents` the other token is what this one wraps; in `reachedVia` the other token wraps this one.'
    AssetCoverage:
      type: object
      description: 'The onboarding checklist of one exposed asset: logo, price, category (`tags`), intrinsic APY (`yield`) and geo. Logo, price, tags and yield apply only to assets shown in the app, the scope of the logo and price lists; any other asset has them as `out-of-scope`. Geo applies to every exposed asset. `paused` is a standing review without a kind (stop for now). Every piece is read in a batch for the page.'
      required:
      - logo
      - price
      - yield
      - tags
      - geo
      properties:
        logo:
          allOf:
          - $ref: '#/components/schemas/AssetCoveragePiece'
          - type: object
            properties:
              state:
                type: string
                enum:
                - present
                - none-reviewed
                - paused
                - missing
                - out-of-scope
                description: 'Settled: `present` (a managed image) or `none-reviewed` (an applied `no-logo-available` review).'
        price:
          allOf:
          - $ref: '#/components/schemas/AssetCoveragePiece'
          - type: object
            properties:
              state:
                type: string
                enum:
                - market
                - onchain-only-reviewed
                - none-reviewed
                - paused
                - onchain-only
                - aging
                - source-stopped
                - unpriced
                - out-of-scope
                description: 'Settled: `market` (a fresh market price), `onchain-only-reviewed` (an `onchain-only` review) or `none-reviewed` (a `no-price-source` review). The `token-price-missing` states `onchain-only`, `aging`, `source-stopped` and `unpriced` without a standing review are needs.'
        yield:
          allOf:
          - $ref: '#/components/schemas/AssetCoveragePiece'
          - type: object
            required:
            - sources
            properties:
              state:
                type: string
                enum:
                - configured
                - none-reviewed
                - not-applicable
                - source-stopped
                - missing
                - out-of-scope
                description: 'Intrinsic APY cannot be inferred, so every asset in scope needs a decision. Settled: `configured` (a provider wrote a non-zero intrinsic APY for the asset in the last 7 days, or an enabled entry exists and any provider wrote a row, zero included, in that time), `none-reviewed` (an applied `no-intrinsic-apy` review) or `not-applicable` (an Euler vault share: EVK, Earn, escrow or Securitize). `source-stopped` is a need: an enabled entry with no row for the asset in the last 7 days, a new entry included until its source first runs, or an asset whose only rows are older than 7 days. Only served rows count: a provider set up per token counts only while the asset has an enabled entry for it, and a DefiLlama pool row only while the enabled pool mapping names its pool.'
              sources:
                type: array
                description: '`yield-source`: an enabled yield-source entry; `yield-pool`: an enabled DefiLlama pool mapping; `provider`: a provider serves a non-zero intrinsic APY now.'
                items:
                  type: string
                  enum:
                  - yield-source
                  - yield-pool
                  - provider
        tags:
          allOf:
          - $ref: '#/components/schemas/AssetCoveragePiece'
          - type: object
            required:
            - tags
            properties:
              state:
                type: string
                enum:
                - tagged
                - none-reviewed
                - untagged
                - out-of-scope
                description: 'Settled: `tagged` (any rule tags the token: a CoinGecko category, a symbol rule or an address rule) or `none-reviewed` (an applied `no-category` review). The proposal is a matching symbol, prefix, contains or address rule, or a proposed `no-category` review; category rules are not evaluated here.'
              tags:
                type: array
                description: The tags `/v3/tokens` derives for the token.
                items:
                  type: string
        geo:
          allOf:
          - $ref: '#/components/schemas/AssetCoveragePiece'
          - type: object
            properties:
              state:
                type: string
                enum:
                - covered
                - none-reviewed
                - paused
                - outstanding
                description: 'Settled: `covered` (a geo rule applies on the whole chain) or `none-reviewed` (an applied `no-rule-needed` review). The proposal is a `geo` rule that names the asset address, or a proposed review of the asset.'
    ChangePolicyResult:
      type: object
      required:
      - version
      - decision
      - reasons
      properties:
        version:
          type: string
        decision:
          oneOf:
          - type: string
            enum:
            - apply
            - propose
          - type: 'null'
          description: Null on rows recorded before the generic policy existed.
        reasons:
          type: array
          items:
            type: string
    PriceCoverageWorkItemList:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PriceCoverageWorkItem'
        meta:
          allOf:
          - $ref: '#/components/schemas/PaginationMeta'
          - type: object
            required:
            - counts
            - unreadSources
            properties:
              unreadSources:
                type: array
                items:
                  type: string
                description: Price sources whose token list could not be read. While it is not empty, the list is partial, because entries of these sources are missing from each item's `sources`.
              counts:
                type: object
                description: Listed items on the requested chains, before the state filter and paging.
                required:
                - unpriced
                - aging
                - sourceStopped
                - onchainOnly
                - reviewed
                properties:
                  unpriced:
                    type: integer
                  aging:
                    type: integer
                  sourceStopped:
                    type: integer
                  onchainOnly:
                    type: integer
                  reviewed:
                    type: integer
  parameters:
    AddressPath:
      name: address
      in: path
      required: true
      schema:
        type: string
    ChainIdPath:
      name: chainId
      in: path
      required: true
      schema:
        type: integer
    ImageVersionQuery:
      name: v
      in: query
      required: false
      description: First 8 hex characters of the image's content digest, as `logoURI` carries it. Only the current digest earns the year-long immutable cache; any other value, a malformed one included, is ignored and the image is served with the one-hour cache, never an error.
      schema:
        type: string
        pattern: ^[0-9a-f]{8}$
  headers:
    X-Request-Id:
      description: Request identifier for tracing.
      schema:
        type: string
  responses:
    Error403:
      description: Forbidden
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error400:
      description: Bad request
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error500:
      description: Internal server error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error503:
      description: Service unavailable
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404ChainCapability:
      description: 'Not found, or `CHAIN_CAPABILITY_DISABLED`: a requested chain does not run the capability the operation needs (see `capabilities` on `/v3/chains`), named in `x-chain-capability` or, where it depends on the request, in the parameter. `details.chainIds` lists those chains and `details.capability` names the capability.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CHAIN_CAPABILITY_DISABLED
              message: Chain(s) 137 do not run prices
              requestId: req_example
              details:
                chainIds:
                - 137
                capability: prices
    Error415:
      description: Unsupported media type
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error422:
      description: Validation error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Not found
