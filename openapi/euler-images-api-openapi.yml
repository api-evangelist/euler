    TokenLogoWorkItem:
      type: object
      description: One in-scope asset on the token-logo-missing work list.
      required:
      - id
      - chainId
      - address
      - symbol
      - name
      - workerOutcome
      - workerProvider
      - lastAttemptAt
      - nextRetryAt
      - review
      properties:
        id:
          type: string
          description: Opaque work item ID, `<chainId>:<lowercase token address>`, as on every work list.
          example: 1:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48
        chainId:
          type: integer
        address:
          type: string
          description: Lowercase token address.
        symbol:
          type: string
        name:
          type: string
        workerOutcome:
          type:
          - string
          - 'null'
          description: 'The logo worker''s latest outcome for the token: `no_candidate`, `invalid_source`, `provider_failure`, `created` or `already_present`. `shadow_candidate` is a legacy value the worker no longer writes; a token that still shows it is retried at `nextRetryAt`, and that attempt replaces it.'
        workerProvider:
          type:
          - string
          - 'null'
        lastAttemptAt:
          type:
          - string
          - 'null'
          format: date-time
        nextRetryAt:
          type:
          - string
          - 'null'
          format: date-time
        review:
          description: Null on the outstanding list; the applied dismissal on the reviewed list.
          oneOf:
