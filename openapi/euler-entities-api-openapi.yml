          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
          nullable: true
        description:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
