      operationId: updateEntity
    delete:
      tags:
      - Entities
      summary: Delete entity profile
      description: Deletes an entity profile row. Requires a platform-admin session and CSRF token.
      x-status: implemented
      security:
      - PlatformSession: []
        PlatformCsrf: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
      responses:
        '200':
          description: Entity profile was deleted.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/Entity'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Missing, invalid, or expired platform-admin session.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Inactive platform-admin access, missing CSRF token, or mismatched CSRF token.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Entity profile was not found.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Entity profile is still referenced by dependent resources.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid entity id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: deleteEntity
components:
  schemas:
    Entity:
      type: object
      required:
      - id
      - name
      - logo
      - description
      - url
      - socialTwitter
      - socialYoutube
      - socialDiscord
      - socialTelegram
      - socialGithub
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: Stable lowercase slug identifier.
        name:
          type: string
          pattern: \S
        logo:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
          nullable: true
        description:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
          nullable: true
        socialTwitter:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
          nullable: true
        socialYoutube:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
          nullable: true
        socialDiscord:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
          nullable: true
        socialTelegram:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
          nullable: true
        socialGithub:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EntityAddressCreateRequest:
      type: object
      additionalProperties: false
      required:
      - chainId
      - address
      - label
      properties:
        chainId:
          type: integer
          minimum: 1
        address:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: Valid EVM address. Lowercase or correctly checksummed mixed-case input is accepted.
        label:
          type: string
          pattern: \S
          description: Human-readable governance address label.
    EntityAddress:
      type: object
      required:
      - entityId
      - chainId
      - address
      - label
      properties:
        entityId:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        chainId:
          type: integer
          minimum: 1
        address:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          description: EIP-55 checksummed governance address in API responses.
        label:
          type: string
          pattern: \S
          description: Human-readable governance address label.
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              description: 'Domain error code. Examples:

                - INVALID_ADDRESS

                - CHAIN_NOT_SUPPORTED

                - VAULT_NOT_FOUND

                - TOKEN_NOT_FOUND

                - ACCOUNT_NOT_FOUND

                - VALIDATION_ERROR

                - RATE_LIMIT_EXCEEDED

                - UNSUPPORTED_MEDIA_TYPE

                - UNAUTHORIZED

                - FORBIDDEN

                - INTERNAL_ERROR

                '
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
    EntityMemberCreateRequest:
      type: object
      additionalProperties: false
      required:
      - email
      properties:
        email:
          type: string
          format: email
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
        name:
          type: string
          pattern: \S
          nullable: true
        role:
          type: string
          enum:
          - admin
          - editor
