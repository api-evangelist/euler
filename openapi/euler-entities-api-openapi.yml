        '422':
          description: Invalid entity id.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getEntity
    patch:
      tags:
      - Entities
      summary: Update entity profile
      description: Updates mutable entity profile fields. Requires a platform-admin session and CSRF token.
