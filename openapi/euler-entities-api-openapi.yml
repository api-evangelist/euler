        description:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
          nullable: true
        socialTwitter:
          type: string
          format: uri
          pattern: ^[Hh][Tt][Tt][Pp][Ss]?://
          nullable: true
        socialYoutube:
          type: string
          format: uri
