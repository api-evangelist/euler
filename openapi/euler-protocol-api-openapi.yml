openapi: 3.2.0
info:
  title: Euler Data API (V3) Protocol API
  version: 3.0.0
  description: 'API specification for Euler Data v3. This spec defines the current

    resource-oriented contract for the platform, with emphasis on consistent

    schemas, predictable REST semantics, caching, observability, and a uniform

    developer experience. This public document covers unauthenticated endpoints and integrations that

    use API keys, including capability-scoped keys. Browser-session Toolbox

    operations, admin-secret operations, and the Prometheus endpoint are served

    separately and are intentionally omitted. Migration notes

    - Euler Data v3 is not a path-for-path clone of v1/v2. Some endpoints map

    directly, some require multiple v3 calls, and some legacy aggregates were

    intentionally removed. - The live migration guide explains how legacy v1/v2

    endpoints and payloads map into the v3 resource model. - Important semantic changes:

    - Vault base APY and rewards APY are exposed separately in v3. - Account positions are flattened into account-vault rows instead of the

    legacy nested sub-account shape. - All supported API paths live under `/v3`; legacy paths return `410`. - Summary endpoints prefer smaller, focused resources over large

    BFF-style payloads. Base path: /v3


    Conventions

    - JSON field naming: camelCase

    - Addresses: accept lowercase or checksum; responses are EIP-55 checksummed

    - Public APY values (`*Apy`, `apy*`): percent numbers with 6 decimal places (e.g., 5.123456 = 5.123456%)

    - Contract interest-rate fields (`borrowAPY`, `supplyAPY` in `interestRates`): decimal strings in contract fraction units

    - Ratios (utilization, LTV, etc.): numbers with 6 decimal places

    - Response timestamps: ISO-8601 strings (UTC). Some legacy fields still expose unix

    seconds for compatibility and include `*Iso` companions. - Query time ranges: unix seconds (from/to)


    Unit policy

    - v3 separates market metadata from contract verdicts by both name and type. - Market-normalized USD prices and USD values are JSON numbers. These are values

    derived from off-chain pricing, cached price snapshots, or API-level market math. This includes `/v3/prices`, token price routes, vault/earn/protocol USD totals,

    portfolio market values, portfolio USD liquidation/risk fields such as

    `liabilityValueUsd`, `totalCollateralValueUsd`, `borrowLiquidationPriceUsd`,

    and `collateralLiquidationPricesUsd`, and vault holder `assetsUsd`. - Contract-derived oracle and raw account-liquidity verdict values are exact strings. These preserve the integer value used by contracts, normalized to 18 decimals

    for API exposure. Oracle prices are quoted in the vault unit of account, which

    can be USD, ETH, or another asset. This includes `/v3/oracles/prices`, raw

    account-liquidity `liabilityValue` and `totalCollateralValue` objects,

    `liabilityValueBorrowing`, `liabilityValueLiquidation`, and collateral verdict

    values. - On-chain token quantities are bigint strings in their native unit scale. This

    includes amounts, balances, shares, assets, borrows, reward amounts, liquidation

    repay/yield amounts, and block numbers. - Caps are also bigint strings, but EVK caps are exposed as resolved underlying

    asset-unit amounts rather than packed contract config words; an unlimited EVK cap is

    type(uint256).max and `0` is a zero cap. The exceptions are

    cap-history and config-history, which carry the raw uint16 encodings. - LTV config values use canonical basis-point strings. Legacy decimal aliases

    may remain on config-history payloads for compatibility when explicitly named. Rate limiting

    - Optional API keys for higher limits

    - Standard limits are 1000 req/min for unauthenticated callers (IP-based)

    and 10000 req/min for authenticated callers (per API key), with a 60s window. Individual API keys can carry a custom limit. - By default, proxy headers are not trusted for IP identity unless explicitly enabled. - Redis failures default to fail-closed (503) for strict enforcement; fail-open is opt-in. - RateLimit-* (IETF draft-6) and legacy X-RateLimit-* headers are returned.'
servers:
- url: /
  description: Current environment
security: []
tags:
- name: Protocol
  description: Protocol-wide summary endpoints and aggregate metrics. In v3, these endpoints are explicitly summary-oriented and should be treated as lightweight rollups rather than replacements for full vault list payloads.
paths:
  /v3:
    get:
      tags:
      - Protocol
      summary: Service metadata
      x-status: implemented
      responses:
        '200':
          description: Service metadata
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                      version:
                        type: string
                      docs:
                        type: string
                      openapi:
                        type: string
                      health:
                        type: string
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
      operationId: getRoot
  /v3/openapi.json:
    get:
      tags:
      - Protocol
      summary: OpenAPI document
      x-status: implemented
      responses:
        '200':
          description: OpenAPI document
      operationId: getOpenapiJson
  /v3/docs:
    get:
      tags:
      - Protocol
      summary: Developer documentation UI
      x-status: implemented
      responses:
        '200':
          description: Documentation UI
      operationId: getDocs
  /v3/docs/migration:
    get:
      tags:
      - Protocol
      summary: Migration guide from v1 and v2
      x-status: implemented
      responses:
        '200':
          description: Human-readable migration guide.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            text/html:
              schema:
                type: string
      operationId: getMigrationGuide
  /v3/protocol/stats:
    get:
      tags:
      - Protocol
      summary: Protocol-wide lending stats across chains
      description: 'Returns lending aggregates across the selected chains. The stats count what the app shows, plus the vaults kept out of it only by deprecation, for every vault from Euler''s factories (the EVK factory, escrow vaults included; the Earn factory; the Securitize factory). Shown means the verdict is `visible` or `warning` with at least one listing side not hidden, as the app and the work items read it, so Layer 1, Layer 2, advisories, claims and listing flags apply exactly as in the app. An escrow or Securitize vault counts while a counted vault accepts it as collateral with a liquidation LTV above zero, even when Layer 1 hides it. Vaults hidden by checks, hidden by a platform admin or a curator verdict, pending review, unclaimed, or without a Layer 1 verdict yet are left out. Prices are the selected current price at most 24 hours old, the on-chain fallback included. A vault that holds a balance without such a price, or whose balance was read more than 15 minutes ago, is left out and its chain still counts with what was priced, however much of the chain that vault holds. `meta.excludedVaults` reports what was left out and why. `earnTotalAssetsUsd` is reported separately and is not part of `totalSuppliedUsd` or `utilization`. Chains with incomplete membership or stale source state are omitted and reported in response metadata; a chain with unread balances still contributes the vaults it read. Partial responses use `Cache-Control: no-store`.

        Needs the `stats` chain capability. A `chainId` naming a chain without it answers 404 `CHAIN_CAPABILITY_DISABLED`; without `chainId`, served chains without it are left out and listed in `meta.excludedChains`.'
      x-status: implemented
      x-chain-capability: stats
      x-cache-ttl: 60
      parameters:
      - $ref: '#/components/parameters/ChainIdParam'
      responses:
        '200':
          description: Protocol stats
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProtocolStats'
                  meta:
                    $ref: '#/components/schemas/ProtocolStatsMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404ChainCapability'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getProtocolStats
  /v3/protocol/stats/history:
    get:
      tags:
      - Protocol
      summary: Daily protocol or selected-chain lending history
      description: 'Days written from this release on count the vaults `/v3/protocol/stats` counts; earlier days keep the earlier rule and are not recomputed. A row written after its day closed (catch-up, repair, backfill) has no daily Securitize balances, so it leaves Securitize deposits out, and a backfill row has no Earn total. A day is written with what was priced: a vault without a usable price that day is left out, and the day stays as written. Returns complete retained daily aggregates by default. With includePartial=true, days with only some chain rows are also returned with explicit point coverage and Cache-Control no-store. Missing dates and per-metric availability are reported in meta.coverage in either mode. Empty scopes remain empty; no zero-valued days are synthesized. Only 1d resolution is supported, ranges are inclusive, the default window is 30 days, and the maximum is 732 buckets. With groupBy=chain, data.chains adds chain-ID-ordered series from the same database snapshot and eligible days as data.history. Additive EVK values reconcile to the aggregate; utilization is a ratio, not a sum. Without an explicit chain filter, groups contain retained chain IDs only, not an inferred historical registry.

        Needs the `stats` chain capability. A `chainId` naming a chain without it answers 404 `CHAIN_CAPABILITY_DISABLED`; without `chainId` the stored protocol series is read, and served chains without `stats` are listed in `meta.excludedChains`.'
      x-status: implemented
      x-chain-capability: stats
      x-cache-ttl: 300
      parameters:
      - name: groupBy
        in: query
        required: false
        description: Add per-chain series with independent range and metric coverage.
        schema:
          type: string
          enum:
          - chain
      - name: includePartial
        in: query
        required: false
        description: Include retained healthy-chain subtotals on incomplete days. Does not reconstruct missing vaults or chains.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/ChainIdParam'
      - name: resolution
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1d
          default: 1d
      - $ref: '#/components/parameters/HistoryFromParam'
      - $ref: '#/components/parameters/HistoryToParam'
      responses:
        '200':
          description: Protocol stats daily history
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    required:
                    - history
                    properties:
                      history:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProtocolStatsHistoryPoint'
                      chains:
                        type: array
                        description: Present only with groupBy=chain. Sorted by numeric chain ID, with history ordered by ascending UTC day.
                        items:
                          $ref: '#/components/schemas/ProtocolStatsChainHistory'
                  meta:
                    $ref: '#/components/schemas/ProtocolStatsHistoryMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404ChainCapability'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getProtocolStatsHistory
  /v3/flows/history:
    get:
      tags:
      - Protocol
      summary: Daily EVK supplied net flows and event-category USD totals
      description: 'Returns retained daily EVK deposit, withdrawal, borrow, repay and liquidation USD totals. Net supplied flow is depositsUsd minus withdrawalsUsd; borrows, repays and liquidations are reported separately and do not enter the net formula. Each category is independently nullable; missing chain rows or unavailable category valuation are not reported as zero. Net supplied flow remains available when deposits and withdrawals are available even if another category is not. Values use eligible positive historical asset prices at or before each event, within 15 minutes and bounded by the event block. Rollups and backfills cover retained raw EVK events; coverage describes the requested range and does not prove complete historical source retention. Protocol, chain and vault scopes use the current visible labelled EVK vault membership; Earn and unlabelled vaults are excluded. Historical label membership is not reconstructed. Omitting chainId selects the served chains that run stats. A vault filter requires exactly one selected chain. Only 1d resolution is supported, ranges are inclusive, the default window is 30 days, and the maximum is 732 buckets. Only closed UTC days are published; the current open day is omitted. With groupBy=chain, data.chains adds a series and independent coverage for every selected chain, including empty series. Missing days remain absent; no zero-valued days are synthesized. Incomplete range coverage uses Cache-Control no-store. Complete HTTP responses may remain cached for up to 300 seconds after source invalidation; fresh database reads exclude pending buckets, including after the cached response expires. Unknown or repeated query parameters, duplicate chain IDs and invalid ranges return 400. An unsupported chainId returns 404 with error code CHAIN_NOT_SUPPORTED.

        Needs the `stats` chain capability. A `chainId` naming a chain without it answers 404 `CHAIN_CAPABILITY_DISABLED`; without `chainId`, served chains without it are left out and listed in `meta.excludedChains`.'
      x-status: implemented
      x-chain-capability: stats
      x-cache-ttl: 300
      parameters:
      - $ref: '#/components/parameters/ChainIdParam'
      - name: vault
        in: query
        required: false
        description: Filter to one EVK vault; requires exactly one selected configured chain.
        schema:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
      - name: resolution
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1d
          default: 1d
      - $ref: '#/components/parameters/HistoryFromParam'
      - $ref: '#/components/parameters/HistoryToParam'
      - name: groupBy
        in: query
        required: false
        description: Add series ordered by numeric chain ID, each ordered by ascending UTC day.
        schema:
          type: string
          enum:
          - chain
      responses:
        '200':
          description: Daily retained EVK flows with explicit range and metric coverage.
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: object
                    required:
                    - history
                    properties:
                      history:
                        type: array
                        items:
                          $ref: '#/components/schemas/FlowsHistoryPoint'
                      chains:
                        type: array
                        description: Present only with groupBy=chain.
                        items:
                          $ref: '#/components/schemas/FlowsChainHistory'
                  meta:
                    $ref: '#/components/schemas/FlowsHistoryMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404ChainCapability'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getFlowsHistory
components:
  schemas:
    PaginationMeta:
      type: object
      required:
      - timestamp
      properties:
        total:
          type: integer
          description: Exact total count when the endpoint provides one.
        hasMore:
          type: boolean
          description: Indicates whether another page exists beyond the current page.
        offset:
          type: integer
        limit:
          type: integer
          description: Echoed page size after endpoint-side clamping.
        outcome:
          type: string
          enum:
          - disabled
          - removed
          description: On a toolbox config DELETE, what happened to the row.
        products:
          type: array
          description: 'On a curation vault `POST`, `PUT`, or `PATCH`: the products the write touched (the one the vault left and the one it joined) as they are after the write, `governanceMode` included, so the caller applies them instead of re-reading.'
          items:
            $ref: '#/components/schemas/ProductLabels'
        timestamp:
          type: string
          format: date-time
        chainId:
          type: string
          description: Comma-separated chain IDs for multi-chain responses.
        degradedProviders:
          type: array
          items:
            type: string
          description: Live providers whose data is incomplete in this response.
        excludedChains:
          $ref: '#/components/schemas/ExcludedChains'
    HistoryMetricCoverage:
      type: object
      required:
      - status
      - availableBuckets
      - partialBuckets
      - missingBuckets
      - missingIntervals
      - partialIntervals
      properties:
        status:
          type: string
          enum:
          - complete
          - partial
          - missing
          - not_applicable
        availableBuckets:
          type: integer
          minimum: 0
          description: Distinct elapsed requested buckets with a finite value, including partial aggregate values and observed zero.
        partialBuckets:
          type: integer
          minimum: 0
          description: Available buckets whose aggregate covers only part of the requested chain scope.
        missingBuckets:
          type: integer
          minimum: 0
        missingIntervals:
          type: array
          items:
            $ref: '#/components/schemas/HistoryInterval'
        partialIntervals:
          type: array
          items:
            $ref: '#/components/schemas/HistoryInterval'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              description: 'Domain error code. Examples:

                - BAD_REQUEST

                - INVALID_ADDRESS

                - INVALID_CHAIN_ID

                - CHAIN_NOT_SUPPORTED

                - CHAIN_CAPABILITY_DISABLED

                - NOT_FOUND

                - VAULT_NOT_FOUND

                - TOKEN_NOT_FOUND

                - ACCOUNT_NOT_FOUND

                - VALIDATION_ERROR

                - CONFLICT

                - PRECONDITION_FAILED

                - PAYLOAD_TOO_LARGE

                - RATE_LIMIT_EXCEEDED

                - UNSUPPORTED_MEDIA_TYPE

                - UPSTREAM_TIMEOUT

                - UNAUTHORIZED

                - FORBIDDEN

                - SERVICE_UNAVAILABLE

                - SERVICE_DISABLED

                - INTERNAL_ERROR

                '
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Context of the error. Where present, `details.reason` is a stable kebab-case value to key on, and `details.cause` narrows a reason that has several causes. The labels routes list theirs in the Labels tag.
    ProtocolHistoryPointCoverage:
      type: object
      required:
      - complete
      - includedChainIds
      - missingChainIds
      description: Coverage of the stored aggregate. Partially reconstructed chain rows can remain incomplete even when every requested chain has a stored row. Nullable Earn USD is reported separately; complete coverage does not certify every underlying historical source.
      properties:
        complete:
          type: boolean
        includedChainIds:
          type: array
          items:
            type: integer
        missingChainIds:
          type: array
          nullable: true
          items:
            type: integer
          description: Requested chain IDs without a row. Null for incomplete unfiltered days because the historical expected chain universe is not persisted.
    ListingFlag:
      type: boolean
      nullable: true
      description: Curator listing flag. `null` leaves the decision to platform overrides and deprecation, `true` hides the vault(s) from discovery, `false` keeps a deprecated vault listed.
    ProtocolStatsChainHistory:
      type: object
      required:
      - chainId
      - history
      - coverage
      description: Retained history for one chain, restricted to the same eligible days as the aggregate. Explicitly selected chains without rows have empty history.
      properties:
        chainId:
          type: integer
        history:
          type: array
          items:
            $ref: '#/components/schemas/ProtocolStatsHistoryPoint'
        coverage:
          $ref: '#/components/schemas/HistoryCoverage'
    ProtocolStatsHistoryPoint:
      type: object
      required:
      - timestamp
      - totalSuppliedUsd
      - totalBorrowedUsd
      - availableUsd
      - utilization
      - vaultCount
      - earnTotalAssetsUsd
      - coverage
      properties:
        coverage:
          $ref: '#/components/schemas/ProtocolHistoryPointCoverage'
        timestamp:
          type: string
          format: date-time
          description: UTC start of the represented day.
        totalSuppliedUsd:
          type: number
          description: 'Supplied assets of the counted vaults, valued with bucket-aligned prices: EVK (escrow included) and, on rows written during the day, Securitize. A vault without a price that day is left out. Days before this rule shipped counted the published label set.'
        totalBorrowedUsd:
          type: number
          description: Borrows of the counted EVK vaults, valued with bucket-aligned prices.
        availableUsd:
          type: number
          description: '`totalSuppliedUsd - totalBorrowedUsd`.'
        utilization:
          type: number
          description: '`totalBorrowedUsd / totalSuppliedUsd`, or zero when supplied is zero.'
        vaultCount:
          type: integer
          description: Counted EVK vaults with a value that day, escrow and empty vaults included. Earn and Securitize vaults are excluded so the definition is stable across captured and rebuilt rows. Days before this rule shipped counted the published label set.
        earnTotalAssetsUsd:
          type: number
          nullable: true
          description: Current daily writes include Earn TVL; historical backfill rows are null because retained Earn history cannot reconstruct truthful USD values.
    LabelHoldSummary:
      description: What a draft read shows on a held row.
      type: object
      required:
      - id
      - kind
      - reason
      - since
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - quarantine
          - entity-hold
        reason:
          type: string
        since:
          type: string
          format: date-time
    FlowsHistoryPoint:
      type: object
      required:
      - timestamp
      - depositsUsd
      - withdrawalsUsd
      - borrowsUsd
      - repaysUsd
      - liquidationsUsd
      - netSuppliedUsd
      - updatedAt
      - coverage
      properties:
        timestamp:
          type: string
          format: date-time
          description: UTC start of the represented day.
        depositsUsd:
          type: number
          nullable: true
          minimum: 0
          description: Sum of retained EVK deposit asset amounts valued at event time, or null when unavailable.
        withdrawalsUsd:
          type: number
          nullable: true
          minimum: 0
          description: Sum of retained EVK withdrawal asset amounts valued at event time, or null when unavailable.
        borrowsUsd:
          type: number
          nullable: true
          minimum: 0
          description: Sum of retained EVK borrow asset amounts valued at event time, or null when unavailable.
        repaysUsd:
          type: number
          nullable: true
          minimum: 0
          description: Sum of retained EVK repay asset amounts valued at event time, or null when unavailable.
        liquidationsUsd:
          type: number
          nullable: true
          minimum: 0
          description: Sum of retained EVK liquidation repay asset amounts valued at event time, or null when unavailable.
        netSuppliedUsd:
          type: number
          nullable: true
          description: DepositsUsd minus withdrawalsUsd; null if either input is unavailable. Borrows, repays and liquidations do not enter this formula. Negative values represent net withdrawals.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Oldest rollup calculation time across the selected chain rows, or null when a selected row or its calculation time is unavailable.
        coverage:
          $ref: '#/components/schemas/FlowsHistoryPointCoverage'
    FlowsHistoryMeta:
      type: object
      required:
      - timestamp
      - chainId
      - resolution
      - from
      - to
      - coverage
      properties:
        timestamp:
          type: string
          format: date-time
        chainId:
          type: string
          description: Canonical comma-separated selected chain IDs; without a filter, the served chains that run stats.
        vault:
          type: string
          pattern: ^0x[a-f0-9]{40}$
          description: Lowercase vault filter, present only for a vault-scoped request.
        resolution:
          type: string
          enum:
          - 1d
        from:
          type: integer
          description: Effective inclusive range start in Unix seconds.
        to:
          type: integer
          description: Effective inclusive range end in Unix seconds.
        groupBy:
          type: string
          enum:
          - chain
        coverage:
          $ref: '#/components/schemas/HistoryCoverage'
        excludedChains:
          $ref: '#/components/schemas/ExcludedChains'
    HistoryCoverage:
      type: object
      required:
      - scope
      - status
      - requestedBuckets
      - evaluatedBuckets
      - returnedBuckets
      - futureBuckets
      - firstAvailable
      - lastAvailable
      - provisionalBucket
      - missingIntervals
      - metrics
      description: Availability within the requested range, not proof of historical membership, vault inception, source retention, recoverability, or price accuracy. Leading and trailing absent buckets are included. Future buckets are excluded from evaluation; the current bucket is provisional. Missing fields and read failures remain unavailable without asserting their root cause.
      properties:
        scope:
          type: string
          enum:
          - requested-range
        status:
          type: string
          enum:
          - complete
          - partial
          - missing
          - not_applicable
          description: Complete requires all evaluated buckets and all reported metrics. Missing means no returned buckets. Not applicable means the range is entirely in the future.
        requestedBuckets:
          type: integer
          minimum: 1
        evaluatedBuckets:
          type: integer
          minimum: 0
        returnedBuckets:
          type: integer
          minimum: 0
        futureBuckets:
          type: integer
          minimum: 0
        firstAvailable:
          type: string
          format: date-time
          nullable: true
          description: First returned bucket within the evaluated range, not the earliest retained source date.
        lastAvailable:
          type: string
          format: date-time
          nullable: true
        provisionalBucket:
          type: string
          format: date-time
          nullable: true
        missingIntervals:
          type: array
          description: Buckets absent from the response regardless of metric coverage.
          items:
            $ref: '#/components/schemas/HistoryInterval'
        metrics:
          type: object
          description: Coverage keyed by public metric name. Available and missing bucket counts sum to evaluatedBuckets; partialBuckets is a subset of availableBuckets.
          additionalProperties:
            $ref: '#/components/schemas/HistoryMetricCoverage'
    ExcludedChains:
      type: array
      description: 'On a read across chains that names no `chainId`: the served chains it left out because they do not run the capability the operation needs, rather than reading them as empty. Absent when no chain was left out.'
      items:
        type: object
        required:
        - chainId
        - capability
        properties:
          chainId:
            type: integer
          capability:
            type: string
            enum:
            - indexing
            - activity
            - prices
            - historicalPrices
            - assessments
            - labels
            - logos
            - stats
            - risk
            - rewards
            - apys
    FlowsChainHistory:
      type: object
      required:
      - chainId
      - history
      - coverage
      properties:
        chainId:
          type: integer
        history:
          type: array
          items:
            $ref: '#/components/schemas/FlowsHistoryPoint'
        coverage:
          $ref: '#/components/schemas/HistoryCoverage'
    ProtocolStatsHistoryMeta:
      type: object
      required:
      - timestamp
      - from
      - to
      - resolution
      properties:
        coverage:
          $ref: '#/components/schemas/HistoryCoverage'
        includePartial:
          type: boolean
          description: Whether incomplete retained chain aggregates may appear in history.
        groupBy:
          type: string
          enum:
          - chain
          description: Present only when per-chain history is requested.
        timestamp:
          type: string
          format: date-time
        from:
          type: integer
          description: Effective inclusive range start in Unix seconds.
        to:
          type: integer
          description: Effective inclusive range end in Unix seconds.
        resolution:
          type: string
          enum:
          - 1d
        chainId:
          type: string
          description: Canonical comma-separated selected chain IDs when filtering.
        excludedChains:
          $ref: '#/components/schemas/ExcludedChains'
    FlowsHistoryPointCoverage:
      type: object
      required:
      - complete
      - includedChainIds
      - missingChainIds
      description: Coverage of the selected configured chains for this day. Complete requires every selected chain row and all five category USD values; it does not assert complete historical event retention.
      properties:
        complete:
          type: boolean
        includedChainIds:
          type: array
          items:
            type: integer
        missingChainIds:
          type: array
          items:
            type: integer
    ProductPlatformListing:
      description: The platform-owned discovery decision on a product, as a product row shows it.
      type: object
      required:
      - notExplorableLend
      - notExplorableBorrow
      - reason
      properties:
        notExplorableLend:
          type: boolean
        notExplorableBorrow:
          type: boolean
        reason:
          type: string
          nullable: true
    ProtocolStatsExcludedTotals:
      type: object
      required:
      - vaultCount
      - suppliedUsd
      - borrowedUsd
      - earnTotalAssetsUsd
      description: USD sums cover only the vaults among them that have a usable price.
      properties:
        vaultCount:
          type: integer
          minimum: 0
        suppliedUsd:
          type: number
          description: EVK and Securitize supply these vaults would add to `totalSuppliedUsd`.
        borrowedUsd:
          type: number
        earnTotalAssetsUsd:
          type: number
          description: Earn assets these vaults would add to `earnTotalAssetsUsd`.
    ProtocolStatsExcludedVaults:
      type: object
      required:
      - hiddenByLayer1
      - notShown
      - notEvaluated
      - unpriced
      - stale
      description: Factory vaults the totals leave out on the included chains, by reason. Only vaults Layer 1 hides carry USD, valued from the same snapshot and price reads as the counted vaults; the others are counted only.
      properties:
        hiddenByLayer1:
          allOf:
          - $ref: '#/components/schemas/ProtocolStatsExcludedTotals'
          description: Vaults Layer 1 checks hide (`config-failed`, `config-suspended`, or a failed Layer 1 behind a Layer 2 hide). An escrow or Securitize vault a counted vault accepts as collateral keeps counting even when Layer 1 hides it. A hidden vault without a stored balance snapshot adds no USD.
        notShown:
          type: object
          required:
          - vaultCount
          description: 'Vaults the app does not show for any other reason: pending review or unclaimed, hidden by a platform admin or a curator verdict, delisted, or collateral no counted vault accepts.'
          properties:
            vaultCount:
              type: integer
              minimum: 0
        notEvaluated:
          type: object
          required:
          - vaultCount
          description: Vaults without a Layer 1 verdict yet.
          properties:
            vaultCount:
              type: integer
              minimum: 0
        unpriced:
          type: object
          required:
          - vaultCount
          description: Counted vaults holding a balance without a usable price. Their USD is unknown.
          properties:
            vaultCount:
              type: integer
              minimum: 0
        stale:
          type: object
          required:
          - vaultCount
          description: Counted vaults whose balance was read more than 15 minutes ago.
          properties:
            vaultCount:
              type: integer
              minimum: 0
    HistoryInterval:
      type: object
      required:
      - from
      - to
      description: Inclusive UTC bucket-start bounds. A single absent bucket has equal from/to values.
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    ProtocolStatsMeta:
      allOf:
      - $ref: '#/components/schemas/PaginationMeta'
      - type: object
        required:
        - calculationTimestamp
        - complete
        - includedChainIds
        - incompleteChainIds
        properties:
          calculationTimestamp:
            type: string
            format: date-time
            description: Time at which chain availability and aggregates were evaluated.
          complete:
            type: boolean
            description: 'True when every chain in the requested scope with a counted vault contributed from fresh source state, with every counted vault''s balance read. A vault without a usable price or with a balance read too long ago does not make its chain incomplete, however much of the chain it holds: it is left out of the totals and counted in `excludedVaults`. A chain is left out only when none of its counted vaults has a fresh balance (`stale_source`).'
          includedChainIds:
            type: array
            items:
              type: integer
            description: Requested chains with counted vaults whose values contribute to the returned aggregate.
          incompleteChainIds:
            type: array
            items:
              type: integer
            description: Requested chains with incomplete membership, unread balances, or stale source state. A chain with only unread balances may still contribute the vaults it read.
          incompleteChainReasons:
            type: array
            description: Reasons for each incomplete chain in the requested scope. Empty for a complete response.
            items:
              type: object
              required:
              - chainId
              - reasons
              properties:
                chainId:
                  type: integer
                reasons:
                  type: array
                  nullable: true
                  description: 'Null when the cached snapshot lacks reason provenance. `membership`: a counted vault is missing from the indexed inventory. `valuation`: a counted vault''s balance could not be read; the chain still contributes the vaults it read. `stale_source`: none of the chain''s counted vaults has a balance read in the last 15 minutes, priced or not, so nothing on the chain was observed. Every reason but `valuation` leaves the chain out of the totals.'
                  items:
                    type: string
                    enum:
                    - membership
                    - valuation
                    - stale_source
          excludedVaults:
            nullable: true
            description: What the totals leave out and why, summed over the included chains. Null when an included chain's serving snapshot was written before this was recorded.
            allOf:
            - $ref: '#/components/schemas/ProtocolStatsExcludedVaults'
    ResolvedProductLabels:
      type: object
      readOnly: true
      description: Read-time entity fallbacks for display. Derived, never stored.
      required:
      - entityName
      - url
      - logo
      properties:
        entityName:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          description: Product url, falling back to the owning entity url.
        logo:
          type: string
          nullable: true
          description: Product logo, falling back to the owning entity logo.
    ProductLabels:
      type: object
      required:
      - id
      - chainId
      - entityId
      - coBrandEntityIds
      - name
      - isDeprecated
      - notExplorable
      - governanceMode
      - resolved
      - anyExplorableLend
      - anyExplorableBorrow
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        chainId:
          type: integer
          minimum: 1
        entityId:
          type: string
        coBrandEntityIds:
          type: array
          description: Additional entities whose logos should be displayed. Product management remains exclusively with entityId.
          items:
            type: string
        name:
          type: string
        logo:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[Hh][Tt][Tt][Pp][Ss]://
          description: Absolute https URL.
        portfolioNotice:
          type: string
          nullable: true
        isDeprecated:
          type: boolean
        deprecationReason:
          type: string
          nullable: true
        notExplorable:
          allOf:
          - $ref: '#/components/schemas/ListingFlag'
          description: Product-wide curator listing flag applied to both sides of every member vault unless a vault-level flag overrides it.
        governanceMode:
          type: string
          enum:
          - governed
          - ungoverned
          - unknown
          readOnly: true
          description: Derived by the server from the on-chain governor of member vaults; clients cannot set it. Products are created as `unknown`. Every vault assignment recomputes the mode over the resulting member set and rejects sets that mix governed and ungoverned vaults. Layer 2 adopts `governed` or `ungoverned` for an `unknown` product once its membership verifies against chain state. Entity members cannot update or delete an `ungoverned` product or its vaults after the initial assignment.
        resolved:
          $ref: '#/components/schemas/ResolvedProductLabels'
        anyExplorableLend:
          type: boolean
          readOnly: true
          description: True when at least one member vault is lend-discoverable per the materialized visibility verdicts. Live chain state (e.g. borrowability) is deliberately excluded.
        anyExplorableBorrow:
          type: boolean
          readOnly: true
          description: True when at least one member vault is borrow-discoverable per the materialized visibility verdicts. Live chain state (e.g. borrowability) is deliberately excluded.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        hold:
          type: object
          nullable: true
          description: The hold covering this row on a draft read; absent on published reads.
          allOf:
          - $ref: '#/components/schemas/LabelHoldSummary'
        platformListing:
          type: object
          nullable: true
          description: Euler's listing override on this product, shown to platform sessions on draft reads (null when there is none); absent on published reads and to curators.
          allOf:
          - $ref: '#/components/schemas/ProductPlatformListing'
    ProtocolStats:
      type: object
      description: Lending aggregates across the selected chains, with Earn TVL reported separately.
      properties:
        totalSuppliedUsd:
          type: number
          description: 'Total supplied in USD: the `cash + totalBorrows` of every counted EVK vault (escrow vaults included) plus the deposits of every counted Securitize vault (its shares outstanding, one share to one asset), valued in USD. Earn vault assets are excluded.'
        totalBorrowedUsd:
          type: number
          description: Total borrows in USD of the counted EVK vaults, all borrows counted. Securitize and escrow vaults lend nothing.
        earnTotalAssetsUsd:
          type: number
          description: Total assets in USD of every counted Earn vault. Reported separately and not included in `totalSuppliedUsd` or `utilization`, since Earn deposits sit in EVK vaults.
        utilization:
          type: number
          description: Lending utilization, computed as `totalBorrowedUsd / totalSuppliedUsd`. Earn assets are excluded from the denominator.
        vaultCount:
          type: integer
          description: 'The vaults whose value is in the totals: counted EVK, escrow, Securitize and Earn vaults, empty ones included. Vaults left out (not shown, hidden by Layer 1, not evaluated yet, without a usable price, or read too long ago) are not in it.'
        chainCount:
          type: integer
  headers:
    X-Request-Id:
      description: Request identifier for tracing.
      schema:
        type: string
    Cache-Control:
      description: Cache policy for this response.
      schema:
        type: string
  responses:
    Error400:
      description: Bad request
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error500:
      description: Internal server error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404ChainCapability:
      description: 'Not found, or `CHAIN_CAPABILITY_DISABLED`: a requested chain does not run the capability the operation needs (see `capabilities` on `/v3/chains`), named in `x-chain-capability` or, where it depends on the request, in the parameter. `details.chainIds` lists those chains and `details.capability` names the capability.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CHAIN_CAPABILITY_DISABLED
              message: Chain(s) 137 do not run prices
              requestId: req_example
              details:
                chainIds:
                - 137
                capability: prices
    Error429:
      description: Rate limited
      headers:
        Retry-After:
          description: Seconds until next request is allowed.
          schema:
            type: integer
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    HistoryFromParam:
      name: from
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
      description: Unix timestamp in seconds, no later than 2038-01-19T03:14:07Z.
    ChainIdParam:
      name: chainId
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated list of positive chain IDs (single value allowed). Duplicate IDs are removed in first-occurrence order; at most 20 distinct IDs and 512 input characters are accepted.
      example: 1,10,8453
    HistoryToParam:
      name: to
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
      description: Unix timestamp in seconds, no later than 2038-01-19T03:14:07Z.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication (optional; higher rate limits).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Alternative to X-API-Key using Authorization: Bearer <key>'
