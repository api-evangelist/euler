openapi: 3.2.0
info:
  title: Euler Data API (V3) Rewards API
  version: 3.0.0
  description: 'API specification for Euler Data v3. This spec defines the current

    resource-oriented contract for the platform, with emphasis on consistent

    schemas, predictable REST semantics, caching, observability, and a uniform

    developer experience. This public document covers unauthenticated endpoints and integrations that

    use API keys, including capability-scoped keys. Browser-session Toolbox

    operations, admin-secret operations, and the Prometheus endpoint are served

    separately and are intentionally omitted. Migration notes

    - Euler Data v3 is not a path-for-path clone of v1/v2. Some endpoints map

    directly, some require multiple v3 calls, and some legacy aggregates were

    intentionally removed. - The live migration guide explains how legacy v1/v2

    endpoints and payloads map into the v3 resource model. - Important semantic changes:

    - Vault base APY and rewards APY are exposed separately in v3. - Account positions are flattened into account-vault rows instead of the

    legacy nested sub-account shape. - All supported API paths live under `/v3`; legacy paths return `410`. - Summary endpoints prefer smaller, focused resources over large

    BFF-style payloads. Base path: /v3


    Conventions

    - JSON field naming: camelCase

    - Addresses: accept lowercase or checksum; responses are EIP-55 checksummed

    - Public APY values (`*Apy`, `apy*`): percent numbers with 6 decimal places (e.g., 5.123456 = 5.123456%)

    - Contract interest-rate fields (`borrowAPY`, `supplyAPY` in `interestRates`): decimal strings in contract fraction units

    - Ratios (utilization, LTV, etc.): numbers with 6 decimal places

    - Response timestamps: ISO-8601 strings (UTC). Some legacy fields still expose unix

    seconds for compatibility and include `*Iso` companions. - Query time ranges: unix seconds (from/to)


    Unit policy

    - v3 separates market metadata from contract verdicts by both name and type. - Market-normalized USD prices and USD values are JSON numbers. These are values

    derived from off-chain pricing, cached price snapshots, or API-level market math. This includes `/v3/prices`, token price routes, vault/earn/protocol USD totals,

    portfolio market values, portfolio USD liquidation/risk fields such as

    `liabilityValueUsd`, `totalCollateralValueUsd`, `borrowLiquidationPriceUsd`,

    and `collateralLiquidationPricesUsd`, and vault holder `assetsUsd`. - Contract-derived oracle and raw account-liquidity verdict values are exact strings. These preserve the integer value used by contracts, normalized to 18 decimals

    for API exposure. Oracle prices are quoted in the vault unit of account, which

    can be USD, ETH, or another asset. This includes `/v3/oracles/prices`, raw

    account-liquidity `liabilityValue` and `totalCollateralValue` objects,

    `liabilityValueBorrowing`, `liabilityValueLiquidation`, and collateral verdict

    values. - On-chain token quantities are bigint strings in their native unit scale. This

    includes amounts, balances, shares, assets, borrows, reward amounts, liquidation

    repay/yield amounts, and block numbers. - Caps are also bigint strings, but EVK caps are exposed as resolved underlying

    asset-unit amounts rather than packed contract config words; an unlimited EVK cap is

    type(uint256).max and `0` is a zero cap. The exceptions are

    cap-history and config-history, which carry the raw uint16 encodings. - LTV config values use canonical basis-point strings. Legacy decimal aliases

    may remain on config-history payloads for compatibility when explicitly named. Rate limiting

    - Optional API keys for higher limits

    - Standard limits are 1000 req/min for unauthenticated callers (IP-based)

    and 10000 req/min for authenticated callers (per API key), with a 60s window. Individual API keys can carry a custom limit. - By default, proxy headers are not trusted for IP identity unless explicitly enabled. - Redis failures default to fail-closed (503) for strict enforcement; fail-open is opt-in. - RateLimit-* (IETF draft-6) and legacy X-RateLimit-* headers are returned.'
servers:
- url: /
  description: Current environment
security: []
tags:
- name: Rewards
  description: Reward campaign APRs and per-account reward breakdowns. Rewards APY is intentionally separate from base vault APY in v3; combine them client-side when you need a legacy-style total supply APY.
paths:
  /v3/apys/rewards:
    get:
      tags:
      - Rewards
      summary: Rewards APYs
      description: 'Reward campaigns per vault: upcoming, active, and ended in the last 30 days.

        A campaign that ended more than 30 days ago is not listed, and a vault whose

        campaigns all ended more than 30 days ago has no row. `totalApr` adds up

        active campaigns only. Past reward rates are in `/v3/apys/rewards/history`.


        Needs the `rewards` chain capability. A `chainId` naming a chain without it answers 404

        `CHAIN_CAPABILITY_DISABLED`; without `chainId`, served chains without it are left out and

        listed in `meta.excludedChains`.'
      x-status: implemented
      x-chain-capability: rewards
      x-cache-ttl: 300
      parameters:
      - $ref: '#/components/parameters/ChainIdParam'
      - name: vault
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Rewards APYs
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RewardsApy'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '404':
          $ref: '#/components/responses/Error404ChainCapability'
      operationId: getApysRewards
  /v3/apys/rewards/history:
    get:
      tags:
      - Rewards
      summary: Rewards APY history
      description: 'Rewards APY history for a required time range.

        Required query params: `chainId`, `from`, `to`.

        Optional filters: `vault`, `resolution`, `offset`, `limit`.

        Maximum allowed window is 30 days per request.


        Needs the `rewards` chain capability; a chain without it answers 404

        `CHAIN_CAPABILITY_DISABLED`.'
      x-status: implemented
      x-chain-capability: rewards
      x-cache-ttl: 300
      parameters:
      - name: chainId
        in: query
        required: true
        schema:
          type: integer
      - name: from
        in: query
        required: true
        schema:
          type: integer
      - name: to
        in: query
        required: true
        schema:
          type: integer
      - name: resolution
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1h
          - 1d
          default: 1d
      - name: vault
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Rewards APY history
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RewardsApyHistoryPoint'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404ChainCapability'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getApysRewardsHistory
  /v3/rewards/breakdown:
    get:
      tags:
      - Rewards
      summary: Per-user reward breakdowns
      description: 'Returns current per-account reward breakdown rows by chain and optional

        vault. Merkl rows are reconciled with direct Merkl user reward data at

        query time when available; fully claimed Merkl rows are omitted, and

        stored Merkl rows older than 24 hours are hidden when live Merkl data

        cannot be read. Chain filters accept at most 12 distinct supported chain

        IDs and normalize duplicates before database and external requests. Each

        account/filter combination is privately cached for five minutes, with a

        stale copy available for up to fifteen additional minutes when the

        handler fails. Responses with a degraded live provider are marked in

        `meta.degradedProviders` and are not cached.


        Needs the `rewards` chain capability. A `chainId` naming a chain without it answers 404

        `CHAIN_CAPABILITY_DISABLED`; without `chainId`, served chains without it are left out and

        listed in `meta.excludedChains`.'
      x-status: implemented
      x-chain-capability: rewards
      x-cache-ttl: 300
      parameters:
      - $ref: '#/components/parameters/RewardsBreakdownChainIdParam'
      - name: account
        in: query
        required: true
        schema:
          type: string
      - name: vault
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Reward breakdowns
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RewardBreakdown'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          description: 'Invalid account, vault, or chain filter. Chain filter failures use

            `INVALID_CHAIN_ID`; malformed values report `details.reason: invalid`,

            while more than 12 distinct IDs report `details.reason: too_many` and

            `details.maxDistinctChainIds: 12`.

            '
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'One or more parsed chain IDs are not in the supported chain registry.

            The response uses `CHAIN_NOT_SUPPORTED` with

            `details.reason: unsupported`. A named chain without rewards answers

            `CHAIN_CAPABILITY_DISABLED` with `details.chainIds` and

            `details.capability: rewards`.

            '
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: getRewardsBreakdown
components:
  schemas:
    RewardsApy:
      type: object
      properties:
        chainId:
          type: integer
        vault:
          type: string
        campaigns:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              provider:
                type: string
              apr:
                type: number
                description: 'Reward APR contribution as a public percent number. For an ended

                  campaign this is the last rate seen while it ran, not a current rate.

                  '
              rewardToken:
                $ref: '#/components/schemas/AssetRef'
              source:
                type: string
                enum:
                - merkl
                - turtle
                - direct
              startTimestamp:
                type: string
                format: date-time
              endTimestamp:
                type: string
                format: date-time
              status:
                type: string
                enum:
                - active
                - upcoming
                - ended
                description: Campaign status. 'active' = ongoing, 'upcoming' = not yet started, 'ended' = past. Ended campaigns are listed for 30 days after their end time.
              campaignType:
                type: string
              collateralAsset:
                type: string
              requiresCb1Verification:
                type: boolean
              merklCampaignId:
                type: string
                description: Original Merkl campaign id when the public campaign is fanned out into vault-level instances.
              opportunityType:
                type: string
                description: Merkl opportunity type that produced this campaign.
              sourceUrl:
                type: string
                format: uri
                description: Exact Merkl campaign page.
              distributionType:
                type: string
                description: Merkl distribution type for the campaign.
              whitelist:
                type: array
                description: Lowercase recipient addresses eligible for whitelist-gated campaigns.
                items:
                  type: string
              blacklist:
                type: array
                description: Lowercase recipient addresses excluded from blacklist-gated campaigns.
                items:
                  type: string
              eligibilityRequirements:
                type: array
                description: Requirements that must be satisfied for the campaign rewards to apply.
                items:
                  type: object
                  required:
                  - type
                  - chainId
                  - tokenAddress
                  - minimumAmount
                  - minimumDurationSeconds
                  properties:
                    type:
                      type: string
                      enum:
                      - token-holding
                    chainId:
                      type: integer
                      minimum: 1
                    tokenAddress:
                      type: string
                    minimumAmount:
                      type: string
                      pattern: ^[1-9][0-9]*$
                      description: Minimum token amount in base units.
                    minimumDurationSeconds:
                      type: integer
                      minimum: 1
                      description: Minimum continuous holding duration in seconds.
                    tokenSymbol:
                      type: string
                    tokenDecimals:
                      type: integer
              eligibilityRequirementsStatus:
                type: string
                enum:
                - none
                - complete
                - incomplete
                description: 'Whether campaign eligibility hooks are absent, fully represented by

                  eligibilityRequirements, or include conditions this API cannot model.

                  This field is always present for Merkl campaigns. Retained legacy Merkl

                  rows without completeness metadata are reported as incomplete. Consumers

                  must direct users to sourceUrl when this value is incomplete.

                  '
        totalApr:
          type: number
          description: Sum of currently active reward APR contributions as a public percent number.
    PaginationMeta:
      type: object
      required:
      - timestamp
      properties:
        total:
          type: integer
          description: Exact total count when the endpoint provides one.
        hasMore:
          type: boolean
          description: Indicates whether another page exists beyond the current page.
        offset:
          type: integer
        limit:
          type: integer
          description: Echoed page size after endpoint-side clamping.
        outcome:
          type: string
          enum:
          - disabled
          - removed
          description: On a toolbox config DELETE, what happened to the row.
        products:
          type: array
          description: 'On a curation vault `POST`, `PUT`, or `PATCH`: the products the write touched (the one the vault left and the one it joined) as they are after the write, `governanceMode` included, so the caller applies them instead of re-reading.'
          items:
            $ref: '#/components/schemas/ProductLabels'
        timestamp:
          type: string
          format: date-time
        chainId:
          type: string
          description: Comma-separated chain IDs for multi-chain responses.
        degradedProviders:
          type: array
          items:
            type: string
          description: Live providers whose data is incomplete in this response.
        excludedChains:
          $ref: '#/components/schemas/ExcludedChains'
    AssetRef:
      type: object
      properties:
        address:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
        name:
          type: string
          nullable: true
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              description: 'Domain error code. Examples:

                - BAD_REQUEST

                - INVALID_ADDRESS

                - INVALID_CHAIN_ID

                - CHAIN_NOT_SUPPORTED

                - CHAIN_CAPABILITY_DISABLED

                - NOT_FOUND

                - VAULT_NOT_FOUND

                - TOKEN_NOT_FOUND

                - ACCOUNT_NOT_FOUND

                - VALIDATION_ERROR

                - CONFLICT

                - PRECONDITION_FAILED

                - PAYLOAD_TOO_LARGE

                - RATE_LIMIT_EXCEEDED

                - UNSUPPORTED_MEDIA_TYPE

                - UPSTREAM_TIMEOUT

                - UNAUTHORIZED

                - FORBIDDEN

                - SERVICE_UNAVAILABLE

                - SERVICE_DISABLED

                - INTERNAL_ERROR

                '
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Context of the error. Where present, `details.reason` is a stable kebab-case value to key on, and `details.cause` narrows a reason that has several causes. The labels routes list theirs in the Labels tag.
    ListingFlag:
      type: boolean
      nullable: true
      description: Curator listing flag. `null` leaves the decision to platform overrides and deprecation, `true` hides the vault(s) from discovery, `false` keeps a deprecated vault listed.
    LabelHoldSummary:
      description: What a draft read shows on a held row.
      type: object
      required:
      - id
      - kind
      - reason
      - since
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - quarantine
          - entity-hold
        reason:
          type: string
        since:
          type: string
          format: date-time
    ExcludedChains:
      type: array
      description: 'On a read across chains that names no `chainId`: the served chains it left out because they do not run the capability the operation needs, rather than reading them as empty. Absent when no chain was left out.'
      items:
        type: object
        required:
        - chainId
        - capability
        properties:
          chainId:
            type: integer
          capability:
            type: string
            enum:
            - indexing
            - activity
            - prices
            - historicalPrices
            - assessments
            - labels
            - logos
            - stats
            - risk
            - rewards
            - apys
    RewardBreakdown:
      type: object
      required:
      - chainId
      - vault
      - recipient
      - rewardToken
      - amount
      - campaignId
      - provider
      - timestamp
      description: 'Per-account reward breakdown row. For Merkl rows, `amount` is reconciled

        against direct Merkl user rewards when that data is available, so fully

        claimed rows are omitted and positive rows use the current claimable

        amount. Merkl reports one claimable amount per campaign; when a campaign

        covers several vaults, that amount is split over the account''s rows for

        the campaign in proportion to their stored amounts, so the rows add up

        to Merkl''s figure. If direct Merkl data is unavailable, stored Merkl rows

        are returned only while their snapshot is 24 hours old or newer.

        '
      properties:
        chainId:
          type: integer
        vault:
          type: string
        recipient:
          type: string
        rewardToken:
          type: string
        rewardTokenMetadata:
          type: object
          nullable: true
          description: Token metadata resolved independently of campaign availability. Null when metadata is unavailable; consumers must not assume 18 decimals.
          properties:
            address:
              type: string
            symbol:
              type: string
            decimals:
              type: integer
            name:
              type: string
        amount:
          type: string
          description: Reward amount as a bigint string in token base units. Merkl amounts follow the reconciliation rules above. Turtle amounts are accumulated rewards, not a verified currently claimable balance.
        campaignId:
          type: string
        provider:
          type: string
          enum:
          - merkl
          - turtle
          description: 'Reward provider that pays this row. Claims go through that

            provider''s distributor: Merkl claims are made per reward token, so

            Merkl''s per-token total and proof decide what an account can claim,

            not a sum of these rows.

            '
        timestamp:
          type: string
          format: date-time
    ProductPlatformListing:
      description: The platform-owned discovery decision on a product, as a product row shows it.
      type: object
      required:
      - notExplorableLend
      - notExplorableBorrow
      - reason
      properties:
        notExplorableLend:
          type: boolean
        notExplorableBorrow:
          type: boolean
        reason:
          type: string
          nullable: true
    ResolvedProductLabels:
      type: object
      readOnly: true
      description: Read-time entity fallbacks for display. Derived, never stored.
      required:
      - entityName
      - url
      - logo
      properties:
        entityName:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          description: Product url, falling back to the owning entity url.
        logo:
          type: string
          nullable: true
          description: Product logo, falling back to the owning entity logo.
    ProductLabels:
      type: object
      required:
      - id
      - chainId
      - entityId
      - coBrandEntityIds
      - name
      - isDeprecated
      - notExplorable
      - governanceMode
      - resolved
      - anyExplorableLend
      - anyExplorableBorrow
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        chainId:
          type: integer
          minimum: 1
        entityId:
          type: string
        coBrandEntityIds:
          type: array
          description: Additional entities whose logos should be displayed. Product management remains exclusively with entityId.
          items:
            type: string
        name:
          type: string
        logo:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
          maxLength: 2048
          pattern: ^[Hh][Tt][Tt][Pp][Ss]://
          description: Absolute https URL.
        portfolioNotice:
          type: string
          nullable: true
        isDeprecated:
          type: boolean
        deprecationReason:
          type: string
          nullable: true
        notExplorable:
          allOf:
          - $ref: '#/components/schemas/ListingFlag'
          description: Product-wide curator listing flag applied to both sides of every member vault unless a vault-level flag overrides it.
        governanceMode:
          type: string
          enum:
          - governed
          - ungoverned
          - unknown
          readOnly: true
          description: Derived by the server from the on-chain governor of member vaults; clients cannot set it. Products are created as `unknown`. Every vault assignment recomputes the mode over the resulting member set and rejects sets that mix governed and ungoverned vaults. Layer 2 adopts `governed` or `ungoverned` for an `unknown` product once its membership verifies against chain state. Entity members cannot update or delete an `ungoverned` product or its vaults after the initial assignment.
        resolved:
          $ref: '#/components/schemas/ResolvedProductLabels'
        anyExplorableLend:
          type: boolean
          readOnly: true
          description: True when at least one member vault is lend-discoverable per the materialized visibility verdicts. Live chain state (e.g. borrowability) is deliberately excluded.
        anyExplorableBorrow:
          type: boolean
          readOnly: true
          description: True when at least one member vault is borrow-discoverable per the materialized visibility verdicts. Live chain state (e.g. borrowability) is deliberately excluded.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        hold:
          type: object
          nullable: true
          description: The hold covering this row on a draft read; absent on published reads.
          allOf:
          - $ref: '#/components/schemas/LabelHoldSummary'
        platformListing:
          type: object
          nullable: true
          description: Euler's listing override on this product, shown to platform sessions on draft reads (null when there is none); absent on published reads and to curators.
          allOf:
          - $ref: '#/components/schemas/ProductPlatformListing'
    RewardsApyHistoryPoint:
      type: object
      properties:
        chainId:
          type: integer
        vault:
          type: string
        rewardsApy:
          type: number
          description: Rewards APY as a public percent number.
        timestamp:
          type: string
          format: date-time
          description: Bucket timestamp as an ISO-8601 UTC string.
  parameters:
    RewardsBreakdownChainIdParam:
      name: chainId
      in: query
      required: false
      schema:
        type: string
        pattern: ^\s*[1-9]\d*\s*(,\s*[1-9]\d*\s*)*$
      description: 'Optional comma-separated chain filter. Every element must be a positive

        safe integer; surrounding whitespace is ignored, and empty elements are

        invalid. Duplicate IDs are accepted, count once toward the fan-out limit,

        and preserve first-occurrence order. At most 12 distinct supported chain

        IDs are allowed. Omitting this parameter leaves the result unrestricted by

        chain.

        '
      example: 1,42161,8453
    OffsetParam:
      name: offset
      in: query
      required: false
      description: Page offset, capped at 10000 to bound query cost.
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    ChainIdParam:
      name: chainId
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated list of positive chain IDs (single value allowed). Duplicate IDs are removed in first-occurrence order; at most 20 distinct IDs and 512 input characters are accepted.
      example: 1,10,8453
    LimitParam:
      name: limit
      in: query
      required: false
      description: Requested page size. Values above the endpoint cap are clamped; the default shared cap is 100.
      schema:
        type: integer
        minimum: 1
        default: 20
        maximum: 100
  headers:
    X-Request-Id:
      description: Request identifier for tracing.
      schema:
        type: string
    Cache-Control:
      description: Cache policy for this response.
      schema:
        type: string
  responses:
    Error400:
      description: Bad request
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error500:
      description: Internal server error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404ChainCapability:
      description: 'Not found, or `CHAIN_CAPABILITY_DISABLED`: a requested chain does not run the capability the operation needs (see `capabilities` on `/v3/chains`), named in `x-chain-capability` or, where it depends on the request, in the parameter. `details.chainIds` lists those chains and `details.capability` names the capability.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CHAIN_CAPABILITY_DISABLED
              message: Chain(s) 137 do not run prices
              requestId: req_example
              details:
                chainIds:
                - 137
                capability: prices
    Error429:
      description: Rate limited
      headers:
        Retry-After:
          description: Seconds until next request is allowed.
          schema:
            type: integer
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
