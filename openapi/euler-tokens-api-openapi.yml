openapi: 3.2.0
info:
  title: Euler Data API (V3) Tokens API
  version: 3.0.0
  description: API specification for Euler Data v3.
servers:
- url: /
  description: Current environment
security: []
tags:
- name: Tokens
  description: Token metadata, protocol classifications, and related static reference data used throughout the API.
paths:
  /v3/tokens:
    get:
      tags:
      - Tokens
      summary: Token list
      x-status: implemented
      x-cache-ttl: 300
      parameters:
      - $ref: '#/components/parameters/ChainIdParam'
      - name: address
        in: query
        required: false
        description: Filter by a token address. May be repeated. Combine with chainId for the fastest lookup path. Counts toward the 100-address filter cap. When address filters are present and limit is omitted, the default limit is the requested address count capped at 100.
        schema:
          type: string
          example: '0x0000000000085d4780B73119b644AE5ecd22b376'
      - name: addresses
        in: query
        required: false
        description: Filter by comma-separated token addresses. May be repeated. Maximum 100 addresses. Combine with chainId for the fastest lookup path. When address filters are present and limit is omitted, the default limit is the requested address count capped at 100.
        schema:
          type: string
          example: 0x0000000000085d4780B73119b644AE5ecd22b376,0x00000000eFE302BEAA2b3e6e1b18d08D69a9012a
      - $ref: '#/components/parameters/FieldsParam'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/TokenLimitParam'
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: 'Filter by token classification. Comma-separated values: base, debt, unitOfAccount, oracleAsset, reward, swapAsset'
        schema:
          type: string
          example: base,debt
      responses:
        '200':
          description: Tokens
          headers:
            Cache-Control:
              $ref: '#/components/headers/Cache-Control'
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              example:
                data:
                - chainId: 1
                  address: '0x000000000085d4780B73119b644AE5ecd22b376'
                  name: TrueUSD
                  symbol: TUSD
                  decimals: 18
                  logoURI: https://token-images.euler.finance/1/0x000000000085d4780B73119b644AE5ecd22b376?v=492516
                  tags:
                  - usd
                meta:
                  total: 1874
                  offset: 0
                  limit: 1
                  timestamp: '2026-03-30T13:04:02.594Z'
                  chainId: '1'
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Token'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
      operationId: getTokens
components:
  schemas:
    Token:
      type: object
      properties:
        chainId:
          type: integer
        address:
          type: string
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: integer
        logoURI:
          type: string
          description: Preferred token image URI. Served from the Euler token image CDN with an hourly cache-busting query param.
        priceUsd:
          type: number
          description: Market USD price number when token list responses include a price.
        metadata:
          $ref: '#/components/schemas/TokenMetadata'
        groups:
          type: array
          items:
            type: string
          description: Asset group associations (e.g., pendle-pt, pendle-lp).
        tags:
          type: array
          items:
            type: string
            enum:
            - usd
            - eth
            - btc
          description: CoinGecko category and symbol-derived correlation tags used by clients for asset-specific processing.
    TokenMetadata:
      type: object
      description: Protocol integration metadata for a token.
      properties:
        isPendlePT:
          type: boolean
        isPendleLP:
          type: boolean
        pendleMarket:
          type: string
          nullable: true
      additionalProperties: true
    PaginationMeta:
      type: object
      required:
      - timestamp
      properties:
        total:
          type: integer
          description: Exact total count when the endpoint provides one.
        hasMore:
          type: boolean
          description: Indicates whether another page exists beyond the current page.
        offset:
          type: integer
        limit:
          type: integer
          description: Echoed page size after endpoint-side clamping.
        timestamp:
          type: string
          format: date-time
        chainId:
          type: string
          description: Comma-separated chain IDs for multi-chain responses.
  headers:
    Cache-Control:
      description: Cache policy for this response.
      schema:
        type: string
    X-Request-Id:
      description: Request identifier for tracing.
      schema:
        type: string
  parameters:
    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
    FieldsParam:
      name: fields
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated list of fields to include.
    TokenLimitParam:
      name: limit
      in: query
      required: false
      description: Requested token page size. Values above 500 are clamped.
      schema:
        type: integer
        default: 20
        maximum: 500
    ChainIdParam:
      name: chainId
      in: query
      required: false
      schema:
        type: string
      description: Comma-separated list of chain IDs (single value allowed).
      example: 1,10,8453
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication (optional; higher rate limits).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Alternative to X-API-Key using Authorization: Bearer <key>'
    AdminSecret:
      type: apiKey
      in: header
      name: X-Admin-Secret
      description: Admin secret (server-to-server) for API key management.
    PlatformSession:
      type: apiKey
      in: cookie
      name: euler_platform_session
      description: Signed, httpOnly platform-operator browser session cookie.
    PlatformCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit CSRF token required for unsafe cookie-authenticated methods.
