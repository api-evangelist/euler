openapi: 3.2.0
info:
  title: Euler Data API (V3) Labels API
  version: 3.0.0
  description: 'API specification for Euler Data v3. This spec defines the current

    resource-oriented contract for the platform, with emphasis on consistent

    schemas, predictable REST semantics, caching, observability, and a uniform

    developer experience. This public document covers unauthenticated endpoints and integrations that

    use API keys, including capability-scoped keys. Browser-session Toolbox

    operations, admin-secret operations, and the Prometheus endpoint are served

    separately and are intentionally omitted. Migration notes

    - Euler Data v3 is not a path-for-path clone of v1/v2. Some endpoints map

    directly, some require multiple v3 calls, and some legacy aggregates were

    intentionally removed. - The live migration guide explains how legacy v1/v2

    endpoints and payloads map into the v3 resource model. - Important semantic changes:

    - Vault base APY and rewards APY are exposed separately in v3. - Account positions are flattened into account-vault rows instead of the

    legacy nested sub-account shape. - All supported API paths live under `/v3`; legacy paths return `410`. - Summary endpoints prefer smaller, focused resources over large

    BFF-style payloads. Base path: /v3


    Conventions

    - JSON field naming: camelCase

    - Addresses: accept lowercase or checksum; responses are EIP-55 checksummed

    - Public APY values (`*Apy`, `apy*`): percent numbers with 6 decimal places (e.g., 5.123456 = 5.123456%)

    - Contract interest-rate fields (`borrowAPY`, `supplyAPY` in `interestRates`): decimal strings in contract fraction units

    - Ratios (utilization, LTV, etc.): numbers with 6 decimal places

    - Response timestamps: ISO-8601 strings (UTC). Some legacy fields still expose unix

    seconds for compatibility and include `*Iso` companions. - Query time ranges: unix seconds (from/to)


    Unit policy

    - v3 separates market metadata from contract verdicts by both name and type. - Market-normalized USD prices and USD values are JSON numbers. These are values

    derived from off-chain pricing, cached price snapshots, or API-level market math. This includes `/v3/prices`, token price routes, vault/earn/protocol USD totals,

    portfolio market values, portfolio USD liquidation/risk fields such as

    `liabilityValueUsd`, `totalCollateralValueUsd`, `borrowLiquidationPriceUsd`,

    and `collateralLiquidationPricesUsd`, and vault holder `assetsUsd`. - Contract-derived oracle and raw account-liquidity verdict values are exact strings. These preserve the integer value used by contracts, normalized to 18 decimals

    for API exposure. Oracle prices are quoted in the vault unit of account, which

    can be USD, ETH, or another asset. This includes `/v3/oracles/prices`, raw

    account-liquidity `liabilityValue` and `totalCollateralValue` objects,

    `liabilityValueBorrowing`, `liabilityValueLiquidation`, and collateral verdict

    values. - On-chain token quantities are bigint strings in their native unit scale. This

    includes amounts, balances, shares, assets, borrows, reward amounts, liquidation

    repay/yield amounts, and block numbers. - Caps are also bigint strings, but EVK caps are exposed as resolved underlying

    asset-unit amounts rather than packed contract config words; an unlimited EVK cap is

    type(uint256).max and `0` is a zero cap. The exceptions are

    cap-history and config-history, which carry the raw uint16 encodings. - LTV config values use canonical basis-point strings. Legacy decimal aliases

    may remain on config-history payloads for compatibility when explicitly named. Rate limiting

    - Optional API keys for higher limits

    - Standard limits are 1000 req/min for unauthenticated callers (IP-based)

    and 10000 req/min for authenticated callers (per API key), with a 60s window. Individual API keys can carry a custom limit. - By default, proxy headers are not trusted for IP identity unless explicitly enabled. - Redis failures default to fail-closed (503) for strict enforcement; fail-open is opt-in. - RateLimit-* (IETF draft-6) and legacy X-RateLimit-* headers are returned.'
servers:
- url: /
  description: Current environment
security: []
tags:
- name: Labels
  description: 'The labeling system behind the Toolbox: entity and product profiles, vault labels, vault assessments, geo policies, and label publishing. The address that governs a vault is its governing address: the governor of an EVK or Securitize vault, the owner of an Earn vault. In this API "controller" always means the EVC controller, the liability vault an account has enabled through the Ethereum Vault Connector, never the address that governs a vault. **Errors on the `/v3/labels` routes.** Key on the status, `error.code` and `error.details.reason`; `error.message` is for people and may change. `details.cause` narrows a reason that has several causes. An error without a reason is the only one its route answers with that status and code. The labels routes never answer `SERVICE_DISABLED`. | Status | Code | `details.reason` | Meaning |

    |---|---|---|---|

    | 401 | UNAUTHORIZED | `invalid-session` | No active session of a kind the route accepts. |

    | 403 | FORBIDDEN | `authorization-denied` | The actor may not make this write. `details.cause`: `platform-admin-denied`, `missing-csrf` or `csrf-mismatch` on platform-only routes; `wrong-entity`, `insufficient-role`, `unsupported-actor`, `inactive-actor`, `malformed-actor` or `missing-actor` on entity, member, address, product and vault writes. |

    | 403 | FORBIDDEN | `missing-csrf`, `csrf-mismatch` | Entity-or-platform route, unsafe method: the CSRF header is missing or does not match. While a session changes under the request the reason can also be `missing-session`, `invalid-session`, `expired-session`, `entity-member-denied`, `entity-auth-disabled` or `platform-admin-denied`. |

    | 403 | FORBIDDEN | `entity-suspended` | The member''s entity is suspended by the platform. |

    | 403 | FORBIDDEN | `entity-admin-required` | The route needs an entity admin; the session is an editor. |

    | 403 | FORBIDDEN | `entity-scope-denied` | A draft read of another entity''s rows. |

    | 403 | FORBIDDEN | `self-demotion-denied`, `self-revoke-denied` | An entity admin demoting or revoking their own membership. |

    | 403 | FORBIDDEN | `published-row` | An entity member deleting a product the public has seen. |

    | 403 | FORBIDDEN | `ungoverned-locked` | An ungoverned vault or product is write-once for entity members. |

    | 403 | FORBIDDEN | `ownership-denied` | No entity address governs the vault; on a product, `details.addresses` lists the vaults the entity no longer governs. |

    | 403 | FORBIDDEN | `vault-not-claimable` | An escrow vault, or a vault type an entity cannot claim. |

    | 403 | FORBIDDEN | `no-governing-address` | The vault has no governor or owner on chain (`details.role`); only Euler can assign it. |

    | 403 | FORBIDDEN | `capability-denied`, `api-key-read-only`, `platform-session-required` | An API key without the capability, a key on a write a read grant cannot make, or an action only a platform session may take. |

    | 404 | NOT_FOUND | `unknown-vault` | The vault is not in indexed factory discovery. |

    | 404 | NOT_FOUND | `label-set-not-found`, `label-version-not-found`, `hold-not-found`, `resource-not-found` | Label set, version, hold and quarantine routes. |

    | 404 | NOT_FOUND | none | The entity, member, address, product, vault labels or listing override does not exist. On the label reads, a 404 with `details.labelSet` and `details.version` means the label set or version could not be resolved; only that 404 carries `details.labelSet`. |

    | 404 | CHAIN_NOT_SUPPORTED | none | A product or vault delete or transfer on a chain the deployment does not serve. |

    | 404 | CHAIN_CAPABILITY_DISABLED | none | A product or vault delete or transfer, or a listing override, on a served chain without labels; `details.chainIds` and `details.capability: labels`. A write naming such a chain in its body or path answers 422 naming `chainId`. |

    | 409 | CONFLICT | `duplicate` | The entity, address, product or vault labels already exist.'
paths:
  /v3/labels/sets:
    get:
      tags:
      - Labels
      summary: List label sets
      description: Returns the available label-set channels and their metadata.
      x-status: implemented
      security: []
      responses:
        '200':
          description: Label-set list.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LabelSet'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: listLabelSets
  /v3/labels/sets/{labelSetId}/versions:
    get:
      tags:
      - Labels
      summary: List published label versions
      description: 'Returns published snapshots for the label set. Draft rows are never

        included, and this metadata read does not require a platform session.'
      x-status: implemented
      security: []
      parameters:
      - $ref: '#/components/parameters/LabelSetIdPath'
      responses:
        '200':
          description: Published label versions.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LabelVersion'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: listPublishedLabelVersions
    post:
      tags:
      - Labels
      summary: Publish current labels
      description: 'Publishes an immutable snapshot of entity, product, and vault-label content.

        Geo policies remain live and are not included. The snapshot builder decides

        per row where the content comes from: a full publish takes every draft row

        that no hold covers and keeps held rows at their published content; a

        partial publish (`selection` in the body, platform session only) takes the

        selected rows and whatever they need for a consistent version, overriding

        holds for those rows, and keeps everything else as published. Left-out

        changes stay pending for the timer. A draft vault row with no labels (the

        row discovery materialises for every vault it finds, a claim cleared) is not

        label content: no publication takes it, a selection naming one is a no-op,

        and the `report.leftOut` says how many such rows the draft holds and which

        the selection named. The `report` also lists what went live, what

        was pulled in, what a hold kept back and why, and which holds were

        overridden. `?dryRun=true` returns the report without writing anything.

        When the built content matches the latest published version, the endpoint

        returns that version with `publishOutcome: unchanged` and does not create a

        release. Accepts a platform session or an API key holding the

        `labels:publish` capability; a key may only publish in full. The version

        records which kind of actor published it, and every publication is audited.

        To publish exactly what a dry run showed, send its `draftToken` as

        `expectedDraftToken`: if the draft, the latest version or the holds a partial

        publish would override moved since, the answer is 412 with `details.reason`

        `draft-changed` and the current `details.draftToken`, and nothing is written.

        Without the field, the publish takes the draft as it is at that moment; it

        will become required for keys, and a key publish without it is logged.'
      x-status: implemented
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/LabelSetIdPath'
      - name: dryRun
        in: query
        required: false
        description: Build the version and return the report without publishing.
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                versionKey:
                  type: string
                aliases:
                  type: array
                  items:
                    type: string
                sourceRepo:
                  type: string
                  nullable: true
                sourceRef:
                  type: string
                  nullable: true
                sourceSha:
                  type: string
                  nullable: true
                schemaAdapter:
                  type: string
                selection:
                  $ref: '#/components/schemas/LabelRowSelection'
                expectedDraftToken:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                  description: The `draftToken` of the dry run this publish confirms. Ignored on a dry run. Optional for now; keys will have to send it.
      responses:
        '200':
          description: Publishable label content is unchanged and the latest version is returned, or the request was a dry run and only the report is returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    oneOf:
                    - $ref: '#/components/schemas/LabelPublishResult'
                    - $ref: '#/components/schemas/LabelPublishDryRunResult'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '201':
          description: Published label snapshot created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/LabelPublishResult'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          description: '`expectedDraftToken` no longer matches: what this publish would write moved since the dry run. `details.reason` is `draft-changed` and `details.draftToken` is the current token. Nothing was written; preview again before publishing.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: publishLabelVersion
  /v3/labels/sets/{labelSetId}/publication:
    get:
      tags:
      - Labels
      summary: Read publication state
      description: 'Returns whether automatic publication is suspended, the deployment

        override, the configured delays, the pending schedule, and the latest

        published version with its publisher. Accepts a platform session or a

        API key holding any `labels:*` capability; actor identities

        are returned to platform sessions only. Responses are private and never

        cached.'
      x-status: implemented
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/LabelSetIdPath'
      responses:
        '200':
          description: Publication state.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/LabelPublicationState'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getLabelPublicationState
  /v3/labels/sets/{labelSetId}/publication/summary:
    get:
      tags:
      - Labels
      summary: Read the publication summary
      description: 'The part of the publication state a curator surface needs to say when

        a draft change goes live: the publication mode, whether automatic

        publication is suspended, the pending due time, and the latest

        published version. Carries no reason, no actor, and no revision, so it

        is readable with an entity session or without one. In `manual` mode

        `dueAt` is always null: changes go live when the platform publishes.

        Responses are private and never cached.'
      x-status: implemented
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/LabelSetIdPath'
      responses:
        '200':
          description: Publication summary.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/LabelPublicationSummary'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: getLabelPublicationSummary
  /v3/labels/sets/{labelSetId}/publication/versions:
    get:
      tags:
      - Labels
      summary: List published label versions with attribution
      description: 'The platform-side version history: every published version with its

        creator and publisher. Identities are returned to platform sessions;

        an API key holding any `labels:*` capability sees the

        publisher kind only. Responses are private and never cached.'
      x-status: implemented
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/LabelSetIdPath'
      responses:
        '200':
          description: Attributed published label versions.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttributedLabelVersion'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: listAttributedLabelVersions
  /v3/labels/sets/{labelSetId}/publication/suspend:
    post:
      tags:
      - Labels
      summary: Suspend automatic publication
      description: 'Stops the timer from publishing the draft until publication is resumed.

        Explicit publication keeps working. The reason is required and recorded

        with the actor in the publication audit. Accepts a platform session or a

        API key holding `labels:publication-control`.'
      x-status: implemented
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/LabelSetIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Suspended, or already suspended, in which case controlOutcome is unchanged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/LabelPublicationControlResult'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      operationId: suspendLabelPublication
  /v3/labels/sets/{labelSetId}/publication/resume:
    post:
      tags:
      - Labels
      summary: Resume automatic publication
      description: 'Lifts a platform suspension. The deployment override, when set, keeps

        the timer frozen regardless. Accepts a platform session or an

        API key holding `labels:publication-control`.'
      x-status: implemented
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/LabelSetIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        '200':
          description: Resumed, or not suspended, in which case controlOutcome is unchanged.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/LabelPublicationControlResult'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      operationId: resumeLabelPublication
  /v3/labels/sets/{labelSetId}/holds:
    get:
      tags:
      - Labels
      summary: List active holds
      description: 'Every unreleased hold: quarantines raised by the reviewer and entity holds

        raised by entity suspension. Accepts a platform session or a key with

        `labels:reject` or `labels:draft-read`. Actor identities are returned to

        platform sessions only. Only the `public` label set has holds.'
      x-status: implemented
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/LabelSetIdPath'
      responses:
        '200':
          description: Active holds.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LabelHold'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      operationId: listLabelHolds
    post:
      tags:
      - Labels
      summary: Quarantine a row
      description: 'Rejects one entity, product, or vault-label row: the curator''s draft stays

        intact, the row keeps its published content on every full publish, and the

        hash of the draft content at the time is recorded so a later edit is

        detectable. The row must exist in the draft or in the latest published

        version. Accepts a platform session or a key with `labels:reject`. One

        active quarantine per row; a repeat answers 409 with the existing hold.

        Send `expectedContentHash` to hold only the revision that was reviewed: a

        draft that moved since answers 412 `stale-review` and writes no hold and no

        event. It will become required for keys.'
      x-status: implemented
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/LabelSetIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelQuarantineRequest'
      responses:
        '201':
          description: Hold created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/LabelHold'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      operationId: quarantineLabelRow
  /v3/labels/sets/{labelSetId}/holds/{holdId}:
    delete:
      tags:
      - Labels
      summary: Release a quarantine
      description: 'Releases one quarantine so the next full publish takes the row''s draft.

        Accepts a platform session or a key with `labels:reject`. Entity holds are

        released by resuming the entity and answer 409 here. `expectedContentHash`

        releases only the revision that was reviewed; a draft that moved since

        answers 412 `stale-review` and nothing is released. It will become required

        for keys.'
      x-status: implemented
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/LabelSetIdPath'
      - name: holdId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: expectedContentHash
        in: query
        required: false
        description: 'The held row''s draft revision the reviewer judged, the change log''s `afterContentHash`. To name a row the draft no longer has, use POST `…/release` with `expectedContentHash: null`.'
        schema:
          type: string
