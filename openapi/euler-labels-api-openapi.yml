    LabelPublicationState:
      type: object
      required:
      - labelSetId
      - mode
      - suspended
      - suspendedAt
      - suspendedBy
      - suspensionReason
      - frozenByEnvironment
      - effectiveFrozen
      - minDelaySeconds
      - maxDelaySeconds
      - dueAt
      - windowStartedAt
      - revision
      - latestVersion
      properties:
        labelSetId:
          type: string
        mode:
          type: string
          enum:
          - manual
          - scheduled
          description: 'How changes go live. `manual` (the rollout default): only an explicit publish by a platform session or a key with `labels:publish` creates a version; no publication window opens and `dueAt` stays null (a CHECK enforces it). `scheduled`: label writes open a window and the worker publishes after the cooldown. Changed in the database only; every mode change resets the schedule, so a switch to `scheduled` opens nothing until the next label write, and a switch to `manual` disarms an open window.'
        suspended:
          type: boolean
          description: A platform actor has suspended automatic publication (relevant in `scheduled` mode). Explicit publication still works.
        suspendedAt:
          type: string
          format: date-time
          nullable: true
        suspendedBy:
          type: object
          nullable: true
          required:
          - kind
          - id
          properties:
            kind:
              type: string
              enum:
              - platform-admin
              - api-key
            id:
              type: string
              nullable: true
              description: Present for platform sessions; API keys see the kind only.
        suspensionReason:
          type: string
          nullable: true
        frozenByEnvironment:
          type: boolean
          description: The deployment override (`LABEL_PUBLICATION_FROZEN`) is set. Lifting it is a deploy, not an API call.
        effectiveFrozen:
          type: boolean
          description: True when either the suspension or the environment override stops the timer. In `manual` mode there is no timer; explicit publication is unaffected either way.
        minDelaySeconds:
          type: integer
          description: Cooldown after the last label change before the timer publishes. At least 60.
        maxDelaySeconds:
          type: integer
          description: Cap from the first unpublished change; the timer publishes at the latest here. At most 86400.
        dueAt:
          type: string
          format: date-time
          nullable: true
          description: When the pending draft is due, or null when nothing is pending or the mode is `manual`.
        windowStartedAt:
          type: string
          format: date-time
          nullable: true
        revision:
          type: string
          description: Identifies the pending mutations; increments with every scheduled label write.
        latestVersion:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AttributedLabelVersion'
    ProductPlatformListing:
      description: The platform-owned discovery decision on a product, as a product row shows it.
      type: object
      required:
      - notExplorableLend
      - notExplorableBorrow
      - reason
      properties:
        notExplorableLend:
          type: boolean
        notExplorableBorrow:
          type: boolean
        reason:
          type: string
          nullable: true
    LabelReleaseRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 500
          description: Why the hold is released or the entity resumed. Trimmed; blank or null records no reason.
        expectedContentHash:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{64}$
          description: 'The draft revision the reviewer judged: the change log''s `afterContentHash` for the row (null for a row the draft no longer has). Compared with the current draft row inside the write''s transaction; when the row moved since, the answer is 412 with `details.reason` `stale-review` and the current `details.contentHash`, and nothing is written. Optional for now; keys will have to send it, and a key write without it is logged.'
    LabelVersion:
      type: object
      required:
      - id
      - labelSetId
      - versionKey
      - status
      - aliases
      - isLatest
      - sourceRepo
      - sourceRef
      - sourceSha
      - schemaAdapter
      - checksum
      - publishedByKind
      - createdAt
      - publishedAt
      properties:
        id:
          type: string
          format: uuid
        labelSetId:
          type: string
        versionKey:
          type: string
        status:
          type: string
          enum:
          - draft
          - published
          - archived
        aliases:
          type: array
          description: 'Named selectors for this version. `latest` is carried by exactly one published version per label set, the one `isLatest` marks: a publish hands it over from the previous version in the same transaction.'
          items:
            type: string
        isLatest:
          type: boolean
        sourceRepo:
          type: string
          nullable: true
        sourceRef:
          type: string
          nullable: true
        sourceSha:
          type: string
          nullable: true
        schemaAdapter:
          type: string
        checksum:
          type: string
          nullable: true
          description: SHA-256 checksum of canonical entity, product, and vault-label content, the server-derived `isEscrow` flag of a vault included. Audit timestamps and geo policies are excluded.
        publishedByKind:
          type: string
          enum:
          - platform-admin
          - worker
          - api-key
          nullable: true
          description: Who created the version. The publisher's identity is platform-only and appears on the publication state route.
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
    VaultAssessmentPreviewEarn:
      allOf:
      - $ref: '#/components/schemas/VaultAssessmentPreviewBase'
      - type: object
        required:
