          findings:
            type: array
            items:
              allOf:
              - $ref: '#/components/schemas/VaultConfigFinding'
              - type: object
                properties:
                  key:
                    type: string
                    x-finding-keys:
                    - governance.timelock
                    - evidence.guardian
                    - evidence.multisig
                    - evidence.fee
                    - evidence.queues
                    - evidence.escrow-sink
                    - evidence.pending-activity
                    - evidence.scheduled-changes
                    - evidence.asset
                    x-finding-key-namespaces:
                    - pattern: strategy.<address>.<rule>
                      policies:
                      - euler-earn
                      rules:
                      - recognized
                    - pattern: scheduled.<rule>
                      policies:
                      - euler-earn
                      rules:
                      - strategy.<address>.recognized
                      - governance.timelock
          appliedOverrides:
            type: array
            maxItems: 0
            items:
              type: string
            description: Always empty; this vault kind accepts no overrides.
          notSimulated:
            type: array
            maxItems: 0
            items:
              type: string
            description: Always empty; nothing is simulated for this vault kind.
    VaultConsistencyContext:
      type: object
      nullable: true
      description: 'The findings behind a Layer 2 verdict, for the policies that grade more than ownership. An Earn vault''s: whether each strategy it can hold funds in (a cap or a withdraw-queue slot) and each active collateral of those strategies is escrow or shown (claimed, assigned to a product, not suspended in its own Layer 2 check, and passing Layer 1 when the vault''s entity claims it), gating always for the vault entity''s own and, for another curator''s, only until acceptable after the curator''s latest cap increase; a deprecated one only warns. And whether its owner, unless renounced, and its curator, when one is set, are addresses an entity registers. Null for every other vault, and for an Earn vault suspended on ownership whose Earn state could not be read; replaced by each completed Layer 2 check. The first required failure is `consistencyReason`; a failed advisory badges the vault `warning`.'
      required:
      - policyId
      - policyVersion
      - outcome
      - evaluatedAt
      - blockNumber
      - findings
      properties:
        policyId:
          type: string
          enum:
          - euler-earn-consistency
        policyVersion:
          type: integer
        outcome:
          type: string
          enum:
          - pass
          - fail
          - unknown
          - not_applicable
        evaluatedAt:
          type: string
          format: date-time
        blockNumber:
          type: string
          nullable: true
        findings:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/VaultConfigFinding'
            - type: object
              properties:
                key:
                  type: string
                  x-finding-keys:
                  - governance.owner-registered
                  - governance.curator-registered
                  x-finding-key-namespaces:
                  - pattern: strategy.<address>.<rule>
                    policies:
                    - euler-earn-consistency
                    rules:
                    - visible
                    description: One per strategy in scope; <address> is the lowercase strategy vault address. `observed.link` is `{ phase, committedAtBlock, committedAtLogIndex, acceptedAt }`. `own` (claimed by the vault's entity) and `admission` (not acceptable since the curator's latest cap increase) gate; `accepted`, `drift` (failing after acceptance, or a collateral activated after the increase) and `uncapped` (cap zero) do not.
                  - pattern: collateral.<address>.<rule>
                    policies:
                    - euler-earn-consistency
                    rules:
                    - visible
                    description: One per active collateral of those strategies; <address> is the lowercase collateral vault address.
                  - pattern: scheduled.<rule>
                    policies:
                    - euler-earn-consistency
                    rules:
                    - strategy.<address>.visible
                    - collateral.<address>.visible
                    - governance.owner-registered
                    description: A pending change graded by the rule it will face once accepted, a strategy a pending cap adds, a collateral it brings, or an owner transfer awaiting acceptance. Never required, so outside `outcome`, `consistencyStatus` and visibility. `observed` is `{ pending, validAt, submittedAtBlock }`; `validAt` is null for an owner transfer.
    VaultAssessmentPreviewBase:
      description: The fields every preview answers, whatever the vault kind.
      type: object
      required:
      - chainId
      - vaultAddress
      - persisted
      - family
      - policyId
      - policyVersion
      - blockNumber
      - blockHash
      - evaluatedAt
      - currentConfigStatus
      - configStatusIfApplied
      - outcome
      - localOutcome
      - checksStatus
      - summary
      - findings
      - changed
      - appliedOverrides
      - notSimulated
      properties:
        chainId:
          type: integer
          minimum: 1
        vaultAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        persisted:
          type: boolean
          enum:
          - false
        family:
          type: string
          enum:
          - evk
          - earn
          - securitize
        policyId:
          type: string
          enum:
          - euler-evk
          - euler-securitize
          - euler-earn
        policyVersion:
          type: integer
          minimum: 1
        blockNumber:
          type: string
          pattern: ^\d+$
        blockHash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
        evaluatedAt:
          type: string
          format: date-time
        currentConfigStatus:
          type: string
          enum:
          - unverified
          - pending
          - verified
          - suspended
          - revoked
          description: The stored Layer 1 status, `unverified` when nothing is stored yet.
        configStatusIfApplied:
          type: string
          enum:
          - unverified
          - pending
          - verified
          - suspended
          - revoked
          description: The status the stored check would write from `currentConfigStatus` and the previewed outcome.
        outcome:
          type: string
          enum:
          - pass
          - fail
          - unknown
          - not_applicable
        localOutcome:
          type: string
          enum:
          - pass
          - fail
          - unknown
          - not_applicable
        checksStatus:
          type: string
          enum:
          - positive
          - warning
          - negative
          nullable: true
          description: What the advisory findings would say if this configuration were applied. Same axis as `checksStatus` on the stored assessment.
        summary:
          type: object
          required:
          - passed
          - failed
          - unknown
          - notApplicable
          properties:
            passed:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
            unknown:
              type: integer
              minimum: 0
            notApplicable:
              type: integer
              minimum: 0
        findings:
          type: array
          items:
            $ref: '#/components/schemas/VaultConfigFinding'
        changed:
          type: array
          description: Findings whose verdict differs from the stored assessment, added and removed ones included.
          items:
            $ref: '#/components/schemas/VaultAssessmentFindingChange'
        appliedOverrides:
          type: array
          items:
            type: string
          description: One line per override applied, in the order applied.
        notSimulated:
          type: array
          items:
            type: string
          description: 'Finding keys left unknown because their simulation could not run: a quote the probe could not reach, or `oracle.adapters-recognized` when the evaluate-only check refused a proposed adapter. Each finding names the reason in `observed`; the list is empty when every change the batch makes was simulated.'
