      responses:
        '200':
          description: The preview; `persisted` is always false.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/VaultAssessmentPreview'
        '400':
          description: Malformed JSON, or an invalid address in the path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          description: A key without `assessments:evaluate`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The chain is not served (`CHAIN_NOT_SUPPORTED`), the chain does not run assessments (`CHAIN_CAPABILITY_DISABLED`), or no Layer 1 policy family matches the vault (`VAULT_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          description: The body fails validation (`error.details.issues`), or overrides were sent for a vault outside the EVK family (`error.details.family`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The vault was previewed more than 6 times in the last minute; `Retry-After` says when to retry.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '504':
          description: The on-chain reads did not finish within the 12-second budget (`UPSTREAM_TIMEOUT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: previewEarnVaultAssessment
  /v3/earn/vaults/{chainId}/{address}/assessment:
    get:
      tags:
      - Labels
      summary: Get Earn vault assessment
      x-status: implemented
      x-chain-capability: assessments
      description: 'The stored assessment, or default unevaluated statuses when this deployment serves the

        chain and the vault has genuinely never been checked. A chain the deployment does not

        serve answers `404 CHAIN_NOT_SUPPORTED` instead, so "never assessed" is never reported

        for a vault Euler could not have assessed; an archived metadata-only chain is unserved

        too but carries imported rows, and those are still answered.


        A served chain without the `assessments` chain capability answers 404

        `CHAIN_CAPABILITY_DISABLED`.'
      parameters:
      - $ref: '#/components/parameters/ChainIdPath'
      - $ref: '#/components/parameters/AddressPath'
      responses:
        '200':
          description: Vault assessment or default unevaluated statuses.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/AssessmentETag'
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    $ref: '#/components/schemas/VaultAssessment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404ChainCapability'
      operationId: getEarnVaultAssessment
components:
  schemas:
    ResolvedVaultLabels:
      type: object
      readOnly: true
      description: Read-time display cascade (vault label, else product, else indexed on-chain identity; escrow vaults get a fixed name). Raw fields stay authoritative for editing — this block is derived and never stored.
      required:
      - name
      - description
      - portfolioNotice
      - deprecated
      - deprecationReason
      - entityId
      - url
      - logo
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        portfolioNotice:
          type: string
          nullable: true
        deprecated:
          type: boolean
          description: Vault or product deprecation.
        deprecationReason:
          type: string
          nullable: true
          description: Reason from the nearest actively deprecated source; null when nothing is deprecated. Retained reasons on non-deprecated rows never contribute.
        entityId:
          type: string
          nullable: true
          description: Vault entity, inherited from the product when unset.
        url:
          type: string
          nullable: true
          description: Product url, falling back to the entity url.
        logo:
          type: string
          nullable: true
          description: Product logo, falling back to the entity logo.
    VaultVisibilitySummary:
      type: object
      description: 'Platform visibility verdict for discovery surfaces. Warning stays discoverable with a badge; the per-surface booleans carve out lend/borrow discovery individually. A side is explorable when `status` is `visible` or `warning` and nothing hides that side: a platform override, the escrow rule, a curator listing flag on the vault or its product, or deprecation (which hides by default unless a curator re-lists with a `false` flag). An escrow vault (`isEscrow: true`) is never explorable for lending, because nothing can be borrowed from it and a deposit earns nothing; it stays explorable for borrowing, so a market that accepts it as collateral keeps it in its pairs. Its `status` is unaffected.'
      required:
      - status
      - explorableLend
      - explorableBorrow
      - decidedBy
      - reason
      properties:
        status:
          type: string
          enum:
          - visible
          - warning
          - hidden
          - pending_review
        explorableLend:
          type: boolean
        explorableBorrow:
          type: boolean
        explorableLendDecidedBy:
          $ref: '#/components/schemas/VaultListingDecidedBy'
        explorableBorrowDecidedBy:
          $ref: '#/components/schemas/VaultListingDecidedBy'
        decidedBy:
          type: string
          description: Which resolution rule decided the status. `config-*` codes come from Layer 1 (configuration safety), `consistency-*` codes from Layer 2 (label consistency). `unclaimed` and `unassigned` are label gates. A verified or unassessable non-escrow vault stays in `pending_review` until an entity claims it, and EVK and Securitize vaults additionally require assignment to a product. Escrow vaults bypass both label gates. `advisories` badges a vault that passed both layers but has a failed advisory finding — it stays in discovery, with `checksStatus` on its assessment naming a Layer 1 concern and `consistencyContext` a Layer 2 one (an Earn vault's deprecated dependency); an advisory that could not be judged does not badge.
          enum:
          - config-revoked
          - consistency-revoked
          - config-suspended
          - consistency-suspended
          - config-failed
          - not-explorable
          - unassessable
          - deprecated
          - advisories
          - unclaimed
          - unassigned
          - verified
          - awaiting-verification
        reason:
          type: string
          nullable: true
          description: 'Display-appropriate explanation for the decision, when there is one: the curated deprecation reason, the failing check''s sentence, or, for `advisories`, the sentence of the first failed advisory (Layer 1 before Layer 2, each by finding key) followed by a count of the rest, e.g. "… (2 more checks flagged)". Null for a deprecated vault whose curator gave no reason, and whenever nothing needs explaining.'
    PaginationMeta:
      type: object
      required:
      - timestamp
      properties:
        total:
          type: integer
          description: Exact total count when the endpoint provides one.
        hasMore:
          type: boolean
          description: Indicates whether another page exists beyond the current page.
        offset:
          type: integer
        limit:
          type: integer
          description: Echoed page size after endpoint-side clamping.
        outcome:
          type: string
          enum:
          - disabled
          - removed
          description: On a toolbox config DELETE, what happened to the row.
        products:
          type: array
          description: 'On a curation vault `POST`, `PUT`, or `PATCH`: the products the write touched (the one the vault left and the one it joined) as they are after the write, `governanceMode` included, so the caller applies them instead of re-reading.'
          items:
            $ref: '#/components/schemas/ProductLabels'
        timestamp:
          type: string
          format: date-time
        chainId:
          type: string
          description: Comma-separated chain IDs for multi-chain responses.
        degradedProviders:
          type: array
          items:
            type: string
          description: Live providers whose data is incomplete in this response.
        excludedChains:
          $ref: '#/components/schemas/ExcludedChains'
    VaultConfigAssessmentContext:
      type: object
      nullable: true
      required:
      - policyId
      - policyVersion
      - outcome
      - localOutcome
      - checksStatus
      - evaluatedAt
      - blockNumber
      - blockHash
      - findings
      - summary
      properties:
        policyId:
          type: string
          enum:
          - euler-evk
          - euler-securitize
          - euler-earn
        policyVersion:
          type: integer
          minimum: 1
        outcome:
          type: string
          enum:
          - pass
          - fail
          - unknown
          - not_applicable
        localOutcome:
          type: string
          description: Verdict excluding collateral-recognition findings; used for cycle-safe recognition.
          enum:
          - pass
          - fail
          - unknown
          - not_applicable
        checksStatus:
          type: string
          enum:
          - positive
          - warning
          - negative
          nullable: true
          description: 'Health of the advisory findings, orthogonal to the gating verdict in `configStatus`: the rules that disclose a curator''s judgment call rather than suspend a vault. Null when the policy emitted no advisory finding. Same axis and vocabulary as an oracle adapter''s `checksStatus`; a vault advisory never condemns, so this does not reach `negative`.'
        evaluatedAt:
          type: string
          format: date-time
        blockNumber:
          type: string
          pattern: ^\d+$
        blockHash:
          type: string
          pattern: ^0x[a-fA-F0-9]{64}$
        findings:
          type: array
          items:
            type: object
            required:
            - key
            - outcome
            - required
            - description
            properties:
              key:
                type: string
                description: 'Stable rule key. Static keys are listed in `x-finding-keys`; the templated namespaces are described in `x-finding-key-namespaces`. `evidence.*` keys are observations that never gate the verdict, but they are not the only non-gating findings: read `required` for that (`irm.max-apy` is advisory). A `scheduled.` key grades a pending timelocked change and never counts toward the verdict, `checksStatus`, `summary` or visibility. A required key ending in `.recognized` is a cross-entity recognition rule excluded from `localOutcome`. Keys are never renamed, only added.'
                x-finding-keys:
                - compliance.ds-token-wiring
                - configuration.evc-compatible-asset
                - configuration.lens-readable
                - deployment.no-evault-nesting
                - deployment.recognized-factory
                - evidence.asset
                - evidence.caps
                - evidence.controller-perspective
                - evidence.debt-socialization
                - evidence.escrow-sink
                - evidence.fee
                - evidence.fee-receiver
                - evidence.freeze-activity
                - evidence.governance
                - evidence.guardian
                - evidence.inert-collateral-entries
                - evidence.interest-fee
                - evidence.interest-rate-model
                - evidence.liability-price
                - evidence.multisig
                - evidence.pending-activity
                - evidence.pyth-recovery-issues
                - evidence.pyth-unserved-feeds
                - evidence.queues
                - evidence.resolved-vaults
                - evidence.route-adapters
                - evidence.scheduled-changes
                - evidence.seize-activity
                - evidence.supply-cap
                - evidence.unit-of-account
                - evidence.upgradeable
                - evidence.vault-mode
                - governance.router
                - governance.timelock
                - hooks.zero-or-trusted
                - irm.max-apy
                - irm.rate-computation
                - liquidation.cool-off
                - liquidation.max-discount
                - market.interest-rate-model-present
                - market.oracle-present
                - market.unit-of-account-present
                - operations.not-paused
                - oracle.adapters-checks
                - oracle.adapters-recognized
                - oracle.liability-quote
                - oracle.liability-route
                - oracle.no-fallback
                - oracle.recognized-router
                x-finding-key-namespaces:
                - pattern: collateral.<address>.<rule>
                  policies:
                  - euler-evk
                  rules:
                  - ltv
                  - route
                  - recognized
                  - ramp
                  - price
                  - quote
                  description: One group per active collateral of an EVK market vault; <address> is the lowercase collateral vault address. `recognized` reads the collateral's `localOutcome`.
                - pattern: strategy.<address>.<rule>
                  policies:
                  - euler-earn
                  rules:
                  - recognized
                  description: One group per active strategy of an Earn vault; <address> is the lowercase strategy vault address. `recognized` reads the strategy's full `outcome`, or its `localOutcome` when the strategy is itself an Earn vault. It is required until the strategy has passed after the curator's latest cap increase and advisory after, or while the vault caps it at zero; `observed.link` is `{ phase, committedAtBlock, committedAtLogIndex, acceptedAt }`.
                - pattern: scheduled.<rule>
                  policies:
                  - euler-earn
                  rules:
                  - strategy.<address>.recognized
                  - governance.timelock
                  description: A timelocked change submitted on an Earn vault and not yet live, graded by the rule it will face once accepted, a strategy a pending cap adds or a pending timelock decrease. Never required, and outside `outcome`, `checksStatus`, `summary` and visibility. `observed` is `{ pending, validAt, submittedAtBlock }`, `pending` holding what the live rule would observe; a cause's summary starts with when the change can be accepted.
              outcome:
                type: string
                enum:
                - pass
                - fail
                - unknown
                - not_applicable
              required:
                type: boolean
                description: Whether the finding gates the verdict. Required findings reduce into `outcome` and `localOutcome`; an advisory finding carries a real `pass`, `fail` or `unknown` outcome for the reader but never suspends the vault.
              description:
                type: string
              expected: {}
              observed: {}
              cause:
                type: object
                description: 'Why this is not a pass. On `fail` and `unknown` it is the failure; on `not_applicable` it is why the rule did not run, and its absence on an `evidence.*` row is what separates a skipped check from an observation. The rule key alone cannot say: `hooks.zero-or-trusted` fails either because the hook target is untrusted or because a zero target disabled an exit operation, and those have opposite remedies. Switch on `code`; `subject` is the value to act on; `summary` is one sentence naming it, and is what `configReason` carries for the blocking finding.'
                required:
                - code
                - subject
                - summary
                - remedy
                properties:
                  code:
                    type: string
                    enum:
                    - deposit-only-vault
                    - feed-revert-tolerated
                    - curator-unset
                    - owner-renounced
                    - vault-lens-reverted
                    - not-a-recognized-evault
                    - deployment-record-unavailable
                    - liability-asset-is-evault
                    - evc-compatible-asset-flag-set
                    - hook-target-untrusted
                    - exit-operations-disabled
                    - oracle-unset
                    - unit-of-account-unset
                    - interest-rate-model-unset
                    - router-not-recognized
                    - router-has-fallback
                    - router-config-unreadable
                    - route-has-no-unit-of-account-adapter
                    - collateral-route-skips-evault-asset
                    - quote-reverted
                    - quote-returned-zero
                    - pyth-feed-discontinued
                    - pyth-update-unconfirmed
                    - pyth-feed-unattributed
                    - pyth-receiver-incompatible
                    - session-feed-tolerance-withdrawn
                    - quote-unavailable
                    - interest-rate-model-reverts
                    - interest-rate-model-not-probed
                    - borrow-apy-above-bound
                    - router-governor-outside-entity
                    - timelock-too-short
                    - liquidation-discount-out-of-range
                    - liquidation-cool-off-out-of-range
                    - collateral-ltv-out-of-range
                    - dependency-not-verified
                    - dependency-not-assessed
                    - route-adapter-unrecognized
                    - route-adapter-unassessed
                    - route-adapter-checks-failing
                    - dependency-unclaimed
                    - dependency-hidden
                    - dependency-deprecated
                    - governing-address-unregistered
                    - vault-paused
                    - compliance-service-unresolvable
                    - compliance-probe-unavailable
                  subject:
                    type: string
                    nullable: true
                    description: The one value to act on -- an address, or a formatted parameter value. Null when the rule names none.
                  summary:
                    type: string
                    description: One sentence naming the value that failed, not the requirement it failed.
                  remedy:
                    type: string
                    nullable: true
                    description: Which way out applies. Null when the answer is not the reader's to act on.
                    enum:
                    - have-euler-trust-the-hook-target
                    - restore-the-disabled-exit-operations
                    - make-the-vault-deposit-only
                    - set-an-interest-rate-model
                    - use-a-recognized-euler-router
                    - remove-the-router-fallback
                    - add-the-missing-oracle-route
                    - replace-the-oracle-adapter
                    - review-the-oracle-adapter
                    - move-router-governance-to-the-entity
                    - change-the-vault-parameter
                    - wait-for-the-dependency-verdict
                    - wait-for-euler-to-check-again
                    - unpause-the-vault
                    - remove-the-dependency
                    - register-the-address
                    - contact-euler
              exempted:
                type: boolean
                description: True when a platform rule exemption downgraded this finding to evidence.
        summary:
          type: object
          required:
          - passed
          - failed
          - unknown
          - notApplicable
          properties:
            passed:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
            unknown:
              type: integer
              minimum: 0
            notApplicable:
              type: integer
              minimum: 0
    LabelRowKey:
      description: Identifies one publishable row across the draft and every version.
      oneOf:
      - type: object
        required:
        - type
        - entityId
        properties:
          type:
            type: string
            enum:
            - entity
          entityId:
            type: string
      - type: object
        required:
        - type
        - chainId
        - productId
        properties:
          type:
            type: string
            enum:
            - product
          chainId:
            type: integer
          productId:
            type: string
      - type: object
        required:
        - type
        - chainId
        - address
        properties:
          type:
            type: string
            enum:
            - vault
          chainId:
            type: integer
          address:
            type: string
    GeoPolicy:
      type: object
      required:
      - id
      - countries
      - countriesResolved
      - policyType
      - createdAt
      - updatedAt
      - version
      - derivedFrom
      - createdBy
      - updatedBy
      properties:
        id:
          type: string
          format: uuid
        chainId:
          type: integer
          minimum: 1
          nullable: true
        productId:
          type: string
          nullable: true
        vaultAddress:
          type: string
          nullable: true
          pattern: ^0x[a-fA-F0-9]{40}$
        assetAddress:
          type: string
          nullable: true
          pattern: ^0x[a-fA-F0-9]{40}$
        assetSymbols:
          type: array
          nullable: true
          description: Case-insensitive exact symbol matchers.
          items:
            type: string
        assetSymbolRegex:
          type: string
          nullable: true
          maxLength: 512
          description: Case-insensitive regular expression matched against token symbols.
        assetNames:
          type: array
          nullable: true
          description: Case-insensitive exact token-name matchers.
          items:
            type: string
        assetNameRegex:
          type: string
          nullable: true
          maxLength: 512
          description: Case-insensitive regular expression matched against token names.
        countries:
          type: array
          minItems: 1
          description: As authored — ISO 3166-1 alpha-2 codes and group aliases (`EU`, `EEA`, `EFTA`). Unknown entries are rejected at write time.
          items:
            type: string
            minLength: 1
        countriesResolved:
          type: array
          readOnly: true
          description: Read-time expansion of `countries` — group aliases replaced by their current member codes, deduplicated and sorted. Consumers evaluate against this list; a rule authored with an alias tracks the bloc's current membership.
          items:
            type: string
        policyType:
          type: string
          enum:
          - block
          - restrict
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When the row last changed. Rows written before it was recorded carry their creation time.
        version:
          type: string
          nullable: true
          readOnly: true
          description: Opaque version of the row, `<updatedAt>|<changeId>`. Send it as `expectedVersion` with `POST /v3/changes` (domain `geo`, key the policy ID); a stale one records a superseded change instead of writing. Null on a derived row, which cannot be changed.
        derivedFrom:
          type: object
          nullable: true
          readOnly: true
          required:
          - policyId
          - assetAddress
          - relation
          - path
          description: Set on a row the server derives from a stored asset rule, null on a stored row. A derived row copies the rule's countries, type, reason and product or vault scope onto one token the app reaches that is built on an asset the rule selects (an ERC-4626 wrapper, an escrow, EVK or Earn share, an Earn allocation, a Pendle SY, PT, YT or LP). Shared code never derives a row. Its `id` is a stable UUID of version 8; it has no authors and is not writable.
          properties:
            policyId:
              type: string
              format: uuid
              description: The stored rule.
            assetAddress:
              type: string
              description: The asset the stored rule selects.
            relation:
              type: string
              enum:
              - erc4626
              - evk-share
              - escrow-share
              - earn-share
              - securitize-share
              - earn-allocation
              - pendle-pt
              - pendle-lp
              - pendle-sy
              - pendle-yt
              description: The last link from the derived token to the asset.
            path:
              type: array
              items:
                type: string
              description: From the derived token to the selected asset, both included.
        createdBy:
          $ref: '#/components/schemas/RowAuthor'
        updatedBy:
          $ref: '#/components/schemas/RowAuthor'
    LabelPublicationReport:
      description: 'What the snapshot builder did: `published` rows went live from the draft, `pulledIn` rows were needed by a selected row, `heldBack` rows carry a pending change a hold kept out (their own hold, a held dependency absent from the published version, or a held published row that still needs them), and `overrides` are held rows the selection published anyway.'
      type: object
      required:
      - published
      - pulledIn
      - heldBack
      - overrides
      - leftOut
      properties:
        published:
          type: array
          items:
            type: object
            required:
            - key
            - change
            properties:
              key:
                $ref: '#/components/schemas/LabelRowKey'
              change:
                type: string
                enum:
                - create
                - update
                - delete
        pulledIn:
          type: array
          items:
            type: object
            required:
            - key
            - change
            - requiredBy
            properties:
              key:
                $ref: '#/components/schemas/LabelRowKey'
              change:
                type: string
                enum:
                - create
                - update
                - delete
              requiredBy:
                $ref: '#/components/schemas/LabelRowKey'
        heldBack:
          type: array
          items:
            type: object
            required:
            - key
            - change
            - cause
            - holds
            - relatedKey
            properties:
              key:
                $ref: '#/components/schemas/LabelRowKey'
              change:
                type: string
                enum:
                - create
                - update
                - delete
              cause:
                type: string
                enum:
                - hold
                - depends-on-held
                - required-by-held
              holds:
                type: array
                items:
                  $ref: '#/components/schemas/LabelHoldRef'
              relatedKey:
                nullable: true
                allOf:
                - $ref: '#/components/schemas/LabelRowKey'
        overrides:
          type: array
          items:
            type: object
            required:
            - key
            - holds
            properties:
              key:
                $ref: '#/components/schemas/LabelRowKey'
              holds:
                type: array
                items:
                  $ref: '#/components/schemas/LabelHoldRef'
        leftOut:
          type: object
          required:
          - rows
          - selected
          description: 'Draft vault rows with no labels (the rows discovery materialises for vaults nobody claimed, claims cleared), which the publication leaves out: how many the draft holds, and which of them the selection named, a no-op rather than an error. A selection naming only such rows answers `publishOutcome: unchanged` with them listed here.'
          properties:
            rows:
              type: integer
              minimum: 0
            selected:
              type: array
              items:
                $ref: '#/components/schemas/LabelRowKey'
    LabelHold:
      description: A row held out of publication. A quarantine is a rejection of one row; an entity hold is raised by entity suspension and covers every row the entity owns. Held rows keep their published content on every full publish while the draft stays intact.
      type: object
      required:
      - id
      - kind
      - resource
      - reason
      - contentHash
      - heldBy
      - createdAt
      - releasedAt
      - releasedBy
      - releaseReason
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - quarantine
          - entity-hold
        resource:
          $ref: '#/components/schemas/LabelRowKey'
        reason:
          type: string
        contentHash:
          type: string
          nullable: true
          description: Hash of the draft row when the hold was raised; null when the draft lacked the row.
        heldBy:
          $ref: '#/components/schemas/LabelHoldActor'
        createdAt:
          type: string
          format: date-time
        releasedAt:
          type: string
          format: date-time
          nullable: true
        releasedBy:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/LabelHoldActor'
        releaseReason:
          type: string
          nullable: true
          description: 'Why the hold was released, when the release gave a reason: a quarantine release, or the entity resume that lifted an entity hold. Null while the hold is active.'
    LabelPublishDryRunResult:
      type: object
      required:
      - dryRun
      - publishOutcome
      - latestVersion
      - report
      - changes
      - draftToken
      properties:
        dryRun:
          type: boolean
          enum:
          - true
        publishOutcome:
          type: string
          enum:
          - published
          - unchanged
          description: What the same request without `dryRun` would do.
        latestVersion:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/LabelVersion'
        report:
          $ref: '#/components/schemas/LabelPublicationReport'
        changes:
          type: array
          description: 'What publishing would change, row by row: the report''s `published` and `pulledIn` rows with their content on both sides, then the `heldBack` rows (`held: true`) with the draft content a lifted hold would publish. This is the exact answer to "what would publishing change", computed by the same comparison publication uses, so it covers every difference between the draft and the latest version, including writes the change log never sees.'
          items:
            $ref: '#/components/schemas/LabelPublicationRowChange'
        draftToken:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Opaque token for exactly what this preview would publish, including the holds a partial publish would override. Send it back as `expectedDraftToken` to publish only if nothing moved since.
    LabelHoldRef:
      type: object
      required:
      - id
      - kind
      - reason
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - quarantine
          - entity-hold
        reason:
          type: string
    LabelPublishResult:
      allOf:
      - $ref: '#/components/schemas/LabelVersion'
      - type: object
        required:
        - publishOutcome
        - report
        properties:
          publishOutcome:
            type: string
            enum:
            - published
            - unchanged
            description: Whether this request created a snapshot or returned the unchanged latest snapshot.
          report:
            $ref: '#/components/schemas/LabelPublicationReport'
    VaultAssessmentPreviewSecuritize:
      allOf:
      - $ref: '#/components/schemas/VaultAssessmentPreviewBase'
      - type: object
        required:
        - family
        - policyId
        properties:
          family:
            type: string
            enum:
            - securitize
          policyId:
            type: string
            enum:
            - euler-securitize
          findings:
            type: array
            items:
              allOf:
              - $ref: '#/components/schemas/VaultConfigFinding'
              - type: object
                properties:
                  key:
                    type: string
                    x-finding-keys:
                    - operations.not-paused
                    - compliance.ds-token-wiring
                    - evidence.controller-perspective
                    - evidence.asset
                    - evidence.supply-cap
                    - evidence.multisig
                    - evidence.freeze-activity
                    - evidence.seize-activity
          appliedOverrides:
            type: array
            maxItems: 0
            items:
              type: string
            description: Always empty; this vault kind accepts no overrides.
          notSimulated:
            type: array
            maxItems: 0
            items:
              type: string
            description: Always empty; nothing is simulated for this vault kind.
    AttributedLabelVersion:
      allOf:
      - $ref: '#/components/schemas/LabelVersion'
      - type: object
        required:
        - createdBy
        - createdByEmail
        - publishedBy
        - publishedByEmail
        properties:
          createdBy:
            type: string
            nullable: true
            description: Present for platform sessions; API keys see null.
          createdByEmail:
            type: string
            nullable: true
            description: The email of the platform administrator `createdBy` names, for display. Present for platform sessions when the id is a known administrator; null otherwise and for API keys.
          publishedBy:
            type: string
            nullable: true
            description: Platform administrator id, worker id, or API key id, matching `publishedByKind`. Present for platform sessions; API keys see null.
          publishedByEmail:
            type: string
            nullable: true
            description: The email of the platform administrator `publishedBy` names when `publishedByKind` is `platform-admin`, for display. Present for platform sessions; null for the worker, for keys, and for API key sessions.
          publishedChanges:
            type: integer
            minimum: 0
            description: Change-log rows this version carried; present on the version history.
    LabelChange:
      type: object
      required:
      - id
      - resource
      - ownerEntityId
      - action
      - initialAction
      - before
      - after
      - afterContentHash
      - changedFields
      - actor
      - requestId
      - status
      - publishedVersionId
      - holdId
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        resource:
          $ref: '#/components/schemas/LabelRowKey'
        ownerEntityId:
          type: string
          nullable: true
        action:
          type: string
          enum:
          - create
          - update
          - delete
          - claim
          - unclaim
          - restore
          - scoped-restore
          - transfer
          description: '`restore` marks a row a whole-draft restore brought back; `scoped-restore` one that a restore limited to a curator, products or vaults brought back; `transfer` a row the platform moved to another curator.'
        initialAction:
          type: string
          enum:
          - create
          - update
          - delete
          - claim
          - unclaim
          - restore
          - scoped-restore
          - transfer
          description: The action the row first waited with. A later write to the same row supersedes its pending change and carries this forward, so a claim followed by an edit still reads as a claim until it is published. Equals `action` when nothing was superseded.
        before:
          type: object
          nullable: true
          additionalProperties: true
        after:
          type: object
          nullable: true
          additionalProperties: true
        afterContentHash:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{64}$
          description: 'Hash of `after` as a draft row; null when the change deleted the row. On a row''s `pending` or `quarantined` change it is the current draft row''s hash: send it as a hold''s or release''s `expectedContentHash`.'
        changedFields:
          type: array
          items:
            type: string
        actor:
          type: object
          required:
          - kind
          - id
          - email
          properties:
            kind:
              type: string
              enum:
              - platform-admin
              - entity-admin
              - entity-editor
              - api-key
              - system
            id:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
        requestId:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - pending
          - published
          - quarantined
          - superseded
        publishedVersionId:
          type: string
          format: uuid
          nullable: true
        holdId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
    LabelPublicationRowChange:
      type: object
      required:
      - key
      - change
      - before
      - after
      - changedFields
      - held
      properties:
        held:
          type: boolean
          description: 'True for a row a hold keeps out of this publication: it is listed in the report''s `heldBack`, is not taken, and its `after` is the draft content the hold keeps out.'
        key:
          $ref: '#/components/schemas/LabelRowKey'
        change:
          type: string
          enum:
          - create
          - update
          - delete
        before:
          type: object
          nullable: true
          additionalProperties: true
          description: The complete row as the latest published version carries it, in the published shape (every published field, no timestamps or assignment); null for a create.
        after:
          type: object
          nullable: true
          additionalProperties: true
          description: The complete row as the new version would carry it (for a held row, as the draft has it), in the published shape; null for a delete.
        changedFields:
          type: array
          items:
            type: string
          description: The fields whose value differs between `before` and `after`, sorted.
    RowAuthor:
      type:
      - object
      - 'null'
      description: 'Who wrote the row: a platform admin by id, or a system actor such as `admin-secret` or `euler-labels-unified-importer`. Shown only to a platform session whose operator is on the Toolbox admin allowlist; null for every other reader, and for rows written before authors were recorded.'
      required:
      - kind
      - id
      properties:
        kind:
          type: string
        id:
          type: string
    VaultConfigPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        overrides:
          $ref: '#/components/schemas/VaultConfigOverrides'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
              description: 'Domain error code. Examples:

                - BAD_REQUEST

                - INVALID_ADDRESS

                - INVALID_CHAIN_ID

                - CHAIN_NOT_SUPPORTED

                - CHAIN_CAPABILITY_DISABLED

                - NOT_FOUND

                - VAULT_NOT_FOUND

                - TOKEN_NOT_FOUND

                - ACCOUNT_NOT_FOUND

                - VALIDATION_ERROR

                - CONFLICT

                - PRECONDITION_FAILED

                - PAYLOAD_TOO_LARGE

                - RATE_LIMIT_EXCEEDED

                - UNSUPPORTED_MEDIA_TYPE

                - UPSTREAM_TIMEOUT

                - UNAUTHORIZED

                - FORBIDDEN

                - SERVICE_UNAVAILABLE

                - SERVICE_DISABLED

                - INTERNAL_ERROR

                '
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: true
              description: Context of the error. Where present, `details.reason` is a stable kebab-case value to key on, and `details.cause` narrows a reason that has several causes. The labels routes list theirs in the Labels tag.
    ListingFlag:
      type: boolean
      nullable: true
      description: Curator listing flag. `null` leaves the decision to platform overrides and deprecation, `true` hides the vault(s) from discovery, `false` keeps a deprecated vault listed.
    VaultLabels:
      type: object
      required:
      - chainId
      - address
      - vaultType
      - isEscrow
      - isDeprecated
      - notExplorableLend
      - notExplorableBorrow
      - tags
      - resolved
      - createdAt
      - updatedAt
      properties:
        chainId:
          type: integer
          minimum: 1
        address:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        vaultType:
          type: string
          enum:
          - evk
          - earn
          - securitize
          description: 'Vault family derived from indexed discovery. An escrow vault is `evk` with `isEscrow: true`.'
        isEscrow:
          type: boolean
          description: True for an EVK vault the escrow perspective has verified as collateral-only. Derived by Euler from the perspective and never accepted in a request body; such a vault has no entity, no product and no curator listing flags.
        visibility:
          oneOf:
          - $ref: '#/components/schemas/VaultVisibilitySummary'
          - $ref: '#/components/schemas/VaultVisibility'
          nullable: true
          description: 'Present only on `GET /v3/labels/vaults?include=visibility`: the row''s visibility verdict, or null when none has been evaluated yet. The public summary for most readers; the record as evaluated (`VaultVisibility`) when the route has authenticated a platform session.'
        productId:
          type: string
          nullable: true
        entityId:
          type: string
          nullable: true
          description: Entity associated through verified on-chain ownership, or null for unclaimed and escrow vaults.
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        portfolioNotice:
          type: string
          nullable: true
        isDeprecated:
          type: boolean
        deprecationReason:
          type: string
          nullable: true
        notExplorableLend:
          allOf:
          - $ref: '#/components/schemas/ListingFlag'
          description: Curator lend-side listing flag; overrides the product flag for this vault.
        notExplorableBorrow:
          allOf:
          - $ref: '#/components/schemas/ListingFlag'
          description: Curator borrow-side listing flag; overrides the product flag for this vault. Earn vaults have no borrow side and reject `true`.
        tags:
          type: array
          description: Union of entity-managed label tags and platform-managed assessment tags, sorted, deduplicated. The label row may only carry the curator vocabulary (`keyring`, `access control`, `governance limited`, `suppress high utilisation warning`, `cyclical note`); every other tag (`recently added` and the Base app's `base` included) can only come from the assessment, so a non-vocabulary tag here was set by the platform. Published reads union the published row with the live assessment.
          items:
            type: string
        campaigns:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/LabelCampaign'
        resolved:
          $ref: '#/components/schemas/ResolvedVaultLabels'
        assignedBy:
          type: string
          nullable: true
          description: The platform administrator who assigned the vault to its curator (a platform registration or transfer); null for a curator's own claim and on published reads. Layer 2 verifies an assigned vault whose governing address (the governor of an EVK or Securitize vault, the owner of an Earn vault) is the zero address.
        assignedAt:
          type: string
          format: date-time
          nullable: true
          description: When Euler assigned the vault; null when `assignedBy` is null.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        hold:
          type: object
          nullable: true
          description: The hold covering this row on a draft read; absent on published reads.
          allOf:
          - $ref: '#/components/schemas/LabelHoldSummary'
    LabelHoldSummary:
      description: What a draft read shows on a held row.
      type: object
      required:
      - id
      - kind
      - reason
      - since
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - quarantine
          - entity-hold
        reason:
          type: string
        since:
          type: string
          format: date-time
    VaultAssessmentPreview:
      description: 'What a fresh Layer 1 check would say, in the shape of the vault''s kind: `family` names the variant. EVK previews may carry applied overrides and findings whose simulation could not run; Earn and Securitize previews accept no overrides and answer both lists empty. Each variant lists the finding keys its policy can produce.'
      oneOf:
      - $ref: '#/components/schemas/VaultAssessmentPreviewEvk'
      - $ref: '#/components/schemas/VaultAssessmentPreviewEarn'
      - $ref: '#/components/schemas/VaultAssessmentPreviewSecuritize'
      discriminator:
        propertyName: family
        mapping:
          evk: '#/components/schemas/VaultAssessmentPreviewEvk'
          earn: '#/components/schemas/VaultAssessmentPreviewEarn'
          securitize: '#/components/schemas/VaultAssessmentPreviewSecuritize'
    ConfigTrustEntry:
      type: object
      required:
      - id
      - chainId
      - kind
      - address
      - ruleKey
      - label
      - fingerprint
      - provider
      - sessionBound
      - maxSilenceSeconds
      - createdAt
      - updatedAt
      - version
      - createdBy
      - updatedBy
      properties:
        id:
          type: string
          format: uuid
        chainId:
          type: integer
        kind:
          type: string
          enum:
          - hook-target
          - rule-exemption
          - custom-adapter
          - adapter-check-exemption
        address:
          type: string
          description: Hook target address for hook-target entries; vault address for rule-exemption entries; oracle adapter address for custom-adapter and adapter-check-exemption entries.
        ruleKey:
          type: string
          nullable: true
          description: Exempted finding key (rule-exemption entries only), e.g. `collateral.0x....ltv`; for adapter-check-exemption entries, the adapter health check key that is accepted.
        label:
          type: string
          nullable: true
        fingerprint:
          type: string
          nullable: true
          pattern: ^0x[0-9a-f]{64}$
          description: Metadata-stripped runtime bytecode SHA-256 (custom-adapter entries only).
        provider:
          type: string
          nullable: true
          description: Curated provider identity (custom-adapter entries only).
        sessionBound:
          type: boolean
          description: 'Custom-adapter entries only: the reviewed adapter pauses outside trading sessions. A quote revert on one of its routed pairs is then excused (`not_applicable`) when that pair quoted successfully within `maxSilenceSeconds`, measured from the last successful quote v3 observed on the pair. A pair silent longer, or never seen quoting, still fails.'
        maxSilenceSeconds:
          type: integer
          nullable: true
          description: Set exactly when `sessionBound`; between 3600 and 604800 (seven days, the closure bound of the modeled session-bound adapters).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When the row last changed. Rows written before it was recorded carry their creation time.
        version:
          type: string
          description: '`toolbox:<updatedAt>`; the `expectedVersion` of a `trust-entries` change. Trust entries are never edited in place, so it moves only when the entry is replaced.'
        createdBy:
          $ref: '#/components/schemas/RowAuthor'
        updatedBy:
          $ref: '#/components/schemas/RowAuthor'
    VaultVisibility:
      type: object
      required:
      - chainId
      - vaultAddress
      - status
      - checks
      - source
      - evaluatedAt
      properties:
        chainId:
          type: integer
        vaultAddress:
          type: string
        status:
          type: string
          enum:
          - visible
          - warning
          - hidden
          - pending_review
        checks:
          type: object
          additionalProperties: true
          description: 'Decision evidence: `decidedBy`, `reason`, layer statuses, the resolved deprecation, the platform `notExplorable*` overrides as authored, and `listing` — the effective per-side discovery result (`{ lend: { hidden, decidedBy }, borrow: { hidden, decidedBy } }`) after platform overrides, curator flags, and deprecation.'
        source:
          type: string
        evaluatedAt:
          type: string
          format: date-time
          nullable: true
    LabelQuarantineRequest:
      type: object
      additionalProperties: false
      required:
      - resource
      - reason
      properties:
        resource:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - type
            - entityId
            properties:
              type:
                type: string
                enum:
                - entity
              entityId:
                type: string
          - type: object
            additionalProperties: false
            required:
            - type
            - chainId
            - id
            properties:
              type:
                type: string
                enum:
                - product
              chainId:
                type: integer
              id:
                type: string
          - type: object
            additionalProperties: false
            required:
            - type
            - chainId
            - address
            properties:
              type:
                type: string
                enum:
                - vault
              chainId:
                type: integer
              address:
                type: string
        reason:
          type: string
          maxLength: 500
        expectedContentHash:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{64}$
          description: 'The draft revision the reviewer judged: the change log''s `afterContentHash` for the row (null for a row the draft no longer has). Compared with the current draft row inside the write''s transaction; when the row moved since, the answer is 412 with `details.reason` `stale-review` and the current `details.contentHash`, and nothing is written. Optional for now; keys will have to send it, and a key write without it is logged.'
    VaultConfigFinding:
      description: One Layer 1 finding, as in `VaultConfigAssessmentContext.findings`.
      type: object
      required:
      - key
      - outcome
      - required
      - description
      properties:
        key:
          type: string
        outcome:
          type: string
          enum:
          - pass
          - fail
          - unknown
          - not_applicable
        required:
          type: boolean
        description:
          type: string
        expected: {}
        observed: {}
        cause:
          type: object
          description: 'Why this is not a pass. On `fail` and `unknown` it is the failure; on `not_applicable` it is why the rule did not run, and its absence on an `evidence.*` row is what separates a skipped check from an observation. The rule key alone cannot say: `hooks.zero-or-trusted` fails either because the hook target is untrusted or because a zero target disabled an exit operation, and those have opposite remedies. Switch on `code`; `subject` is the value to act on; `summary` is one sentence naming it, and is what `configReason` carries for the blocking finding.'
          required:
          - code
          - subject
          - summary
          - remedy
          properties:
            code:
              type: string
              enum:
              - deposit-only-vault
              - feed-revert-tolerated
              - curator-unset
              - owner-renounced
              - vault-lens-reverted
              - not-a-recognized-evault
              - deployment-record-unavailable
              - liability-asset-is-evault
              - evc-compatible-asset-flag-set
              - hook-target-untrusted
              - exit-operations-disabled
              - oracle-unset
              - unit-of-account-unset
              - interest-rate-model-unset
              - router-not-recognized
