          type: object
          nullable: true
          description: Euler's listing override on this product, shown to platform sessions on draft reads (null when there is none); absent on published reads and to curators.
          allOf:
          - $ref: '#/components/schemas/ProductPlatformListing'
    VaultAssessment:
      type: object
      required:
      - chainId
      - vaultAddress
      - configStatus
      - checksStatus
      - configContext
      - consistencyStatus
      - consistencyContext
      - riskStatus
      - isDeprecated
      - notExplorable
      - notExplorableLend
      - notExplorableBorrow
      - tags
      - schedulingTier
      - nextCheckAt
      - configFailedAttempts
      - configLastFailedAt
      - createdAt
      properties:
        chainId:
          type: integer
          minimum: 1
        vaultAddress:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
        configStatus:
          type: string
          enum:
          - unverified
          - pending
          - verified
          - suspended
          - revoked
          description: 'Layer 1 (on-chain configuration safety) lifecycle. `unverified`: never verified, or the first check failed (`configContext.outcome` is `fail`). `verified`: the configuration policy passed. `suspended`: a re-check failed after the vault had been verified. `revoked`: set manually by a platform admin. `pending`: a platform admin requested a re-check through the PATCH endpoint; the automatic loop never writes this value. A due check is signalled by a non-null `configCheckAt`, not by the status, and a passing status is left unchanged while re-checks run.'
        configReason:
          type: string
          nullable: true
        checksStatus:
          type: string
          enum:
          - positive
          - warning
          - negative
          nullable: true
          description: 'Health of the advisory findings, orthogonal to the gating verdict in `configStatus`: the rules that disclose a curator''s judgment call rather than suspend a vault. Null when the policy emitted no advisory finding. Same axis and vocabulary as an oracle adapter''s `checksStatus`; a vault advisory never condemns, so this does not reach `negative`.'
        configContext:
          $ref: '#/components/schemas/VaultConfigAssessmentContext'
        configCheckAt:
          type: string
          format: date-time
          nullable: true
          description: When the next Layer 1 check is due. Non-null means an on-chain change or a manual request is awaiting a check; cleared when the check completes.
        configLastCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: When Layer 1 last completed a check, whatever the outcome.
        configFailedAttempts:
          type: integer
          minimum: 0
          description: 'Layer 1 checks that failed to finish since the last completed one: the RPC was unreachable, or a read the policy needs was not answered. Each failure pushes the next check back, from 5 minutes and doubling up to 6 hours; an on-chain change still triggers a check at once. Back to 0 when a check completes.'
        configLastFailedAt:
          type: string
          format: date-time
          nullable: true
          description: When the latest of those failures happened; null once a check completes.
        schedulingTier:
          type: string
          enum:
          - active
          - background
          - static
          description: 'Which periodic sweep re-checks the vault. `active` (hourly): labeled and not deprecated in the latest published version, or total supply worth at least 100,000 USD, or a collateral or Earn strategy of such a vault; Layer 1''s verdict plays no part, so a hidden vault stays hourly. `background` (daily): everything else. `static` (never swept): escrow vaults, whose configuration cannot change. Governance events trigger an immediate check whatever the tier. On a chain this deployment does not index the tier is the stored default and `nextCheckAt` is null: no sweep reaches the row.'
        nextCheckAt:
          type: string
          format: date-time
          nullable: true
          description: 'When the next Layer 1 check is expected: `configCheckAt` when a check is scheduled, else the last check plus the tier''s sweep interval; null for a vault never checked with nothing scheduled, and for a static vault with nothing scheduled.'
        configVerifiedAt:
          type: string
          format: date-time
          nullable: true
          description: When the vault last passed Layer 1.
        consistencyStatus:
          type: string
          enum:
          - not_applicable
          - pending
          - verified
          - suspended
          - revoked
          description: 'Layer 2 (label to chain consistency) lifecycle. `not_applicable`: nothing to check (escrow or unclaimed vault). `verified`: the labels agree with the current on-chain governor or owner and with product membership, and an Earn vault''s required `consistencyContext` findings pass. `suspended`: an inconsistency was detected, such as a governor outside the entity''s addresses, a product mixing governed and ungoverned vaults, or an Earn vault''s unclaimed dependency or unregistered owner or curator; resolution is a platform-admin action. `revoked`: set manually by a platform admin. `pending`: a re-check was requested manually, or the first check could not read chain state and will retry.'
        consistencyReason:
          type: string
          nullable: true
          description: The Layer 2 verdict in one sentence, for display. For a `suspended` Earn vault it is the `cause.summary` of the first required finding that failed. The findings themselves, with their keys and outcomes, are in `consistencyContext`; key on those, not on this sentence.
        consistencyContext:
          $ref: '#/components/schemas/VaultConsistencyContext'
        consistencyCheckAt:
          type: string
          format: date-time
          nullable: true
          description: When the next Layer 2 check is due. Set by governance events on chain and by manual requests, and for an Earn vault also by configuration events of the vault, its strategies and their collaterals, by label publications that change a dependency's standing, and by registration changes of its owner or curator; label mutations run their check synchronously instead.
        consistencyLastCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: When Layer 2 last completed a check, whatever the outcome.
        riskStatus:
          type: string
          enum:
          - unverified
          - pending
          - ok
          - warning
          - critical
          - suspended
          - revoked
          description: 'Layer 3 (risk context) lifecycle. Not yet automated: no worker writes this field, so it stays `unverified` unless a platform admin sets it through the PATCH endpoint.'
        riskContext:
          type: object
          nullable: true
          additionalProperties: true
        riskAssessedAt:
          type: string
          format: date-time
          nullable: true
        isDeprecated:
          type: boolean
        deprecationReason:
          type: string
          nullable: true
        notExplorable:
          type: boolean
        notExplorableLend:
          type: boolean
        notExplorableBorrow:
          type: boolean
        tags:
          type: array
          description: Platform-managed tags. Every tag outside the curator vocabulary lives here (`recently added`, the Base app's `base`); vault reads union them with the label row's vocabulary tags.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
          nullable: true
        platformUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: When a platform admin (or the label import) last wrote this assessment; null while the vault has no stored assessment. The checks never move it. The ETag of GET and PATCH is this value quoted.
    VaultAssessmentPreviewEvk:
      allOf:
      - $ref: '#/components/schemas/VaultAssessmentPreviewBase'
      - type: object
        required:
        - family
        - policyId
        properties:
          family:
            type: string
            enum:
            - evk
          policyId:
            type: string
            enum:
            - euler-evk
          findings:
            type: array
            items:
              allOf:
              - $ref: '#/components/schemas/VaultConfigFinding'
              - type: object
                properties:
                  key:
                    type: string
                    x-finding-keys:
                    - configuration.lens-readable
                    - deployment.recognized-factory
                    - deployment.no-evault-nesting
                    - configuration.evc-compatible-asset
                    - hooks.zero-or-trusted
                    - market.oracle-present
                    - market.unit-of-account-present
                    - market.interest-rate-model-present
                    - oracle.recognized-router
                    - oracle.no-fallback
                    - oracle.liability-route
                    - oracle.liability-quote
                    - oracle.adapters-recognized
                    - oracle.adapters-checks
                    - irm.rate-computation
                    - irm.max-apy
                    - governance.router
                    - liquidation.max-discount
                    - liquidation.cool-off
                    - evidence.vault-mode
                    - evidence.upgradeable
                    - evidence.unit-of-account
                    - evidence.interest-fee
                    - evidence.fee-receiver
                    - evidence.governance
                    - evidence.multisig
                    - evidence.caps
                    - evidence.interest-rate-model
                    - evidence.debt-socialization
                    - evidence.inert-collateral-entries
                    - evidence.route-adapters
                    - evidence.resolved-vaults
                    - evidence.liability-price
                    - evidence.pyth-unserved-feeds
                    - evidence.pyth-recovery-issues
                    x-finding-key-namespaces:
                    - pattern: collateral.<address>.<rule>
                      policies:
                      - euler-evk
                      rules:
                      - ltv
                      - route
                      - recognized
                      - ramp
                      - price
                      - quote
    VaultConfigOverrides:
      description: A proposed EVK vault configuration as changes to the live one. Every kind is optional; addresses are 0x-prefixed, LTVs and caps are decimal integer strings in the units the assessment reports them (basis points for LTVs, resolved asset units for caps).
      type: object
      additionalProperties: false
      properties:
        caps:
          type: object
          additionalProperties: false
          properties:
            supplyCap:
              type: string
              pattern: ^\d+$
            borrowCap:
              type: string
              pattern: ^\d+$
        collaterals:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - collateral
            properties:
              collateral:
                type: string
                pattern: ^0x[a-fA-F0-9]{40}$
              borrowLTV:
                type: string
                pattern: ^\d+$
              liquidationLTV:
                type: string
                pattern: ^\d+$
              initialLiquidationLTV:
                type: string
                pattern: ^\d+$
              targetTimestamp:
                type: integer
                minimum: 0
              rampDuration:
                type: integer
                minimum: 0
              remove:
                type: boolean
                description: Drop the collateral row instead of changing it.
        interestRateModel:
          type: object
          additionalProperties: false
          required:
          - address
          properties:
            address:
              type: string
              pattern: ^0x[a-fA-F0-9]{40}$
        resolvedVaults:
          type: array
          maxItems: 50
          description: '`govSetResolvedVault(vault, resolved)` on the vault''s router: the entry the lens would report after it (the vault, its asset, the unit of account, the unwrap chain) is added or removed, so a route staged in the same batch on the vault''s asset prices it. A vault with an adapter configured for itself keeps answering through it either way, as the router reads the configured pair before any resolution.'
          items:
            type: object
            additionalProperties: false
            required:
            - vault
            - resolved
            properties:
              vault:
                type: string
                pattern: ^0x[a-fA-F0-9]{40}$
              resolved:
                type: boolean
        oracleRoutes:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - base
            properties:
              base:
                type: string
                pattern: ^0x[a-fA-F0-9]{40}$
              quote:
                type: string
                pattern: ^0x[a-fA-F0-9]{40}$
                description: Defaults to the vault's unit of account.
              adapter:
                type: string
                pattern: ^0x[a-fA-F0-9]{40}$
                description: Required unless `remove` is true.
              remove:
                type: boolean
        hooks:
          type: object
          additionalProperties: false
          properties:
            hookTarget:
              type: string
              pattern: ^0x[a-fA-F0-9]{40}$
            hookedOperations:
              type: object
              additionalProperties: false
              properties:
                deposit:
                  type: boolean
                mint:
                  type: boolean
                withdraw:
                  type: boolean
                redeem:
                  type: boolean
                transfer:
                  type: boolean
                skim:
                  type: boolean
                borrow:
                  type: boolean
                repay:
                  type: boolean
                repayWithShares:
                  type: boolean
                pullDebt:
                  type: boolean
                convertFees:
                  type: boolean
                liquidate:
                  type: boolean
                flashloan:
                  type: boolean
                touch:
                  type: boolean
                vaultStatusCheck:
                  type: boolean
    LabelHoldActor:
      type: object
      required:
      - kind
      - id
      - email
      properties:
        kind:
          type: string
          enum:
          - platform-admin
          - api-key
          - system
        id:
          type: string
          nullable: true
          description: Returned to platform sessions only; keys see null.
        email:
          type: string
          nullable: true
          description: The platform administrator's email, for display next to the id. Returned to platform sessions only; null for keys, the system, and key sessions.
    LabelPublicationSummary:
      type: object
      required:
      - mode
      - suspended
      - dueAt
      - latestVersion
      properties:
        mode:
          type: string
          enum:
          - manual
          - scheduled
          description: How changes go live; see `LabelPublicationState.mode`.
        suspended:
          type: boolean
          description: Automatic publication is suspended (relevant in `scheduled` mode).
        dueAt:
          type: string
          format: date-time
          nullable: true
          description: When the pending draft is due in `scheduled` mode; null when nothing is pending or the mode is `manual`.
        latestVersion:
          type: object
          nullable: true
          required:
          - versionKey
          - publishedAt
          properties:
            versionKey:
              type: string
            publishedAt:
              type: string
              format: date-time
              nullable: true
    VaultListingDecidedBy:
      type: string
      description: 'Who decided one discovery side''s listing, nearest explicit decision first: `platform` (assessment override), `escrow` (lend side of an escrow vault, set by Euler automatically), `curator` (vault-level flag), `curator-product` (product-level flag), `deprecated` (resolved deprecation with no curator flag), or `none` (shown, nothing decided).'
      enum:
      - platform
      - escrow
      - curator
      - curator-product
      - deprecated
      - none
  parameters:
    LabelVersionParam:
      name: version
      in: query
      required: false
      description: Version selector. Omission, `latest`, and `production` select the latest published snapshot. Explicit `current` and `draft` select the mutable working copy and require an authorized session as documented by the endpoint. Other published keys and aliases retain their stored casing.
      schema:
        type: string
        default: latest
    AddressPath:
      name: address
      in: path
      required: true
      schema:
        type: string
    LimitParam:
      name: limit
      in: query
      required: false
      description: Requested page size. Values above the endpoint cap are clamped; the default shared cap is 100.
      schema:
        type: integer
        minimum: 1
        default: 20
        maximum: 100
    OffsetParam:
      name: offset
      in: query
      required: false
      description: Page offset, capped at 10000 to bound query cost.
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    LabelSetParam:
      name: labelSet
      in: query
      required: false
      description: Label set identifier. Defaults to `public`.
      schema:
        type: string
        default: public
    ChainIdPath:
      name: chainId
      in: path
      required: true
      schema:
        type: integer
    LabelViewParam:
      name: view
      in: query
      required: false
      schema:
        type: string
        enum:
        - curation
        - resolved
        default: curation
      description: Read view. `curation` (default) returns raw label fields with the resolved block nested, mirroring the write schema so read-modify-write round-trips stay safe. `resolved` returns the display cascade flattened to the top level with raw fields omitted, for read-only consumers. Unknown values are rejected with 400.
    LabelSetIdPath:
      name: labelSetId
      in: path
      required: true
      description: Label set identifier.
      schema:
        type: string
  headers:
    AssessmentETag:
      description: The assessment's `platformUpdatedAt` in double quotes; absent while the vault has no stored assessment. Send it back as `If-Match` on the next PATCH.
      schema:
        type: string
    X-Label-Version-Id:
      description: The resolved published version's id. Absent on `current` and `draft` reads. It is not accepted as a `version=` selector; pin on `X-Label-Version`.
      schema:
        type: string
        format: uuid
    X-Label-Set:
      description: The label set this read resolved, for example `public`.
      schema:
        type: string
    X-Request-Id:
      description: Request identifier for tracing.
      schema:
        type: string
    X-Label-Version:
      description: The label version this read resolved. For a published read it is the version's key (`latest`, `production` and other aliases resolve to it, for example `v20260929144948869`); send it back as `version=` to pin later reads to the same snapshot. For a `current` or `draft` read it is `draft`.
      schema:
        type: string
  responses:
    LabelContextNotFound:
      description: 'The label set or version could not be resolved: `labelSet` names no label set, `version` matches no published key or alias, or a `current` or `draft` read names a set other than `public`. This is the only 404 of the label reads that carries `details.labelSet` and `details.version`, which echo the request; a missing row never does, so a client can tell "this label set or version does not exist" from "this row is not labelled".'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Forbidden
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: Conflict
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error400:
      description: Bad request
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error500:
      description: Internal server error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error503:
      description: Service unavailable
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404ChainCapability:
      description: 'Not found, or `CHAIN_CAPABILITY_DISABLED`: a requested chain does not run the capability the operation needs (see `capabilities` on `/v3/chains`), named in `x-chain-capability` or, where it depends on the request, in the parameter. `details.chainIds` lists those chains and `details.capability` names the capability.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CHAIN_CAPABILITY_DISABLED
              message: Chain(s) 137 do not run prices
              requestId: req_example
              details:
                chainIds:
                - 137
                capability: prices
    Error412:
      description: Precondition failed
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error415:
      description: Unsupported media type
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error422:
      description: Validation error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Not found
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error413:
      description: Request body too large
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error401:
      description: Unauthorized
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key authentication (optional; higher rate limits).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'Alternative to X-API-Key using Authorization: Bearer <key>'
